title: Статистика и ресурс комплектующих
head1: Функции станка
refs: |
  Параметры см. [Экраны статистики и ресурса комплектующих](section_8.html)
blocks:
  - h3: Статистика обработки
    body:
      - p: Клавиша **обработка статистика** справа на стартовой странице открывает экран только после включения в конфигурации станка **Обработка статистики** (иначе нажатие ничего не делает); для области жизненного цикла правящего круга нужно также **Статистика жизненного цикла правящего круга**
      - steps:
          - t: Нажмите **обработка статистика** справа на стартовой странице (положение 3 ключа)
            img: {src: stats.png, h: 300}
          - Таблица записывает для каждого номера круга число деталей и дату замены; после замены круга и запуска правки нового круга запись следующего круга начинается автоматически (учитываются только детали в режиме Массовое)
          - Область жизненного цикла правящего круга показывает число правок и суммарную величину правки; при достижении предела выдаётся сообщение о замене
          - После замены правящего круга нажмите **сброс счетчика** и подтвердите; для очистки всех записей кругов нажмите **сбросить статистику** и подтвердите
  - h3: Ресурс комплектующих
    body:
      - p: Клавиша **Аксессуары Жизнь** справа на стартовой странице открывает экран только после включения в конфигурации станка **Интерфейс отображения срока службы запасных частей** (иначе нажатие ничего не делает)
      - steps:
          - t: Нажмите **Аксессуары Жизнь** справа на стартовой странице
            img: {src: parts_life.png, h: 300}
          - Для каждой детали задайте ресурс и порог тревоги и включите **Сообщ. трев.**
          - Текущий ресурс считается автоматически; после превышения порога станок останавливается при запуске программы с сообщением о замене
          - После замены детали нажмите значок ↺ справа в её строке; текущий ресурс обнуляется и записывается время сброса
          - t: Нажмите справа **Журнал рол.**, чтобы посмотреть номера и даты всех замен роликов
            img: {src: roller_record.png, h: 300}
