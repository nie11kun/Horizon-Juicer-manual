title: Шлифование
head1: Функции станка
refs: 'Параметры см. [Экран шлифования](section_1.html) и [Экран процесса](section_2.html)

  '
blocks:
- h3: Порядок шлифования
  body:
  - steps:
    - '?ifIsCenter: Шлифовальный центр: подсветите справа на экране выбора обработки нужные операции'
    - До шлифования должны быть выполнены правка нового круга и наладка
    - t: "Выберите на экране шлифования [Режим обработки](section_1.html#S1D1): **Единичн** для пробного шлифования первой детали, **Массовое** после подтверждения размера"
      img:
        src: grind_main_int.png
        h: 300
      marks:
      - ifIsInternal
    - t: "Выберите на экране шлифования [Режим обработки](section_1.html#S1D1): **Единичн** для пробного шлифования первой детали, **Массовое** после подтверждения размера"
      img:
        src: grind_main_ext.png
        h: 300
      marks:
      - ifIsExternal
    - t: Откройте экран процесса и задайте по припуску направление, проходы, подачу, правку, линейную скорость круга и частоту бабки для этапов Черновая, Получистовая, Чистовая и Финишная
      img:
        src: process_batch.png
        h: 300
    - Выключите клавиши правки и наладки и нажмите **CYCLE START** для начала шлифования
    - Во время шлифования строка сообщений показывает текущий этап, проход и подачу
    - После обработки измерьте деталь и скорректируйте по результату (см. ниже «Коррекция после шлифования»)
  - note: 'Замечания по настройке процесса:

      Подача задаётся на сторону (по радиусу)

      Для двунаправленного шлифования смысл подачи задаётся конфигурацией станка (сумма за двойной ход или подача на каждый ход)

      Правка: например, этап Черновая 5 проходов и правка 2 → правка после 2-го и 4-го прохода

      Правка во время шлифования использует чистовые параметры экрана правки

      '
- h3: Пример процесса
  body:
  - table:
    - - Пункт
      - Черновая
      - Получистовая
      - Чистовая
      - Финишная
    - - Направление
      - Однонаправленное
      - Однонаправленное
      - Однонаправленное
      - Однонаправленное
    - - Проходы
      - по припуску
      - '3'
      - '2'
      - '2'
    - - Подача (мм)
      - '0,04'
      - '0,02'
      - '0,01'
      - '0,005'
    - - Правка через n проходов
      - '5'
      - '3'
      - '0'
      - '0'
    - - Частота бабки (об/мин)
      - '50'
      - '40'
      - '30'
      - '30'
  - note: '?ifIsExternal: Ориентировочная линейная скорость круга для наружной резьбы: 35 м/с

      ?ifIsInternal: Ориентировочная линейная скорость круга для внутренней резьбы: 20 м/с

      Это только примеры; подбирайте по кругу, материалу и требованиям к точности

      '
- h3: Коррекция после шлифования
  body:
  - table:
    - - Результат измерения
      - Коррекция
    - - Средний диаметр больше или меньше
      - Введите разность по диаметру в [Компенс. диаметра](section_1.html#S1D2) на экране шлифования (однократно)
    - - Стороны прошлифованы неравномерно (смещение)
      - Введите смещение по Z в [Компенс. длины](section_1.html#S1D3) (однократно)
    - - Накопленная ошибка шага по всей длине
      - Введите ошибку по всей длине в [Компенс. шага](section_1.html#S1D15)
    - - Средний диаметр на концах различается
      - Введите радиальную коррекцию в [Компенс. конуса](section_1.html#S1D17)
    - - Ошибки различаются по длине длинной резьбы
      - Используйте функцию [сегментной коррекции](section_13.html)
    - - Размер в партии постоянно уходит с правками
      - Задайте [Компенсация при шлифовании](section_3.html#S3D21) на экране правки
- h3: Продолжение после прерывания
  body:
  - note: 'В режиме Единичн следующий запуск продолжает шлифование с текущего контакта

      В режиме Массовое при включённом в конфигурации станка «Пакетное шлифование - функция выбора начального процесса обработки» в правом верхнем углу экрана процесса можно выбрать этап и проход для продолжения; подача предыдущих этапов учитывается автоматически

      '
