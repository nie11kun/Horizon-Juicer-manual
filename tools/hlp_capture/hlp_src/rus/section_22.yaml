title: Наладка на наружный цилиндр и торцы
head1: Функции станка
refs: |
  Параметры см. [Параметры наружного цилиндра](section_26.html), [Параметры торцов](section_27.html) и [Экран автоматической наладки](section_5.html)
blocks:
  - h3: Ручная наладка на наружный цилиндр
    body:
      - steps:
          - Зажмите деталь и проверьте, что её биение в допуске
          - Вручную подведите наружный круг к наружному диаметру детали (зазор около 0,05 мм)
          - "?ifIsHasU: Запишите текущую координату U как начальный контакт шлифования на экране наружного цилиндра"
          - "?ifIsNotHasU: Запишите текущую координату X как начальный контакт шлифования на экране наружного цилиндра"
      - note: |
          Оставляйте зазор около 0,05 мм между начальным контактом шлифования и фактической точкой касания
  - h3: Ручная наладка на торцы
    body:
      - steps:
          - Зажмите деталь и проверьте, что её биение в допуске
          - Вручную подведите круг к левому (или правому) торцу детали с зазором около 0,05 мм
          - Запишите текущую координату Z как начальный контакт левого / правого торца на экране торцов
  - h3: Автоматическая наладка (измерение детали)
    marks: [ifIsAuto]
    body:
      - steps:
          - t: Откройте экран автоматической наладки и привяжите **Измерьте горизонтальное расстояние.Z** и **Центральное положение зонда.X**
            img: {src: auto_center.png, h: 300}
          - Задайте положение детали и радиус щупа по детали
          - Выдвиньте щуп, вручную коснитесь правого торца детали и введите координату касания и подходящий угол
          - "Задайте порог измерения: при отклонении измеренного правого торца от настройки больше порога выдаётся сообщение"
          - Для измерения биения или левого торца подсветите справа на экране автоматической наладки **Биение внешнего круга** / **Левое конечное измерение** (одновременно подсветится **Измерение правого конца**) и задайте порог биения, левый угол измерения, высоту левого фланца и настройку левого края
          - "Подсветите клавишу автоматической наладки и запустите — выбранные пункты измеряются: при внутренней дорожке сначала канавка, затем правый торец, биение, левый торец; со щупом — правый торец, биение, обратное отверстие, левый торец (биение и левый торец только в режиме «обратное отверстие»). Затем обработка начинается автоматически с операциями, выбранными на экране выбора обработки"
      - note: |
          После автоматического измерения цилиндра и торцов фактические позиции шлифования цилиндра и торцов по-прежнему берутся из начальных контактов на их экранах
