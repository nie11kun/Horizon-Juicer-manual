title: Шлифование наружного цилиндра и торцов
head1: Функции станка
refs: |
  Параметры см. [Параметры наружного цилиндра](section_26.html), [Параметры торцов](section_27.html) и [Выбор обработки](section_28.html)
blocks:
  - h3: Выбор обработки
    body:
      - img: {src: center_select.png, h: 300}
      - p: |
          Справа на экране **обработка выбирать** подсветите операции этого цикла (внешний круг, левый торец, Правый торец, шаги внешнего круга, Внутренняя резьба); после CYCLE START они выполняются по очереди
  - h3: Шлифование наружного цилиндра
    body:
      - steps:
          - Подсветите **внешний круг** на экране выбора обработки
          - На экране наружного цилиндра задайте начальный контакт шлифования ручной наладкой
          - На экране торцов задайте контакты левого и правого торца ручной наладкой (по ним рассчитывается диапазон шлифования цилиндра)
          - t: Задайте процесс на экране наружного процесса
            img: {src: center_od_process.png, h: 300}
          - "Способ шлифования: **взад и вперед** — после каждой подачи качание влево-вправо; **Держать** — без качания после подачи (врезное шлифование)"
          - В режиме «Держать» цилиндр длиннее круга можно шлифовать врезанием по участкам
      - note: |
          Перед шлифованием задайте безопасные позиции: отвод наружного круга и начальную позицию стола
          Частота бабки обычно около 120 об/мин, корректируйте по качеству поверхности
          Черновую обработку можно выполнять врезанием по участкам для быстрого снятия припуска
          Начальная точка шлифования цилиндра = начальный контакт левого торца + 0,1 мм + длина подреза (здесь круг врезается, участок подреза не шлифуется); конечная точка = начальный контакт правого торца + 0,1 мм - Компенсация конечной точки страницы наружного цилиндра
  - h3: Шлифование торцов
    body:
      - steps:
          - Подсветите **левый торец / Правый торец** на экране выбора обработки
          - Задайте позиции шлифования на экранах торцов и наружного цилиндра ручной наладкой
          - t: Задайте процесс на экране процесса торцов; способ шлифования такой же, как для цилиндра
            img: {src: center_face_process.png, h: 300}
      - note: |
          ?ifIsHasU: Левый торец: начало = текущий контакт цилиндра + 0,1 мм, конец = текущий контакт цилиндра + высота фланца + 1 мм; правый торец: начало = текущий контакт цилиндра - толщина стенки, конец = текущий контакт цилиндра + 1 мм
          ?ifIsNotHasUBack: Левый торец: начало = текущий контакт цилиндра - 0,1 мм, конец = текущий контакт цилиндра - высота фланца - 1 мм; правый торец: начало = текущий контакт цилиндра + толщина стенки, конец = текущий контакт цилиндра - 1 мм
          ?ifIsNotHasUFront: Левый торец: начало = текущий контакт цилиндра + 0,1 мм, конец = текущий контакт цилиндра + высота фланца + 1 мм; правый торец: начало = текущий контакт цилиндра - толщина стенки, конец = текущий контакт цилиндра + 1 мм
          Конечная точка хода по торцу дополнительно сокращается на компенсацию конечной точки в столбце левого/правого торца; шлифование торцов отсчитывается от текущего контакта цилиндра, поэтому сначала шлифуйте цилиндр
  - h3: Шлифование ступеней
    body:
      - steps:
          - Подсветите **шаги внешнего круга** на экране выбора обработки
          - t: Откройте справа на экране наружного цилиндра **Первый шаг / Шаг второй**, включите ступень и задайте расстояние от левого торца, длину ступени и процесс
            img: {src: center_step.png, h: 300}
          - Начальная позиция шлифования ступени берётся из текущего (или начального) контакта цилиндра, поэтому сначала обработайте цилиндр
