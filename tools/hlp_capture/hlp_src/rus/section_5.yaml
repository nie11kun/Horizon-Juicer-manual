title: Экран автоматической наладки
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Наладка инструмента](section_11.html)

  Если на станке есть устройство автоматической наладки, внизу экрана появляется клавиша **Замер Настройка ножа**; нажмите её, чтобы открыть эту страницу

  Автоматическая наладка: подсветите клавишу автоматической наладки на панели и нажмите CYCLE START. Измерительное устройство (индуктивный датчик или щуп) выдвигается, находит базовый элемент детали и вычисляет **Угол начала обработки**; после измерения устройство убирается. Ручная наладка не нужна

  Автоматическая наладка вычисляет только угол начала обработки и не меняет первый контакт X; после успешного измерения текущий контакт X сбрасывается на первый контакт X, накопленная подача обнуляется — деталь шлифуется заново с начала

  При каждом поиске кромки щуп/датчик сначала касается быстро, затем отходит и измеряет повторно медленно; используется медленный результат. В конфигурации станка можно задать однократное измерение

  В левом верхнем углу в реальном времени показано состояние сигналов измерительных устройств (подсвечено — деталь обнаружена); внизу координаты X, Z, C для ручной привязки позиций

  '
blocks:
- h3: Общие параметры
  body:
  - params:
    - id: S5D1
      name: Корректировка результатов настройки инструмента
      rec: по найденному смещению
      range: нет
      unit: мм или ° (см. текст)
      var: TOOL_SET[42]
      ac: 7
      text: 'Если после автоматической наладки и шлифования стороны резьбы прошлифованы неравномерно (смещение), исправьте результат этим значением

        Значение прибавляется к каждому следующему результату автоматической наладки; повторная привязка измерительного устройства не нужна

        ?ifIsExternal: Наружная резьба: единица мм, равносильно сдвигу измеренной позиции по Z

        ?ifIsInternal: Внутренняя дорожка качения, обратное отверстие (Обычный) и Измерение реверса правого торца внешней поверхности: единица мм, равносильно сдвигу измеренной позиции по Z; обратное отверстие (Только измерение C), правый шаг и правое торцевое отверстие: единица °, прибавляется прямо к рассчитанному начальному углу

        '
- h3: Автоматическая наладка наружной резьбы
  marks:
  - ifIsExternal
  body:
  - img:
      src: auto_ext.png
      h: 300
  - note: 'Станки для наружной резьбы обнаруживают стороны витков индуктивным датчиком и/или щупом. Последовательность:

      **Индуктивный датчик**: ось C поворачивается на 0°, датчик выдвигается; если он стоит точно на вершине витка, ось C поворачивается вперёд на 5° за раз, чтобы сойти с вершины (не более 3 раз; если не удаётся — останов с сообщением «ошибка при возврате измерительного щупа, пожалуйста, проверьте»), затем ищет одну сторону вращением вперёд и другую назад (до 300° каждая); середина двух углов — центр впадины

      **Щуп**: при наличии датчика и щупа датчик измеряет грубо, затем ось C поворачивается от результата датчика на угол, пересчитанный из «расстояние зонда», и щуп измеряет точно; используется результат щупа. При одном щупе измерение начинается с угла последней наладки. Выдвинувшись, щуп также ищет обе стороны вперёд и назад и берёт середину

      После измерения устройство убирается, программа пересчитывает результат в начальный угол по позиции совмещения, корректировке и ходу. Если в диапазоне вращения C сторона не найдена — сообщение «Расстояние до заготовки слишком велико, или измерительное положение слишком далеко!»

      '
  - params:
    - id: S5D2
      name: выключатель-Положение перекрытия шлифовального круга
      rec: привязать вручную
      range: нет
      unit: мм
      var: INI[43]
      ac: 4
      text: 'Координата Z, при которой центр индуктивного датчика совмещён по Z с вершиной профиля круга; показывается только если на станке есть только датчик

        Привязка: вручную переместите стол до совмещения центра датчика с вершиной круга и запишите Z

        '
    - id: S5D3
      name: Зонд-Положение перекрытия шлифовального круга
      rec: привязать вручную
      range: нет
      unit: мм
      var: INI[43]
      ac: 4
      text: 'Координата Z, при которой центр щупа совмещён по Z с вершиной профиля круга; показывается при наличии щупа (при наличии датчика и щупа базой служит щуп, позиция датчика пересчитывается через «расстояние зонда»)

        Привязка: вручную переместите стол до совмещения центра щупа с вершиной круга и запишите Z

        '
    - id: S5D4
      marks:
      - ifIsKaiGuanAndCeTouCeLiang
      name: выключатель-Расстояние зонда
      range: нет
      unit: мм
      var: TOOL_SET[51]
      ac: 4
      text: 'Показывается при наличии датчика и щупа: горизонтальное расстояние от центра датчика до центра щупа

        Если щуп слева от датчика — положительное значение, иначе отрицательное; программа переносит по нему позицию измерения щупа на ту же канавку

        '
- h3: Автоматическая наладка внутренней резьбы
  marks:
  - ifIsInternal
  body:
  - note: 'Станки для внутренней резьбы вводят измерительное устройство в деталь или подводят к ней и измеряют базовый элемент. **структура** в левом верхнем углу определяет способ измерения, страница меняется соответственно:

      **внутренняя дорожка качения**: индуктивный датчик входит в отверстие и находит обе стороны одной канавки резьбы по Z; база — центр канавки

      **обратное отверстие**: щуп измеряет отверстие возвратного канала гайки (или другой базовый элемент); база — центр отверстия

      После включения в конфигурации станка **Дополнительное измерение небольшой ступеньки на правом конце** вверху страницы обратного отверстия появляется **Режим измерения**, где можно выбрать также правый шаг, правое торцевое отверстие и реверс правого торца

      Положение щупа за деталью или перед ней задаётся в конфигурации станка (**Направление измерения**); на экране просто вводите фактические координаты

      После измерения устройство убирается, ось Z возвращается в начальное положение измерения Z, затем в Безоп.коорд.Z экрана шлифования, а ось X — в центр заготовки.X

      '
  - params:
    - id: S5D41
      name: структура
      range: внутренняя дорожка качения / обратное отверстие
      var: TECHNOLOGY[159]
      ac: 4
      text: 'Выбирается по измерительному устройству станка и базовому элементу детали; страница показывает соответствующие параметры

        **внутренняя дорожка качения**: канавка резьбы измеряется индуктивным датчиком

        **обратное отверстие**: щуп измеряет обратное отверстие, правый шаг, правое торцевое отверстие или лыску на наружном диаметре

        '
    - id: S5D6
      name: Измерьте горизонтальное расстояние.Z
      rec: рассчитать по замеру
      range: нет
      unit: мм
      var: TOOL_SET[11]
      ac: 4
      text: 'Расстояние по Z между измерительным устройством (щупом или датчиком) и кругом; прямо влияет на смещение при шлифовании, привязывайте точно:

        1. Коснитесь щупом правого торца детали, запишите Z1

        2. Совместите вершину круга с правым торцом детали, запишите Z2

        3. Горизонтальное расстояние = |Z1 - радиус щупа - Z2|

        Используется для внутренней дорожки качения и обратного отверстия (Обычный); правый шаг, правое торцевое отверстие, Только измерение C и реверс правого торца его не используют

        '
    - id: S5D5
      name: Начальное положение измерения.Z
      rec: щуп примерно в 50 мм вне детали
      range: нет
      unit: мм
      var: INI[49]
      ac: 4
      text: 'В начале каждой автоматической наладки ось Z сначала перемещается сюда, затем выдвигается измерительное устройство; после измерения возвращается сюда

        Оставьте достаточный зазор между выдвинутым устройством, деталью и патроном

        '
    - id: S5D8
      name: Измерить угол.C / Угол измерения обратного отверстия.C
      rec: устройство напротив точки измерения
      range: ≥ 0
      unit: °
      var: INI[50]
      ac: 4
      text: '**Внутренняя дорожка качения** (показывается как Измерить угол.C): угол поворота бабки перед выдвижением датчика, чтобы он вошёл в отверстие без столкновения

        **Обратное отверстие**: при этом угле бабки щуп должен стоять напротив обратного отверстия и входить в его середину

        **Правое торцевое отверстие**: при этом угле бабки щуп должен стоять напротив базового отверстия в правом торце

        '
- h3: 'Структура: внутренняя дорожка качения (индуктивный датчик)'
  marks:
  - ifIsInternal
  body:
  - img:
      src: auto_int_groove.png
      h: 300
  - note: 'Последовательность: Z в начальное положение измерения, C на угол измерения, датчик выдвигается; X в начальное положение измерения X, Z в положение измерения Z; X движется к положению измерения X (датчик должен находиться в канавке без сигнала), затем Z движется сначала влево, потом вправо (до 2 шагов каждый) до касания обеих сторон канавки; середина — центр канавки, по нему вычисляется начальный угол

      Если датчик при движении к положению измерения X касается вершины витка: по умолчанию он сдвигается по Z на 1/4 шага и ищет канавку; после включения в конфигурации станка **Измерение внутренней дорожки: при входе сначала отступить, затем двигаться влево/вправо** датчик возвращается в начальное положение X, сдвигается по Z на 1/8 шага и пробует снова, до 5 раз; если не удаётся — останов с сообщением «测量失败, 请检查测量位置设置是否合适» (измерение не удалось, проверьте настройку положения; сообщение выводится по-китайски)

      Если стороны не найдены — сообщение «ошибка в установке на измерительную позицию!» (проверьте положение измерения X)

      ?ifIsCenter: На шлифовальном центре при внутренней дорожке качения и подсвеченной клавише **Измерение правого конца** после канавки измеряется правый торец; **Биение внешнего круга** и **Левое конечное измерение** можно выбрать только при включённом измерении правого конца, см. ниже «Измерение детали на шлифовальном центре»

      '
  - params:
    - id: S5D25
      name: Начальное положение измерения.X
      range: нет
      unit: мм
      var: TECHNOLOGY[177]
      ac: 4
      text: 'Координата X, при которой датчик безопасно входит в отверстие, не касаясь стенки; после измерения датчик сначала возвращается в эту позицию X, затем выходит из детали

        '
    - id: S5D7
      name: положение измерения.Z
      rec: датчик в первой канавке резьбы
      range: нет
      unit: мм
      var: INI[53]
      ac: 4
      text: 'Вручную введите датчик в деталь примерно на середину первой канавки резьбы и запишите Z. В этом Z датчик перемещается к положению измерения X и затем ищет стороны канавки по Z, поэтому позиция должна быть в канавке

        '
    - id: S5D9
      name: положение измерения.X
      rec: примерно на 0,2 мм дальше точки появления сигнала
      range: нет
      unit: мм
      var: INI[52]
      ac: 4
      text: 'Целевая координата X датчика к поверхности отверстия: вручную перемещайте X, пока датчик не обнаружит стенку, затем ещё примерно на 0,2 мм к стенке и запишите координату

        Внутри канавки в этой позиции сигнала быть не должно, он должен появляться при касании стороны при движении по Z; слишком мелко — стороны не обнаруживаются, слишком глубоко — риск столкновения

        '
- h3: 'Структура: обратное отверстие (щуп)'
  marks:
  - ifIsInternal
  body:
  - img:
      src: auto_int.png
      h: 300
  - note: 'Последовательность (Измерьте обратное отверстие): Z в начальное положение измерения, бабка на угол измерения правого конца/внешнего круга, X на 5 мм вне наружного диаметра, щуп выдвигается; щуп радиально входит примерно на 1,5 диаметра щупа внутрь наружного диаметра и движется по Z (до 100 мм) до касания правого торца (сравнение с настройкой правого конца; сверх порога — сообщение «Ошибка положения справа, проверьте установку заготовки.»); затем возвращается на 5 мм вне наружного диаметра, поворачивается на угол обратного отверстия, сдвигается от измеренного торца внутрь детали на расстояние обратного отверстия от правого конца и входит в отверстие; C вращается вперёд и назад (до 300° каждое) для поиска верхней и нижней стороны отверстия, затем по Z (до 2 шагов) ищутся левая и правая стороны; так находится центр отверстия, по нему вычисляется начальный угол

      Режимы правого шага и правого торцевого отверстия тоже сначала измеряют правый торец; режим реверса правого торца его не измеряет

      Если щуп не входит в отверстие (касается края) — сообщение «измерительная головка не может войти в отверстие, проверьте параметры!»; если не найден правый торец или стенки отверстия по C или Z — «ошибка в установке наружного диаметра!»; проверьте наружный диаметр, центральное положение зонда, расстояние отверстия от правого конца и др.

      '
  - params:
    - id: S5D42
      name: Режим измерения
      range: Измерьте обратное отверстие / Измерьте правый конечный шаг / правый конец отверстия / Измерение реверса правого торца внешней поверхности
      var: TECHNOLOGY[128]
      ac: 4
      text: 'Показывается после включения в конфигурации станка **Дополнительное измерение небольшой ступеньки на правом конце**; иначе всегда «обратное отверстие»

        Способ измерения и параметры каждого режима описаны ниже

        '
    - id: S5D24
      name: Центральное положение зонда.X
      range: нет
      unit: мм
      var: PROCESS[54]
      ac: 4
      text: 'Координата X, при которой щуп находится на оси вращения детали. Можно рассчитать как координату касания щупом наружного диаметра плюс (или минус) радиус детали

        Программа берёт её за базу и по наружному диаметру вычисляет, где щуп подходит к поверхности детали

        '
    - id: S5D11
      name: Радиус щупа
      rec: по чертежу щупа
      range: 0~10
      unit: мм
      var: TOOL_SET[10]
      ac: 4
      text: 'Радиус шарика щупа по спецификации. Используется для расчёта глубины захода щупа и поправки точки касания

        '
    - id: S5D10
      name: Наружный диаметр (детали)
      rec: по замеру
      range: 0~500
      unit: мм
      var: INI[35]
      ac: 4
      text: 'Наружный диаметр детали; определяет, где щуп подходит к поверхности, и используется для пересчёта размеров овального отверстия в углы C; вводите точно

        '
    - id: S5D12
      name: Обратное расстояние между отверстиями, правый конец.Z
      rec: щуп входит в середину отверстия
      range: 0~500
      unit: мм
      var: INI[36]
      ac: 4
      text: '**Обратное отверстие**: расстояние по Z от правого торца до центра обратного отверстия; щуп сдвигается от измеренного торца внутрь детали на это расстояние

        **Правое торцевое отверстие**: глубина, на которую щуп входит по Z в базовое отверстие правого торца

        '
    - id: S5D13
      name: Глубина выреза отверстия
      rec: по детали
      range: -20~100
      unit: мм
      var: PROCESS[55]
      ac: 4
      text: '**Обратное отверстие**: дополнительная глубина захода щупа при наличии выреза (зенковки) снаружи отверстия; без выреза — 0

        **Правое торцевое отверстие**: радиальное расстояние от центра базового отверстия до наружной поверхности детали

        '
    - id: S5D14
      name: Тип обратного отверстия
      range: круглое отверстие / Овальноеотверстие
      var: TOOL_SET[23]
      ac: 4
      text: 'Выбирается по форме обратного отверстия

        **круглое отверстие**: верхняя и нижняя стороны ищутся по C, левая и правая по Z

        **Овальное отверстие**: кромки ищутся наклонно вдоль ширины и длины; задайте также угол, длину и ширину (см. рисунок ниже)

        '
    - id: S5D21
      name: Режим измерения (Обычный / Только измерение C)
      rec: Обычный
      range: Обычный / Только измерение C
      var: INI[163]
      ac: 4
      text: '**Обычный**: измеряются верх/низ (C) и лево/право (Z) отверстия, определяется центр и вычисляется начальный угол

        **Только измерение C**: измеряются только верх и низ — угловое положение отверстия; ошибка правого торца автоматически записывается в **Компенс. длины** (коррекция смещения) экрана шлифования, корректировка результата прибавляется как угол (°)

        '
    - id: S5D18
      name: Обнаружение периметра отверстия / Диапазон обнаружения / Расстояние шага обнаружения
      rec: диапазон 30°, шаг 5°
      range: обнаружение OFF/ON; диапазон и шаг 0~360
      unit: °
      var: TECHNOLOGY[156] / TECHNOLOGY[157] / TECHNOLOGY[158]
      ac: 4
      text: 'Включайте для малых отверстий или неточного угла зажима: если щуп не входит в обратное отверстие под заданным углом, бабка поворачивается шагами сначала в одну, затем в другую сторону (каждый раз до половины диапазона), и после каждого шага щуп пробует войти снова

        '
    - id: S5D23
      name: правый конец/Угол измерения внешнего круга.C (Выравнивание внешнего круга.C)
      rec: без столкновений при измерении
      range: 0~360
      unit: °
      var: INI[132]
      ac: 4
      text: 'Угол поворота бабки в начале автоматической наладки; щуп выдвигается под этим углом и измеряет правый торец или наружный диаметр. Щуп не должен задевать кулачки, вырезы и т. п.

        В режиме реверса правого торца показывается как **Выравнивание внешнего круга.C** — начальный угол для измерения лыски на наружном диаметре

        '
    - id: S5D37
      name: Настройки измерения правого конца.Z / Фактическое измерение на правом конце
      rec: задать после ручного замера
      range: нет
      unit: мм
      var: INI[137]、INI[51]
      ac: 4
      text: 'Вручную коснитесь щупом правого торца детали и введите координату Z в **Настройки измерения правого конца**; справа показывается результат каждого автоматического измерения

        '
    - id: S5D38
      name: Правый крайний порог измерения.Z / Ошибка измерения правого конца
      rec: '0,05'
      range: 0~0,5
      unit: мм
      var: INI[138]、INI[140]
      ac: 4
      text: 'Справа показана разность измеренного правого торца и настройки (измерено - настройка). Если она больше порога — сообщение «Ошибка положения справа, проверьте установку заготовки.» и останов программы; отклонение в другую сторону сообщения не даёт

        Обычно деталь слишком длинная или зажата неправильно; проверьте деталь или измените настройку и продолжите

        '
  - h4: 'Тип обратного отверстия: овальное'
    body:
    - img:
        src: auto_int_slot.png
        h: 300
    - params:
      - id: S5D15
        name: Угол овального отверстия / Длина овального отверстия / Ширина овального отверстия
        rec: по чертежу (развёртка)
        range: угол 0~180, длина и ширина 0~100
        unit: ° / мм
        var: INI[32] / INI[33] / INI[34]
        ac: 4
        text: 'Угол наклона, длина и ширина овального отверстия на развёртке наружной поверхности детали. Задавайте по рисунку на экране; обычно для правой резьбы угол больше 90°, для левой — меньше 90°

          Щуп находит обе кромки по ширине (осевая линия), затем оба конца по длине (центр отверстия)

          '
  - h4: 'Режим измерения: правый шаг'
    body:
    - img:
        src: auto_int_step.png
        h: 300
    - note: 'Угол определяется по маленькой ступеньке на правом торце: щуп измеряет правый торец, отходит по Z на половину радиуса щупа, бабка поворачивается вперёд в пределах одного оборота до касания стороны ступеньки; этот угол плюс корректировка — начальный угол. Ошибка правого торца автоматически записывается в Компенс. длины экрана шлифования

        Если за оборот ступенька не найдена — сообщение «ошибка в установке наружного диаметра!»

        Этому режиму нужны только центральное положение зонда, начальное положение измерения, радиус щупа, наружный диаметр и параметры правого конца

        '
  - h4: 'Режим измерения: правое торцевое отверстие'
    body:
    - img:
        src: auto_int_hole.png
        h: 300
    - note: 'Угол определяется по базовому отверстию в правом торце: щуп измеряет правый торец, переходит на радиус отверстия (наружный радиус минус расстояние от центра отверстия до наружного диаметра, введённое в **Глубина выреза отверстия**), бабка поворачивается на **Угол измерения обратного отверстия.C**, щуп входит в отверстие по Z на **Обратное расстояние между отверстиями, правый конец.Z**, затем C вращается вперёд и назад (до 40° каждое) для поиска сторон отверстия; середина плюс корректировка — начальный угол. Ошибка правого торца записывается в Компенс. длины

        Если щуп не входит — «измерительная головка не может войти в отверстие, проверьте параметры!»; если в пределах ±40° стенки не найдены — «ошибка в установке наружного диаметра!»

        Режим использует три параметра обратного отверстия со значениями, описанными выше

        '
  - h4: 'Режим измерения: реверс правого торца внешней поверхности'
    body:
    - img:
        src: auto_int_flat.png
        h: 300
    - note: 'Угол определяется по лыске на наружном диаметре (фрезерованная лыска, шпоночный паз и т. п.), а положение Z — по торцу правого возвратного элемента:

        1. Бабка на Выравнивание внешнего круга.C, щуп в Выравнивание внешнего круга.Z / .X, C вращается вперёд и назад для поиска сторон лыски; середина — угловая база

        2. Щуп выходит и возвращается к центру детали, бабка дополнительно поворачивается на **Угол поворота торца (реверс).C**, щуп переходит в **Измерение торца (реверс).Z / .X** и касается торца правого возвратного элемента по Z

        3. Измеренная позиция торца (минус корректировка) плюс **Расстояние до обратного торца дорожки качения** пересчитывается в угол от круга до начала дорожки — это начальный угол

        Если лыска или торец не найдены — останов с сообщением «Ошибка измерения, нет сигнала щупа!»

        '
    - params:
      - id: S5D43
        name: Выравнивание внешнего круга.C / .Z / .X
        range: нет
        var: INI[132] / TOOL_SET[72] / TOOL_SET[73]
        ac: 4
        text: 'Позиция измерения щупа на лыске наружного диаметра: бабка сначала на Выравнивание внешнего круга.C, щуп в .Z и .X (у лыски), C вращается вперёд и назад для поиска сторон лыски

          Вручную подведите щуп к середине лыски в позицию, где сигнал только появляется, и запишите Z и X

          '
      - id: S5D44
        name: Расстояние до обратного торца дорожки качения
        range: 0~500
        unit: мм
        var: TOOL_SET[74]
        ac: 4
        text: 'Расстояние по Z от торца правого возвратного элемента до начала дорожки; для пересчёта измеренной позиции торца в начальный угол

          '
      - id: S5D45
        name: Измерение торца (реверс).Z / Измерение торца (реверс).X / Угол поворота торца (реверс).C
        range: нет
        var: TOOL_SET[75] / TOOL_SET[76] / TOOL_SET[77]
        ac: 4
        text: 'Позиции Z и X щупа для измерения торца правого возвратного элемента и угол дополнительного поворота бабки после выравнивания (чтобы щуп достал до торца)

          Щуп сначала переходит наружу от Измерение торца (реверс).Z, затем в Измерение торца (реверс).X и касается торца по Z

          '
- h3: Измерение детали на шлифовальном центре
  marks:
  - ifIsCenter
  body:
  - img:
      src: auto_center.png
      h: 300
  - note: 'На шлифовальном центре автоматическая наладка может также проверить зажим детали: клавиши справа выбирают включаемые измерения (подсвечено — включено; на рисунке включены все)

      **Измерение правого конца**: при внутренней дорожке качения по выбору, со щупом всегда (кроме режима реверса правого торца); измеряет правый торец и сравнивает с настройкой

      **Биение внешнего круга**: на наружном диаметре измеряются 3 точки через 120°; разность максимума и минимума — биение; сверх порога — сообщение «внешний выбег: … mm, круговость заготовки превышает допустимое значение! Порог: … mm»

      **Левое конечное измерение**: щуп переходит наружу от наружного диаметра примерно на 1,5 диаметра щупа ниже высоты левого фланца, бабка поворачивается на левый угол измерения для обхода кулачков, левый торец измеряется по Z (до длины наружного круга + 5 мм); если не найден — «длина заготовки указана неверно!», сверх порога — «Ошибка положения слева, проверьте установку заготовки.»; после успешного измерения длина детали записывается в настройку

      Последовательность: при внутренней дорожке качения сначала канавка, затем правый торец, биение, левый торец; со щупом — правый торец, биение, обратное отверстие и в конце левый торец

      Биение и левое измерение выполняются только при внутренней дорожке качения и в режиме **Измерьте обратное отверстие**, но не в режимах правого шага, правого торцевого отверстия и реверса правого торца

      Биение и левое измерение требуют измерения правого конца: при внутренней дорожке их включение автоматически подсвечивает измерение правого конца, а выключение измерения правого конца выключает и их. После измерения текущий контакт шлифования соответствующих операций сбрасывается на начальный

      '
  - params:
    - id: S5D20
      name: Порог ударов по внешнему кругу / Текущий прыжок внешнего круга (порог биения / текущее биение)
      rec: '0,08'
      range: 0~0,5
      unit: мм
      var: INI[128]、INI[134]
      ac: 4
      text: 'Показывается при включённом измерении биения. Если биение по 3 точкам больше порога — сообщение и останов; справа показано измеренное биение

        '
    - id: S5D22
      name: Левый крайний угол измерения.C
      rec: без столкновений при измерении
      range: 0~360
      unit: °
      var: TOOL_SET[59]
      ac: 4
      text: 'Показывается при включённом левом измерении. Угол бабки для измерения левого торца, чтобы щуп касался торца и обходил кулачки

        '
    - id: S5D27
      name: Высота фланца левого торца
      rec: по чертежу
      range: 0~100
      unit: мм
      var: INI[44]
      ac: 4
      text: 'Радиальная высота фланца на левом торце детали, по чертежу или по замеру. При левом измерении щуп переходит наружу от наружного диаметра примерно на 1,5 диаметра щупа ниже высоты фланца и касается левого торца по Z; при слишком большом значении щуп проходит над фланцем и торец не находит

        Используется также для расчёта конечной точки шлифования левого торца

        '
    - id: S5D39
      name: Настройки измерения левого края.Z / Фактическое измерение на левом конце
      rec: задать после ручного замера
      range: нет
      unit: мм
      var: TOOL_SET[46]、TOOL_SET[47]
      ac: 4
      text: 'Вручную коснитесь щупом левого торца детали и введите Z в настройку левого края; справа показывается автоматически измеренное значение

        '
    - id: S5D40
      name: Левый крайний порог измерения.Z / Ошибка измерения левого конца
      rec: '0,05'
      range: 0~0,5
      unit: мм
      var: TOOL_SET[48]、TOOL_SET[49]
      ac: 4
      text: 'Справа показана разность измеренного левого торца и настройки (измерено - настройка); если она больше порога — сообщение «Ошибка положения слева, проверьте установку заготовки.»; отклонение в другую сторону сообщения не даёт

        '
    - id: S5D28
      name: Длина внешнего круга заготовки
      rec: по чертежу
      range: 0~500
      unit: мм
      var: INI[31]、INI[141]
      ac: 4
      text: 'Слева — настройка, справа — длина, рассчитанная по правому и левому измерению; после левого измерения значение записывается в настройку

        При левом измерении щуп движется по Z от правого торца не более чем на эту длину + 5 мм; если настройка слишком мала — сообщение «длина заготовки указана неверно!»

        '
