title: Экран профиля зуба
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Правка шлифовального круга](section_10.html)

  Для интерполяционной правки нажмите справа на экране правки клавишу **Треугольная / Трапецидальн. / Радиусная / планетарная передача**, чтобы открыть страницу профиля и задать профиль круга; рисунок слева показывает, где расположен каждый размер

  После изменения параметров профиля круг нужно один раз выправить, чтобы новый профиль появился на круге

  '
blocks:
- h3: Треугольный профиль
  marks:
  - ifIsAllShape
  body:
  - img:
      src: shape_tri_int.png
      h: 300
  - note: 'Для обычных треугольных резьб (метрических, дюймовых и т. п.). После включения в конфигурации станка **Треугольный - профиль зуба-Выбор режима правки трапеции** в левом верхнем углу можно выбрать **Обычный** или **Расшир.**:

      **Обычный**: одна сторона — один угол + высота зуба

      **Расшир.**: на каждой стороне два участка с разными углами (Первый / Второй); участок у вершины круга (дна резьбы) — первый, так можно править профиль с канавкой на дне резьбы

      '
  - params:
    - id: S6D1
      name: Радиус основания
      range: 0~20
      unit: мм
      var: SHAPE_MODEL[101]
      ac: 4
      text: 'Радиус на вершине круга (соответствует дну резьбы детали); по радиусу дна на чертеже

        '
    - id: S6D2
      name: Угол слева / Угол справа (Расшир. — ЛевыйПервыйУгол / ПравыйПервыйУгол / ЛевыйВторойУгол / ПравыйВторой_Угол)
      rec: по чертежу, например метрическая 30°/30°
      range: 0~90
      unit: °
      var: SHAPE_MODEL[102]、SHAPE_MODEL[103]、SHAPE_MODEL[106]、SHAPE_MODEL[107]
      ac: 4
      text: 'Угол стороны профиля к вертикали (половина угла профиля); для симметричного профиля одинаков слева и справа

        В режиме Расшир. **Первый** — участок у вершины круга, **Второй** — участок у основания круга

        '
    - id: S6D3
      name: Высота зуба (Расшир. — ВысотаПрямогоУчастка / ОбщаяВысотаЗуба)
      range: 0~50
      unit: мм
      var: SHAPE_MODEL[104]、SHAPE_MODEL[108]
      ac: 4
      text: 'Высота профиля, который правится на круге; немного больше глубины резьбы, чтобы при шлифовании контактировали только стороны

        В режиме Расшир. **ВысотаПрямогоУчастка** — высота первого участка, **ОбщаяВысотаЗуба** — полная высота

        '
    - id: S6D4
      name: Левый радиус основания / Правый радиус основания
      range: 0~20
      unit: мм
      var: SHAPE_MODEL[2] / SHAPE_MODEL[3]
      ac: 4
      text: 'Переходные радиусы с обеих сторон основания круга (соответствуют фаске на вершине резьбы); если не нужны — 0

        '
    - id: S6D5
      name: Конус
      range: -90~90
      var: SHAPE_MODEL[6]
      ac: 4
      text: 'Правит конический круг (линия вершин наклонена), для специальных кругов под коническую резьбу; для обычных резьб — 0

        '
    - id: S6D6
      name: Угол отвода (угол линии продолжения)
      rec: '90'
      range: 0~90
      unit: °
      var: SHAPE_MODEL[105]
      ac: 4
      text: 'Угол продолжения за пределами высоты зуба (наружный контур круга); 90° — прямо наружу

        '
    - id: S6D34
      name: режим треугольного профиля (Обычный / Расшир.)
      range: Обычный / Расшир.
      ac: 4
      var: DRESSER[112]
      text: '**Обычный**: треугольный профиль с одним участком на сторону

        **Расшир.**: треугольный профиль с двумя участками разного угла на сторону

        Показывается после включения в конфигурации станка **Треугольный - профиль зуба-Выбор режима правки трапеции**; иначе треугольный профиль всегда Обычный

        '
- h3: Трапецеидальный профиль
  marks:
  - ifIsAllShape
  body:
  - img:
      src: shape_trap_int.png
      h: 300
  - note: 'Для трапецеидальных резьб, червяков и других профилей с плоским дном. После включения в конфигурации станка **Трапециевидный - профиль зуба-Выбор режима правки трапеции** в левом верхнем углу можно выбрать:

      **Обычный**: трапеция с одним участком на сторону

      **Расшир.**: трапеция с двумя участками разного угла на сторону, с плоской или конической вершиной

      **Прямой** (с «шапкой»): трапеция, заданная шириной и высотой на среднем диаметре

      '
  - params:
    - id: S6D7
      name: Длина основания
      range: 0~20
      unit: мм
      var: SHAPE_MODEL[91]
      ac: 4
      text: 'Ширина площадки на вершине круга (соответствует дну резьбы); по ширине дна резьбы

        '
    - id: S6D8
      name: Левый радиус основания / Правый радиус основания (у площадки)
      range: 0~20
      unit: мм
      var: SHAPE_MODEL[92] / SHAPE_MODEL[93]
      ac: 4
      text: 'Переходные радиусы на концах площадки

        '
    - id: S6D9
      name: Угол слева / Угол справа (Расшир. — ЛевыйПервыйУгол / ПравыйПервыйУгол / ЛевыйВторойУгол / ПравыйВторой_Угол)
      range: 0~90
      unit: °
      var: SHAPE_MODEL[94]、SHAPE_MODEL[95]、SHAPE_MODEL[98]、SHAPE_MODEL[99]
      ac: 4
      text: 'Угол сторон трапеции к вертикали (половина угла); для трапецеидальной резьбы 30° — по 15° с каждой стороны

        '
    - id: S6D10
      name: Высота зуба (Расшир. — ВысотаПрямогоУчастка / ОбщаяВысотаЗуба)
      range: 0~50
      unit: мм
      var: SHAPE_MODEL[96]、SHAPE_MODEL[100]
      ac: 4
      text: 'Высота профиля на круге; немного больше глубины резьбы

        '
    - id: S6D11
      name: Левый радиус основания / Правый радиус основания (у основания круга)
      range: 0~20
      unit: мм
      var: SHAPE_MODEL[4] / SHAPE_MODEL[5]
      ac: 4
      text: 'Переходные радиусы с обеих сторон основания круга; если не нужны — 0

        '
    - id: S6D12
      name: Конус / Угол отвода
      range: конус -90~90, угол 0~90
      var: SHAPE_MODEL[12] / SHAPE_MODEL[97]
      ac: 4
      text: 'Как у треугольного профиля: конус — для специальных конических кругов (для обычных резьб 0); угол отвода — угол контура за пределами высоты зуба

        '
    - id: S6D13
      name: Тип основания (вершина)
      range: Плоское / Скошенное
      var: SHAPE_MODEL[25]
      ac: 4
      text: 'Основание круга (соответствует вершине резьбы) плоское или скошенное

        '
    - id: S6D14
      name: параметры трапеции «Прямой»
      range: по чертежу
      unit: мм / °
      var: SHAPE_MODEL[11]~SHAPE_MODEL[22]
      ac: 4
      text: 'Показываются в режиме трапеции **Прямой**; вводятся по чертежу:

        **подача** (шаг), **Конус**: шаг и конус профиля

        **Ширина шага / Высота шага**: ширина зуба на среднем диаметре и её высота от дна

        **Высота нижней части зуба**: высота площадки дна

        **левая половина угла / правая половина угла**: половины углов сторон

        **ЛевыйРадиусОсн. / ПравыйРадиусОсн., ЛевыйНижн.Радиус / ПравыйНижн.Радиус**: переходные радиусы на вершине и дне

        **Доп. Угол**: угол контура вне профиля

        '
    - id: S6D35
      name: Тип зуба (режим трапеции)
      range: Обычный / Расшир. / Прямой
      ac: 4
      var: SHAPE_MODEL[26]
      text: '**Обычный**: трапеция с одним участком на сторону

        **Расшир.**: трапеция с двумя участками на сторону

        **Прямой**: трапеция, заданная шириной и высотой на среднем диаметре

        Показывается после включения в конфигурации станка **Трапециевидный - профиль зуба-Выбор режима правки трапеции**; иначе трапеция всегда Обычный

        '
- h3: Радиусный профиль (шарико-винтовая пара)
  body:
  - img:
      src: shape_arc_int.png
      h: 300
  - note: 'Для готических (двухрадиусных) дорожек шариковых винтов и гаек. Каждый пункт таблицы имеет три столбца **начальный / регулировка / текущий**:

      **Начальный**: стандартное значение (по чертежу или рассчитанное по диаметру шарика)

      **Регулировка**: поправка по протоколу измерений после обработки

      **Текущий**: начальный + регулировка, значение, фактически используемое при правке (только чтение)

      '
  - params:
    - id: S6D52
      name: угол дуги
      rec: по требуемому диапазону дуги
      range: 20~90
      unit: °
      var: SHAPE_MODEL[89]
      ac: 4
      text: 'Угол, охватываемый дугой дорожки (от вертикали); 90° — полная полуокружность

        '
    - id: S6D55
      name: Автоматический расчет
      range: OFF / ON
      var: DRESSER[40]
      ac: 4
      text: 'При включении начальный радиус дуги и горизонтальный эксцентриситет рассчитываются по диаметру шарика и углу контакта:

        радиус дуги = коэффициент × диаметр шарика / 2

        горизонтальный эксцентриситет = (радиус дуги - диаметр шарика / 2) × sin(угол контакта)

        '
    - id: S6D62
      name: Стандартное переключение (коэффициент)
      rec: '1,11'
      range: 0,9~1,2
      var: DRESSER[113]
      ac: 4
      text: 'Отношение радиуса дуги к радиусу шарика (коэффициент соответствия) для автоматического расчёта; по стандарту дорожки, обычно 1,11

        '
    - id: S6D56
      name: Диаметр стального шара
      range: 0~50
      unit: мм
      var: SHAPE_MODEL[23]
      ac: 4
      text: 'Диаметр шарика, нужен при включённом автоматическом расчёте

        '
    - id: S6D57
      name: Угол контакта стального шарика
      rec: 45°
      range: 0~90
      unit: °
      var: SHAPE_MODEL[24]
      ac: 4
      text: 'Угол контакта шарика с дорожкой, нужен при включённом автоматическом расчёте

        '
    - id: S6D40
      name: Начальный радиус левой дуги / Начальный радиус правой дуги
      rec: по чертежу или автоматически
      range: 0~50
      unit: мм
      var: SHAPE_MODEL[113] / SHAPE_MODEL[114]
      ac: 4
      text: 'Стандартные радиусы левой и правой дуги дорожки

        '
    - id: S6D42
      name: Отрегулируйте радиус левой дуги / Отрегулируйте правильный радиус дуги (поправка правой)
      rec: по протоколу измерений
      range: -10~10
      unit: мм
      var: SHAPE_MODEL[117] / SHAPE_MODEL[118]
      ac: 4
      text: 'Поправка левого и правого радиуса по протоколу измерений, прибавляется к начальному значению

        '
    - id: S6D44
      name: Текущий радиус левой дуги / Текущий радиус правой дуги
      range: только чтение
      unit: мм
      readonly: true
      text: 'Начальное значение + поправка; радиус, фактически используемый при правке

        '
      var: SHAPE_MODEL[81]、SHAPE_MODEL[82]
    - id: S6D46
      name: Теоретический горизонтальный эксцентриситет левой дуги / правой дуги
      rec: по чертежу или автоматически
      range: 0~10
      unit: мм
      var: SHAPE_MODEL[115] / SHAPE_MODEL[116]
      ac: 4
      text: 'Стандартное горизонтальное смещение центров левой и правой дуги от центра профиля

        '
    - id: S6D48
      name: Отрегулируйте горизонтальное эксцентриситет левой дуги. / правой дуги.
      rec: по протоколу измерений
      range: -10~10
      unit: мм
      var: SHAPE_MODEL[119] / SHAPE_MODEL[120]
      ac: 4
      text: 'Поправка горизонтального эксцентриситета по протоколу измерений, прибавляется к теоретическому

        '
    - id: S6D50
      name: Текущее горизонтальное эксцентриситет левой дуги / правой дуги
      range: только чтение
      unit: мм
      readonly: true
      text: 'Теоретическое значение + поправка; эксцентриситет, фактически используемый при правке

        '
      var: SHAPE_MODEL[83]、SHAPE_MODEL[84]
    - id: S6D60
      name: Режим фаски
      range: Скос / Закругление
      var: SHAPE_MODEL[28]
      ac: 4
      text: 'Переход от обеих сторон дорожки к периферии круга; по чертежу

        **Скос**: задаётся углом и длиной переходной линии

        **Закругление**: задаётся радиусом закругления; радиус правящего круга должен быть меньше радиуса закругления

        '
    - id: S6D53
      name: Чрезмерный угол наклона / Чрезмерная длина косой черты (переходная линия)
      range: угол 0~90, длина 0~20
      var: SHAPE_MODEL[85] / SHAPE_MODEL[88]
      ac: 4
      text: 'Угол скоса (к горизонтали, 0° — горизонтально) и длина линии; длина не меньше радиуса правящего круга

        '
    - id: S6D61
      name: Радиус закругления
      range: 0~20
      unit: мм
      var: SHAPE_MODEL[29]
      ac: 4
      text: 'Переходный радиус в режиме фаски «Закругление»

        '
    - id: S6D58
      name: Угол поворота зуба
      rec: точная подстройка по замеру
      range: -5~5
      unit: °
      var: SHAPE_MODEL[8]
      ac: 4
      text: 'Поворачивает весь профиль на малый угол без изменения радиусов, чтобы выровнять левый и правый углы контакта

        Положительное — против часовой стрелки, отрицательное — по часовой; только для малых поправок

        '
    - id: S6D59
      name: Точная регулировка высоты правой стороны
      range: -0,2~0,2
      unit: мм
      var: SHAPE_MODEL[90]
      ac: 4
      text: 'Точная подстройка высоты правой стороны профиля, если угол контакта нужно изменить без изменения дуг: положительное поднимает правую сторону, отрицательное опускает

        '
    - id: S6D63
      name: Доп. Угол (угол продолжения)
      range: 0~90
      unit: °
      var: SHAPE_MODEL[112]
      ac: 4
      text: 'Угол продолжения контура за пределами дорожки

        '
- h3: Планетарный профиль
  marks:
  - ifIsExternal
  body:
  - img:
      src: shape_planet.png
      h: 300
  - note: 'Для планетарных роликовых винтов и подобных профилей; дополнительные профили должны быть включены в конфигурации станка (**Открыть дополнительный профиль зуба**). Нажмите справа на экране правки клавишу «ещё» и выберите **планетарная передача**

      Столбцы начальный / регулировка / текущий — как у радиусного профиля

      '
  - params:
    - id: S6D20
      name: радиусы и горизонтальные эксцентриситеты левой/правой дуги (начальный / регулировка / текущий)
      range: радиус 0~100, регулировка -10~10
      unit: мм
      var: SHAPE_MODEL[31]~SHAPE_MODEL[42]
      ac: 4
      text: 'Радиусы и горизонтальные эксцентриситеты дуг с обеих сторон планетарного профиля; начальные — по чертежу, поправки — по протоколу измерений

        '
    - id: S6D21
      name: угол дуги / Чрезмерный угол наклона / Чрезмерная длина косой черты
      range: угол дуги 45~90
      var: SHAPE_MODEL[43]~SHAPE_MODEL[45]
      ac: 4
      text: 'Угловой диапазон дугового участка и угол и длина переходных линий с обеих сторон

        '
    - id: S6D22
      name: Совет по переходу (переход вершины); радиус дуги, Нар.Диам.резьбы(факт), Диаметр заготовки, угол контакта тангажа
      range: Дуга / Плоская вершина
      var: SHAPE_MODEL[50]、SHAPE_MODEL[46]、SHAPE_MODEL[47]、SHAPE_MODEL[48]、SHAPE_MODEL[49]
      ac: 4
      text: '**Дуга**: вершина — дуга, вводится радиус дуги

        **Плоская вершина**: вершина плоская; вводятся средний диаметр, внутренний диаметр и угол контакта на среднем диаметре детали, программа рассчитывает положение вершины

        '
- h3: Многониточная правка (многониточный круг)
  body:
  - note: 'После включения в конфигурации станка показывается внизу слева на страницах профилей; для правки на круге нескольких ниток (многониточный круг), чтобы шлифовать сразу несколько витков

      '
  - params:
    - id: S6D30
      name: Множественные зубья
      range: нет / да
      ac: 4
      text: 'При «да» по ширине круга подряд правится несколько одинаковых профилей по числу ниже

        Показывается на соответствующей странице профиля после включения в конфигурации станка **Треугольный - профиль зуба-Выбор режима правки трапеции**, **Трапециевидный - профиль зуба-Выбор режима правки трапеции** или **Двойная дуга зуба-Расширенный режим**

        '
    - id: S6D31
      name: Количество зубьев
      range: ≥ 1
      ac: 4
      text: 'Число ниток на круге; ширина круга должна вмещать число × шаг

        Показывается на соответствующей странице профиля после включения в конфигурации станка **Треугольный - профиль зуба-Выбор режима правки трапеции**, **Трапециевидный - профиль зуба-Выбор режима правки трапеции** или **Двойная дуга зуба-Расширенный режим**

        '
    - id: S6D32
      name: Шаг интервала
      range: 0~5
      ac: 4
      text: 'Число шагов между соседними нитками; 0 — нитки идут вплотную

        Показывается на соответствующей странице профиля после включения в конфигурации станка **Треугольный - профиль зуба-Выбор режима правки трапеции**, **Трапециевидный - профиль зуба-Выбор режима правки трапеции** или **Двойная дуга зуба-Расширенный режим**

        '
    - id: S6D33
      name: Компенсация высоты зуба
      range: -1~1
      unit: мм
      ac: 4
      text: 'Уменьшение высоты от нитки к нитке, чтобы первая нитка, входящая в деталь, снимала больше; при положительном значении нитки левее ниже

