title: Экран процесса
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Шлифование](section_12.html)

  На экранах пользователя нажмите внизу клавишу **Обраб. параметр** (процесс), чтобы открыть эту страницу

  '
blocks:
- h3: Таблица процесса
  body:
  - img:
      src: process_batch.png
      h: 300
  - note: 'Столбцы таблицы — четыре этапа **Черновая / Получистовая / Чистовая / Финишная**; программа выполняет их по порядку и повторяет каждый этап заданное число проходов

      Клавиши **Серия** / **Единичное** справа переключают две независимые таблицы процесса для режимов Массовое и Единичн экрана шлифования

      Если в конфигурации станка задан расширенный процесс, в таблице есть параметры правки для каждого этапа (см. ниже «Параметры расширенного процесса»)

      В режиме процесса DIY шлифование выполняется по программе пользователя DIY, вся таблица только для чтения; во время работы программы таблица также только для чтения

      '
  - params:
    - id: S2D3
      name: Однонаправленное / Двунаправленное (направление шлифования)
      rec: нет
      range: Однонаправленное / Двунаправленное
      var: TECHNOLOGY[111]~TECHNOLOGY[114]（批量）/ TECHNOLOGY[171]~TECHNOLOGY[174]（单件）
      ac: 4
      text: '**Однонаправленное**: шлифование только в одном направлении, на обратном ходу без подачи и шлифования

        **Двунаправленное**: шлифование в обоих направлениях с подачей на каждом конце, производительнее

        '
    - id: S2D4
      name: число проходов (циклов)
      range: ≥ 0
      var: TECHNOLOGY[121]~TECHNOLOGY[124]（批量）/ TECHNOLOGY[181]~TECHNOLOGY[184]（单件）
      ac: 4
      text: 'Количество проходов каждого этапа по технологии; для ненужного этапа — 0

        '
    - id: S2D5
      name: глубина подачи
      rec: 0,005~0,05
      range: Черновая без ограничения, остальные этапы по умолчанию ±0,1 (предел можно изменить в конфигурации станка)
      unit: мм
      var: TECHNOLOGY[131]~TECHNOLOGY[134] 或 TECHNOLOGY[371]~TECHNOLOGY[374]（批量）/ TECHNOLOGY[191]~TECHNOLOGY[194] 或 TECHNOLOGY[375]~TECHNOLOGY[378]（单件）
      ac: 4
      text: 'Подача X на проход (радиальная, половина изменения диаметра). Обычно на этапе Черновая подача наибольшая и уменьшается от этапа к этапу; на этапе Финишная можно задать малое значение или 0 для выхаживания

        Для двунаправленного шлифования смысл подачи задаётся в конфигурации станка:

        Режим **суммы за двойной ход**: значение — суммарная подача за ход туда и обратно

        Режим **подачи на каждый ход**: значение — подача в каждом направлении, за двойной ход подаётся удвоенное значение

        Если в конфигурации станка включён автоматический расчёт черновой подачи, подача этапа Черновая только для чтения и вычисляется по общему съёму

        '
    - id: S2D59
      name: скорость шлифования
      range: только чтение
      unit: мм/мин
      var: TECHNOLOGY[141]~TECHNOLOGY[144]（批量）/ TECHNOLOGY[201]~TECHNOLOGY[204]（单件）
      readonly: true
      text: 'Скорость подачи Z при шлифовании, рассчитывается автоматически по частоте вращения бабки: скорость = частота бабки × шаг × заходы

        '
    - id: S2D6
      name: правка через n проходов (Задано)
      range: ≥ 0
      var: TECHNOLOGY[151]~TECHNOLOGY[154]（批量）/ TECHNOLOGY[211]~TECHNOLOGY[214]（单件）
      ac: 4
      text: 'На этом этапе круг правится автоматически после каждых n проходов; 0 — без правки на этапе

        Пример: Черновая 5 проходов, значение 2 → правка после 2-го и 4-го прохода

        Правка во время шлифования использует параметры чистовой правки экрана правки (проходы / подача / скорость)

        '
    - id: S2D7
      name: линейная скорость круга
      rec: 25 м/с
      range: 15~50
      unit: м/с
      var: TECHNOLOGY[161]~TECHNOLOGY[164]（批量）/ TECHNOLOGY[221]~TECHNOLOGY[224]（单件）
      ac: 4
      text: 'Окружная скорость круга при шлифовании. Оптимальное значение сильно зависит от материала круга; кругам CBN обычно нужна более высокая скорость

        В режиме без постоянной частоты вводится линейная скорость, экран пересчитывает её в частоту по текущему диаметру: частота = скорость × 60000 / (π × диаметр круга)

        При включённом в конфигурации станка **режиме постоянной частоты** значение только для чтения и вычисляется по введённой частоте

        '
    - id: S2D8
      name: частота вращения бабки
      range: по умолчанию не более 60 (предел можно изменить в конфигурации станка)
      unit: об/мин
      var: TECHNOLOGY[61]~TECHNOLOGY[64]（批量）/ TECHNOLOGY[268]~TECHNOLOGY[271]（单件）
      ac: 4
      text: 'Частота вращения бабки изделия (ось C) при шлифовании, определяет скорость шлифования. Выше частота — выше производительность, но хуже поверхность

        Обычно на этапе Черновая частота выше, на этапах Чистовая / Финишная ниже

        '
    - id: S2D10
      name: частота вращения шлифовального круга
      range: пересчитывается из линейной скорости
      unit: об/мин
      var: TECHNOLOGY[71]~TECHNOLOGY[74]（批量）/ TECHNOLOGY[17]~TECHNOLOGY[20]（单件）
      ac: 4
      text: 'В режиме без постоянной частоты вычисляется по линейной скорости и текущему диаметру круга, только для чтения

        При постоянной частоте круга (конфигурация станка) частота вводится напрямую, а линейная скорость меняется с диаметром

        '
- h3: Общий съём и счёт правки
  body:
  - params:
    - id: S2D9
      name: Общий съём припуска / Текущий съём припуска
      rec: по припуску
      range: нет
      unit: мм
      var: PROCESS[13]、PROCESS[15]、PROCESS[114]
      ac: 4
      text: '**Общий съём припуска** (заданный): общий съём с одной детали от первого контакта X; по умолчанию суммируется автоматически как проходы × подача всех этапов

        При включённом в конфигурации станка автоматическом расчёте черновой подачи общий съём можно ввести напрямую, черновая подача вычисляется как (общий съём - подача остальных этапов) / проходы этапа Черновая

        **Текущий съём припуска**: фактически поданная величина для текущей детали, только чтение

        В режиме процесса DIY рассчитайте значение сами по программе DIY

        '
    - id: S2D1
      name: Обработано
      rec: '0'
      range: считается автоматически
      unit: шт.
      var: INI[74]
      ac: 4
      text: 'Счётчик деталей; в режиме Массовое увеличивается на 1 после каждой готовой детали и используется для правки по числу деталей

        Можно вручную обнулить для нового счёта

        '
    - id: S2D2
      name: Задано (правка по числу деталей — большой круг)
      rec: по технологии
      range: ≥ 0
      unit: шт.
      var: PROCESS[126]
      ac: 4
      text: 'Если диаметр круга больше критического, круг правится автоматически перед следующей деталью после этого числа деталей; 0 — без правки по числу деталей

        Критический диаметр задаётся в конфигурации станка; правка использует параметры чистовой правки экрана правки

        '
    - id: S2D11
      name: Задано (правка по числу деталей — малый круг)
      rec: по технологии
      range: ≥ 0
      unit: шт.
      var: PROCESS[127]
      ac: 4
      text: 'Интервал правки по числу деталей, если диаметр круга не больше критического. Малый круг изнашивается быстрее, обычно интервал меньше, чем для большого

        '
    - id: S2D12
      name: Режим обрезки (режим счёта правки)
      range: частота / Количество голов
      var: WORK[6]
      ac: 4
      text: 'Как считается правка во время шлифования многозаходных резьб (включается в конфигурации станка)

        **частота** (по проходам): один счёт после шлифования всех заходов

        **Количество голов** (по заходам): один счёт после каждого захода, правка чаще

        '
    - id: S2D13
      name: После обрезки Пустой нож один раз (проход без подачи после правки)
      range: вкл / выкл (программная клавиша подсвечена = вкл)
      var: PROCESS[18]
      ac: 7
      text: 'Если клавиша **После обрезки Пустой нож один раз** справа подсвечена, после каждой правки во время шлифования следующий проход выполняется без подачи, чтобы снять погрешность правки; при счёте правки по заходам не действует

        '
    - id: S2D14
      name: Выберите начальный процесс / Выберите начальный цикл
      range: Черновая / Получистовая / Чистовая / Финишная; номер прохода
      var: SHAPE_MODEL[61]、SHAPE_MODEL[62]、STRING_ADDON[2]
      ac: 7
      text: 'В режиме Массовое обработка начинается с заданного прохода заданного этапа (включается в конфигурации станка); подача предыдущих этапов автоматически учитывается в текущей позиции

        Для продолжения после прерывания; если начальный проход больше числа проходов этапа, обработка переходит к следующему этапу

        Текущий шлифуемый этап показан в правом верхнем углу

        '
    - id: S2D34
      name: Режим процесса
      range: Технология интерфейса / DIY
      ac: 4
      var: PROCESS[1]
      text: '**Технология интерфейса**: шлифование по таблице этой страницы

        **DIY**: шлифование по программе DIY пользователя, таблица только для чтения; в режиме DIY общий съём рассчитайте по программе сами

        '
    - id: S2D35
      name: Тип процесса
      range: Стандартный процесс / Расширенный процесс
      ac: 4
      var: PROCESS[16]
      text: 'Показывает, используется стандартная таблица или расширенная (с параметрами правки для каждого этапа); задаётся конфигурацией станка

        '
- h3: Параметры расширенного процесса
  body:
  - img:
      src: process_ext.png
      h: 300
  - note: 'При расширенном процессе в конфигурации станка каждый этап таблицы имеет собственные параметры правки; правка во время шлифования использует параметры текущего этапа, а не чистовые параметры экрана правки

      '
  - params:
    - id: S2D15
      name: число проходов правки
      range: ≥ 0
      var: TECH_DRESS_TIME[21]~TECH_DRESS_TIME[24]（批量）/ TECH_DRESS_TIME[31]~TECH_DRESS_TIME[34]（单件）
      ac: 4
      text: 'Число ходов правки при каждой правке на этом этапе

        '
    - id: S2D16
      name: подача правки
      range: ≥ 0
      unit: мм
      var: TECH_DRESS_DEEP[22]~TECH_DRESS_DEEP[25]（批量）/ TECH_DRESS_DEEP[32]~TECH_DRESS_DEEP[35]（单件）
      ac: 4
      text: 'Подача на ход правки на этом этапе (радиальная); диаметр круга и позиция шлифования корректируются автоматически

        '
    - id: S2D17
      name: скорость правки
      range: больше 0
      unit: мм/мин
      var: TECH_DRESS_FEED[22]~TECH_DRESS_FEED[25]（批量）/ TECH_DRESS_FEED[32]~TECH_DRESS_FEED[35]（单件）
      ac: 4
      text: 'Скорость осей правки вдоль профиля при правке на этом этапе

        '
    - id: S2D18
      name: линейная скорость / частота круга при правке
      range: линейная скорость ≥ 0
      var: WHEEL_LINESPEED_DRESS[24]~WHEEL_LINESPEED_DRESS[27]（批量）/ WHEEL_LINESPEED_DRESS[34]~WHEEL_LINESPEED_DRESS[37]（单件）；转速 TECHNOLOGY[75]~TECHNOLOGY[78] / TECHNOLOGY[25]~TECHNOLOGY[28]
      ac: 4
      text: 'Линейная скорость шлифовального круга (м/с) при правке на этом этапе; частота пересчитывается по текущему диаметру и показывается только для чтения

        При включённом в конфигурации станка **режиме постоянной частоты** частота при правке вводится напрямую, линейная скорость только для чтения

        '
- h3: Трёхпроволочное измерение и индикация давления
  body:
  - params:
    - id: S2D19
      name: Внешний диаметр заготовки / Трехпроводное измерение / Диаметр стального шара / окончательный размерH
      range: нет
      unit: мм
      var: INI[121] / INI[122] / INI[123] / INI[124]
      ac: 7
      text: 'Показывается после включения индикации трёхпроволочного измерения в конфигурации станка; для пересчёта результатов измерения на станке

        Введите наружный диаметр детали, результат измерения по проволочкам и диаметр шарика; экран вычисляет размер H = (наружный диаметр - трёхпроволочное измерение) / 2 + диаметр шарика

        ?ifIsCenter: На главном экране шлифовального центра для изменения этих значений нужно положение 3 ключа или выше

        '
    - id: S2D20
      name: давление бабки / давление системы (头架压力 / 系统压力)
      range: только чтение
      readonly: true
      text: 'На экране эти две надписи показаны по-китайски: 头架压力 = давление бабки изделия, 系统压力 = давление гидросистемы

        Показываются после включения индикации давления в конфигурации станка; давление бабки и гидросистемы в реальном времени для контроля зажима

        '
- h3: Экран дополнительной конфигурации
  body:
  - img:
      src: process_addon.png
      h: 300
  - note: 'После включения в конфигурации станка справа на экране процесса появляется клавиша **Дополнительная конфигурация**

      '
  - params:
    - id: S2D21
      name: Градиентное изменение подачи грубого шлифования / Градиентное изменение подачи получистового шлифования
      range: OFF / ON
      var: TECHNOLOGY[119] / TECHNOLOGY[125]
      ac: 4
      text: 'При включении подача проходов этапа Черновая (или Получистовая) не постоянна, а линейно уменьшается от большей к меньшей при том же суммарном съёме, что снижает усилие шлифования к концу

        '
    - id: S2D22
      name: грубое измельчение/Общее изменение величины подачи при получистовом шлифовании
      range: -1~1
      unit: мм
      var: TECHNOLOGY[120]
      ac: 4
      text: 'Разность подачи первого и последнего прохода при градиентной подаче; если общее изменение больше удвоенной заданной подачи, градиент не применяется

        '
    - id: S2D23
      name: Компенсация положения одной головы (коррекция по заходам)
      range: OFF / ON
      var: TECHNOLOGY[126]
      ac: 4
      text: 'Включите, если заходы многозаходной резьбы различаются по размеру или положению; заходы 1…6 корректируются по таблице ниже

        '
    - id: S2D24
      name: Нет.1голова ~ Нет.6голова (подача.X / угол.C / конус.X)
      range: -1~1
      var: 进刀 TECHNOLOGY[145]~TECHNOLOGY[150]；角度 TECHNOLOGY[343]~TECHNOLOGY[348]；锥度 TECHNOLOGY[381]~TECHNOLOGY[386]
      ac: 4
      text: '**подача.X**: коррекция начальной позиции X захода (мм) — выравнивание среднего диаметра заходов

        **угол.C**: коррекция угла деления захода (°) — исправление погрешности деления

        **конус.X**: коррекция конуса по всей длине для захода (мм)

        '
- h3: Экран настройки оси Y
  body:
  - img:
      src: process_yaxis.png
      h: 300
  - note: 'Для станков с осью Y (шлифовальная бабка перемещается по Y). После включения в конфигурации станка справа на экране процесса появляется клавиша **Настройка оси Y**

      При повороте оси A на угол подъёма центр круга смещается; программа рассчитывает компенсирующую позицию Y по межцентровым расстояниям, чтобы точки шлифования и правки оставались по центру

      '
  - params:
    - id: S2D25
      name: Есть ось Y
      range: OFF / ON
      var: TECHNOLOGY[353]
      ac: 4
      text: 'При включении ось Y автоматически перемещается в рассчитанную позицию при шлифовании и правке

        '
    - id: S2D26
      name: Автоматический расчет
      range: OFF / ON
      var: TECHNOLOGY[357]
      ac: 4
      text: '**ON**: фактические Y шлифования и правки рассчитываются по межцентровым расстояниям круга/оси A и базовым позициям A0

        **OFF**: фактические Y шлифования и правки вводятся вручную

        '
    - id: S2D27
      name: Центр.расст. круга/A-оси
      range: нет
      unit: мм
      var: TECHNOLOGY[354] / TECHNOLOGY[361] / TECHNOLOGY[366]
      ac: 4
      text: 'По порядку: расстояние от торца электрошпинделя до оси вращения A (положительно, если круг слева от A), длина оправки и расстояние от центра правки круга до торца оправки; для автоматического расчёта

        '
    - id: S2D28
      name: A0 базовая точка шлифования.Y / A0 базовая точка правки.Y
      range: нет
      unit: мм
      var: TECHNOLOGY[355] / TECHNOLOGY[356]
      ac: 4
      text: 'Координаты Y, при которых круг совмещён с центром детали и с центром правящего устройства при оси A = 0°

        '
    - id: S2D29
      name: Фактическое шлифование.Y (Текущий фактический.Y) / Фактическая правка.Y
      range: нет
      unit: мм
      var: TECHNOLOGY[358] / TECHNOLOGY[359]
      ac: 4
      text: 'Позиции, в которые фактически перемещается ось Y при шлифовании и правке; при автоматическом расчёте показывают результат (только чтение)

        '
- h3: Экран настройки упора
  marks:
  - ifIsUW
  body:
  - img:
      src: process_stop.png
      h: 300
  - note: 'Для оси зажима моментом у правящих устройств UW: при правке устройство удерживается моментом двигателя вместо механической фиксации. На станках с правящим устройством UW клавиша **Настройка блока** находится справа на экране процесса

      '
  - params:
    - id: S2D30
      name: Управление зажимной осью с крутящим моментом
