title: Параметры наружного цилиндра
head1: Параметры экранов HMI
blocks:
- h3: Параметры шлифования
  body:
  - img:
      src: center_od_grind.png
      h: 300
  - params:
    - id: S26D1
      name: безопасное место.X (позиция отвода наружного круга)
      rec: задний предел оси наружного круга
      range: нет
      text: 'Безопасная позиция, в которой наружный шлифовальный круг ждёт во время внутреннего шлифования

        Установите в задний предел для безопасной работы

        '
    - id: S26D2
      name: безопасное место.Z (начальная позиция стола)
      rec: координата Z, при которой деталь вне наружного круга
      range: нет
      text: 'Позиция, в которой останавливается стол после обработки

        Установите так, чтобы деталь была вне наружного круга

        '
    - id: S26D3
      name: Режим обработки
      rec: по необходимости
      range: Единичн / Массовое
      text: 'Определяет, с какой позиции начинается шлифование

        **Единичн**: после запуска обработка продолжается с **текущей** позиции шлифования; для наладки или дошлифовки одной детали

        **Массовое**: после запуска обработка начинается с **начальной** позиции шлифования; для непрерывной обработки партии

        '
    - id: S26D4
      name: Нач. точка шлифования.Z
      rec: рассчитывается автоматически
      range: нет
      text: 'Рассчитывается автоматически по начальному контакту левого торца на экране торцов, только чтение

        Начальная точка = начальный контакт левого торца + 0,1 мм + длина подреза

        Врезание по наружному цилиндру всегда в этой позиции, возвратный ход тоже возвращается сюда

        '
    - id: S26D5
      name: Конеч. точка шлифования.Z
      rec: рассчитывается автоматически
      range: нет
      text: 'Рассчитывается автоматически по начальному контакту правого торца на экране торцов, только чтение

        Конечная точка = начальный контакт правого торца + 0,1 мм

        При возвратном ходе конечная точка дополнительно уменьшается на **Компенсация конечной точки** этой страницы

        '
    - id: S26D6
      name: Длина подреза
      rec: по детали
      range: больше нуля
      text: 'Задаётся по длине канавки для выхода круга между левым торцом детали и основанием наружного цилиндра

        Начальная точка шлифования автоматически отступает на длину подреза: круг врезается вне канавки, возвратный ход канавку не включает

        Так угол круга не изнашивается при врезании в канавку и на цилиндре не остаются полосы

        '
    - id: S26D8
      var: PROCESS[47]
      name: первый контакт внешнего круга.X / начальный контакт шлифования.X
      rec: ввести после ручного замера
      range: нет
      ac: 4
      text: 'Позиция, с которой наружный круг начинает шлифовать цилиндр детали. При ручной наладке подведите круг к наружному диаметру с зазором около 0,05 мм и введите координату

        В режиме Массовое каждая деталь начинается с этой позиции; после правки наружного круга значение корректируется на величину правки

        '
    - id: S26D9
      var: PROCESS[21]
      name: Внешний круг в настоящее время находится в контакте.X / Текущий контакт шлифования.X
      rec: накапливается автоматически
      range: нет
      ac: 4
      text: 'Текущая позиция шлифования наружного круга, обновляется после каждой подачи

        В режиме Единичн программа продолжает отсюда; по ней рассчитываются начальные/конечные точки торцов и позиции ступеней

        '
    - id: S26D50
      name: Компенсация размера при шлифовке
      rec: подстройка по замеру
      range: -1,0~1,0
      unit: мм
      ac: 7
      text: 'Если измеренный размер отличается от заданного, введите разность сразу, не меняя подачу процесса

        **Наружный цилиндр**: разность по диаметру; в начале следующего наружного шлифования половина прибавляется к начальному и текущему контакту; положительное — меньше съём, диаметр больше, отрицательное — больше съём

        **Левый / правый торец**: разность по Z; в начале следующего шлифования торца прибавляется к начальному и текущему контакту этого торца

        Однократная коррекция, после применения обнуляется

        '
    - id: S26D51
      name: Онлайн-измерение
      range: OFF / ON
      ac: 4
      text: 'Показывается после включения в конфигурации станка модуля измерения наружного круга в процессе. При включении наружный диаметр измеряется в процессе шлифования, и шлифование автоматически заканчивается по достижении размера

        '
      var: TECHNOLOGY[296]
- h3: Параметры процесса
  body:
  - img:
      src: center_od_process.png
      h: 300
  - params:
    - id: S26D52
      name: Текущий съём припуска / Общий съём припуска
      range: только чтение
      unit: мм
      readonly: true
      text: '**Общий съём**: сумма проходы × подача всех этапов таблицы наружного процесса

        **Текущий съём**: фактически снятая величина с текущей детали

        При включённом в конфигурации станка **Автоматический расчет объема грубого шлифования** вводится общий съём, а черновая подача рассчитывается обратно

        '
      var: PROCESS[59]、PROCESS[115]
    - id: S26D10
      name: Обработано
      rec: '0'
      range: больше нуля
      text: 'Считается автоматически

        Увеличивается на 1 при каждом завершении программы в режиме Массовое

        '
    - id: S26D11
      name: Задано (правка через n деталей)
      rec: '0'
      range: по технологии
      text: 'Круг правится один раз после этого числа деталей

        Позволяет автоматически править круг после нескольких деталей

        Примечание: правка использует чистовые параметры страницы правки (проходы / величина / скорость)

        '
    - id: S26D12
      name: число проходов
      rec: нет
      range: больше нуля
      text: 'По припуску детали

        '
    - id: S26D13
      name: глубина подачи
      rec: 0,005~0,05
      range: больше нуля
      text: 'Распределите подачу по технологии: обычно большая подача на этапе Черновая для снятия припуска и малая на этапе Чистовая для доводки

        '
    - id: S26D14
      name: скорость шлифования
      rec: '100'
      range: больше нуля
      text: 'Скорость перемещения круга от начальной до конечной точки шлифования

        '
    - id: S26D15
      name: правка через n проходов
      rec: нет
      range: больше нуля
      text: 'Круг правится, когда число проходов текущего этапа достигает этого значения

        Примечание: правка использует чистовые параметры страницы правки (проходы / величина / скорость)

        '
    - id: S26D16
      name: линейная скорость круга
      rec: 30 м/с
      range: 15~50
      text: 'Линейная скорость шлифования сильно зависит от материала круга и детали

        Определите значение испытанием

        При включённом **Режим постоянной скорости** в конфигурации станка значение только для чтения, вводится частота круга

        '
    - id: S26D17
      name: частота вращения бабки
      rec: '120'
      range: по технологии
      unit: об/мин
      text: 'Частота бабки при шлифовании наружного цилиндра и ступеней; влияет на шероховатость и производительность. Обычно около 120 об/мин, корректируйте по результату

        '
    - id: S26D39
      var: INI[31]
      name: длина внешнего круга
      rec: по детали
      range: больше нуля
      text: 'Измеренная длина наружного цилиндра детали; при способе «Держать» определяет длину каждого участка врезания

        '
    - id: S26D40
      name: сохранять сегментацию (участки врезания)
      rec: нет
      range: 1~10
      text: 'При врезном шлифовании цилиндра («Держать»): если круг уже длины цилиндра, шлифуйте участками

        Делайте каждый участок уже круга

        Если деление не нужно — 1

        '
- h3: Параметры правки
  body:
  - img:
      src: center_od_dress.png
      h: 300
  - params:
    - id: S26D18
      name: Совокупная сумма обрезки
      rec: нет
      range: нет
      text: 'Величина, снятая правкой с текущего круга, по радиусу

        '
    - id: S26D19
      name: Точная регулировка конуса
      rec: '0'
      range: 0~0,02
      text: 'Если на цилиндре детали небольшой конус, этот параметр правит на круге небольшой наклон для исправления

        Только для тонкой подстройки; большое значение оставит полосы на поверхности

        '
    - id: S26D20
      name: ВидКруга_Правк (состояние круга)
      rec: нет
      range: новый шлифовальный круг / старый шлифовальный круг
      text: 'После установки нового круга переключите на новый; задайте также правильный диаметр нового круга и начальную позицию правки

        '
    - id: S26D21
      name: Кол-во черн.прох.
      rec: нет
      range: больше нуля
      text: 'Число черновых проходов при правке клавишей правки

        '
    - id: S26D22
      name: Глубина черновой правки
      rec: нет
      range: больше нуля
      text: 'Подача на черновой проход правки

        '
    - id: S26D23
      name: Подача_для_черн. (скорость черновой правки)
      rec: нет
      range: больше нуля
      text: 'Скорость черновой правки

        '
    - id: S26D24
      name: Кол-во чист.прох
      rec: нет
      range: больше нуля
      text: 'Число чистовых проходов при правке клавишей правки

        Правка во время шлифования использует это же число

        '
    - id: S26D25
      name: Глубина чистовой правки (на экране показано как $85309)
      rec: нет
      range: больше нуля
      text: 'Подача на чистовой проход правки

        '
    - id: S26D26
      name: Чистовая подача (скорость чистовой правки)
      rec: нет
      range: больше нуля
      text: 'Скорость чистовой правки

        '
    - id: S26D27
      name: Обрезать начальную точку.Z
      rec: координата Z алмаза примерно в 5 мм слева от круга
      range: нет
      text: 'Вручную подведите алмаз к подходящей позиции слева от круга и запишите Z как начальную точку правки

        '
    - id: S26D28
      name: конечная точка обрезки.Z
      rec: координата Z алмаза примерно в 5 мм справа от круга
      range: нет
      text: 'Вручную подведите алмаз к подходящей позиции справа от круга и запишите Z как конечную точку правки

        '
    - id: S26D29
      name: Диам. нового круга
      rec: измерить и задать
      range: больше нуля
      text: 'Диаметр нового круга, используется при правке после замены; измерьте точно

        '
    - id: S26D30
      name: Факт. диам. круга
      rec: накапливается автоматически
      range: больше нуля
      text: 'Обновляется автоматически при каждой правке после правки нового круга

        '
    - id: S26D31
      name: Лин.скор.круга (при правке)
      rec: нет
      range: больше нуля
      text: 'Линейная скорость круга при правке; задайте подходящее значение для качества правки

        При включённом **Режим постоянной скорости** значение только для чтения, вводится частота круга

        '
    - id: S26D32
      name: Контакт подстройки тока (текущий контакт правки)
      rec: накапливается автоматически
      range: нет
      text: '?ifIsHasU: координата оси U алмаза и круга в направлении вперёд/назад

        ?ifIsNotHasU: координата оси X алмаза и круга в направлении вперёд/назад

        Координата касания текущего круга с алмазом; при состоянии «старый круг» правка начинается отсюда. Обновляется после каждой правки

        '
    - id: S26D33
      name: первоначальный триммирующий контакт (начальный контакт правки)
      rec: ввести после ручного замера
      range: нет
      text: '?ifIsHasU: координата оси U алмаза и круга в направлении вперёд/назад

        ?ifIsNotHasU: координата оси X алмаза и круга в направлении вперёд/назад

        Позиция правки для нового круга; при первой правке алмаз не должен касаться круга на ходе от начальной к конечной точке

        '
    - id: S26D34
      name: Мин. диаметр
      rec: рассчитать наименьший используемый диаметр круга
      range: больше нуля
      text: 'Наименьший используемый диаметр по размеру фланца или оправки; если круг меньше — аварийное сообщение

        '
    - id: S26D35
      name: Расстояние от левого торца / В шаге от ступенек (положение ступени)
      rec: по чертежу детали
      range: больше нуля
      text: 'Для шлифования ступеней; задайте по детали

        Примечание:

        Ступени шлифуются после наружного цилиндра; шлифование ступени начинается с текущей позиции наружного цилиндра

        '
    - id: S26D36
      name: способ шлифования
      rec: по длине детали
      range: взад и вперед / Держать
      text: 'Движение при шлифовании

        взад и вперед: после подачи круг проходит горизонтально от начальной до конечной точки и обратно

        Держать: круг подаётся без горизонтального движения (врезное шлифование)

        '
    - id: S26D37
      name: частота вращения круга при шлифовании
      rec: по необходимости
      range: больше нуля
      text: 'Частота круга при шлифовании

        При включённом **Режим постоянной скорости** вводится напрямую, иначе пересчитывается из линейной скорости (только чтение)

        '
    - id: S26D38
      name: Скорость правки колеса (частота круга при правке)
      rec: по необходимости
      range: больше нуля
      text: 'Частота круга при правке

        При включённом **Режим постоянной скорости** вводится напрямую, иначе пересчитывается из линейной скорости (только чтение)

        '
    - id: S26D41
      name: Компенсация обрезки во время обработки
      rec: нет
      range: -0,5~0,5
      text: 'Коррекция позиции шлифования при каждой правке во время шлифования

        Положительное значение — в положительном направлении оси

        Применяется на каждую правку; для случаев, когда размер детали стабильно уходит в одну сторону

        Показывается после включения в конфигурации станка **Отображение параметров компенсации положения шлифования после правки**

        '
    - id: S26D42
      name: режим начального контакта
      rec: нет
      range: 'Первый шаг: ток внешнего круга / начальный внешний круг; Шаг второй: шаги1текущий / шаги1исходный'
      text: 'Откуда берётся начальный контакт поверхности ступени

        Страница первой ступени: **ток внешнего круга** (по умолчанию) — текущий контакт после шлифования цилиндра; если цилиндр не дошлифован до размера, выберите **начальный внешний круг** — начать с начального контакта цилиндра

        Страница второй ступени: по умолчанию текущий контакт после шлифования первой ступени; если первая ступень не дошлифована, выберите начальный контакт первой ступени. Внимание: в русском интерфейсе подписи переставлены — **шаги1исходный** означает текущий контакт ступени 1 (по умолчанию), **шаги1текущий** — начальный

        '
    - id: S26D43
      name: Компенсация конечной точки (ступени)
      rec: нет
      range: больше нуля, меньше длины ступени
      text: 'Коррекция горизонтальной конечной точки возвратного хода при шлифовании ступени

        По умолчанию конечная точка — позиция контакта правого торца; если круг не должен полностью сходить с цилиндра, задайте коррекцию

        Пример: 5 мм — ход заканчивается за 5 мм до правого торца

        Не задавайте слишком большое значение, иначе конечная точка окажется ближе к левому торцу, чем начальная

        '
    - id: S26D44
      name: Заточите левый конец напрямую (сразу шлифовать левый торец)
      rec: нет
      range: нет / да
      text: 'Перемещается ли круг после шлифования цилиндра сразу влево для шлифования левого торца

        Если да, используются подача и скорость процесса левого торца

        Примечание: черновое и чистовое шлифование левого торца выполняется по одному разу

        Даёт чистый угол и повышает производительность

        '
    - id: S26D45
      name: Компенсация конечной точки (наружного цилиндра)
      rec: нет
      range: больше нуля, меньше длины цилиндра
      text: 'Коррекция горизонтальной конечной точки возвратного хода при шлифовании цилиндра

        По умолчанию конечная точка — позиция контакта правого торца; если круг не должен полностью сходить с цилиндра, задайте коррекцию

        Пример: 5 мм — ход заканчивается за 5 мм до правого торца

        Не задавайте слишком большое значение, иначе конечная точка окажется ближе к левому торцу, чем начальная

        '
    - id: S26D46
      var: INI[28]
      name: Нач. угол C (угол зажима детали)
      rec: угол, удобный для загрузки
      range: 0~360
      text: 'В конце программы бабка изделия поворачивается в эту позицию

        '
    - id: S26D47
      name: Угол компенсации отклонения
      rec: 0, если правятся и торец, и периферия круга
      range: 0~90
      text: 'По умолчанию каждая правка боковой стороны круга корректирует контакты левого/правого торца, а правка периферии — контакт цилиндра

        Обычно сторона и периферия наружного круга под 90°, угол = 0

        Если правится только периферия, между периферией и стороной есть угол, равный углу установки круга

        Тогда правка периферии требует коррекции контактов торцов, зависящей от этого угла

        '
    - id: S26D48
      name: Торцевая обработка (править и торец)
      rec: «да», если при правке периферии во время шлифования нужно править и торцевую часть
      range: нет / да
      text: 'По умолчанию «нет»: при правке во время наружного шлифования правится только периферия. «да» — правится и торец, числом чистовых проходов страницы правки торцевого круга

        '
    - id: S26D53
      name: Угол рамы головы (угол бабки)
      range: 0~360
      unit: °
      ac: 4
      text: 'Показывается после включения в конфигурации станка «Рама головки сохраняет фиксированный угол во время наружного шлифования»: при правке наружного круга бабка поворачивается и удерживается на этом угле, чтобы деталь или кулачки не задевали правящее устройство

        '
      var: DRESSER[56]
- h3: Первый шаг / Шаг второй (ступени)
  body:
  - img:
      src: center_step.png
      h: 300
  - note: 'Для деталей с одной или двумя ступенями другого диаметра на наружном цилиндре. Нажмите справа на странице наружных параметров **Первый шаг / Шаг второй**; выполняется, когда на экране выбора обработки выбрана **шаги внешнего круга**

      У каждой ступени свой чистовой и финишный процесс; начальная и конечная точки рассчитываются по расстоянию от левого торца и длине ступени и показываются только для чтения

      '
  - params:
    - id: S26D54
      name: Давать возможность (включение)
      range: OFF / ON
      ac: 4
      text: 'При включении ступень шлифуется при обработке ступеней, при выключении пропускается

        '
      var: PROCESS[25]、PROCESS[26]
    - id: S26D55
      name: длина шага (ступени)
      range: 0~500
      unit: мм
      ac: 4
      text: 'Длина ступени по Z; вместе с расстоянием от левого торца определяет начальную и конечную точки

        '
      var: INI[13]、TECHNOLOGY[186]
    - id: S26D56
      name: сохранять сегментацию (участки врезания)
      range: 1~10
      ac: 4
      text: 'При способе **Держать** (врезное шлифование): если ступень длиннее ширины круга — число участков, шлифуемых врезанием один за другим

        '
      var: INI[14]、TECHNOLOGY[187]
    - id: S26D57
      name: Нач. точка шлифования.Z / Конеч. точка шлифования.Z
      range: только чтение
      unit: мм
      readonly: true
      text: 'Диапазон шлифования ступени, рассчитанный по расстоянию от левого торца, длине ступени и коррекции конечной точки

        '
    - id: S26D58
      name: Текущий контакт шлифования.X / начальный контакт шлифования.X
      range: только чтение
      unit: мм
      readonly: true
      text: 'Текущая позиция шлифования и начальный контакт ступени; начальный контакт берётся из текущего или начального контакта цилиндра (по режиму начального контакта)

        '
      var: PROCESS[109]、TECHNOLOGY[178]、PROCESS[21]、PROCESS[47]
    - id: S26D59
      name: Текущий съём припуска / Общий съём припуска
      range: только чтение
      unit: мм
      readonly: true
      text: 'Заданный общий съём процесса ступени и уже снятая величина

        '
      var: PROCESS[108]、PROCESS[116]
refs: 'Порядок работы см. [Шлифование наружного цилиндра и торцов](section_24.html)

  На шлифовальном центре нажмите внизу экранов пользователя **внешний круг параметр**; клавиши справа переключают параметры шлифования / процесса / правки и страницы ступеней

  '
