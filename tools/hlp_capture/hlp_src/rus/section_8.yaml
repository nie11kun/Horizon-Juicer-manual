title: Экраны статистики и ресурса комплектующих
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Статистика и ресурс комплектующих](section_15.html)

  Клавиши **обработка статистика** и **Аксессуары Жизнь** справа на стартовой странице показываются всегда, но экраны открываются только после включения в конфигурации станка; иначе нажатие ничего не делает

  '
blocks:
- h3: Статистика обработки
  body:
  - img:
      src: stats.png
      h: 300
  - note: 'Для каждого шлифовального круга записывается число отшлифованных деталей и дата замены — для оценки стойкости круга. Для входа нужно положение 3 ключа

      '
  - params:
    - id: S8D1
      name: Обработанный шлифовальный круг / Дата замены шлифовального круга
      range: только чтение
      readonly: true
      nofield: true
      text: 'Каждая строка таблицы — один круг: число отшлифованных деталей и дата/время ввода круга в работу (замены)

        Когда состояние круга на экране правки переключено на «новый» и правка запущена, автоматически начинается запись следующего круга; учитываются только детали, законченные в режиме Массовое, режим Единичн не учитывается

        Записывается до 99 кругов, затем таблица перезаписывается с первой строки

        '
      var: WHEEL_GRIND_CUMU、WHEEL_CHANGED_DATA
    - id: S8D2
      name: Текущий серийный номер шлифовального круга
      range: только чтение
      readonly: true
      text: 'Номер строки используемого круга

        '
      var: CUR_WHEEL
    - id: S8D3
      name: Управление жизненным циклом правящего круга (Ограничение времени обрезки / Совокупное время обрезки / Общий объём правки)
      range: предел ≥ 0
      ac: 4
      text: 'Показывается после включения в конфигурации станка статистики жизненного цикла правящего круга:

        **Ограничение времени обрезки**: допустимое число правок правящим кругом; при достижении выдаётся сообщение о замене (сначала разблокируйте значок замка — Переключатель блокировки параметров)

        **Совокупное время обрезки / Общий объём правки**: число правок и суммарная величина правки текущим правящим кругом

        '
      var: TECHNOLOGY[136]、TECHNOLOGY[137]、TECHNOLOGY[138]
    - id: S8D4
      name: сбросить статистику / сброс счетчика
      range: программная клавиша
      ac: 4
      text: '**сбросить статистику** (первая клавиша справа): очищает записи всех кругов, нумерация начинается заново

        **сброс счетчика** (четвёртая клавиша справа): обнуляет число и величину правок после замены правящего круга

        Обе открывают окно подтверждения: подтверждать — выполнить, Отмена — отказаться; нужно положение 3 ключа

        '
- h3: Ресурс комплектующих
  body:
  - img:
      src: parts_life.png
      h: 300
  - note: 'Показывается после включения в конфигурации станка **Интерфейс отображения срока службы запасных частей**

      Учитывает число использований изнашиваемых деталей (правящий ролик, приспособление и т. д.) и напоминает о замене при достижении порога

      '
  - params:
    - id: S8D10
      name: Ресурс (Ресурс рол. / Ресурс присп. / Алмаз 1 (Нар.) / Алмаз 2 (Торец))
      range: 0~1000000
      unit: циклов
      ac: 4
      text: 'Номинальное число использований каждой детали по данным поставщика, ориентир для замены

        '
      var: SERVICE_LIFE[1]~SERVICE_LIFE[4]
    - id: S8D11
      name: Ост. ресурс (текущий ресурс)
      range: только чтение
      unit: циклов
      readonly: true
      text: 'Число использований на данный момент, считается программой автоматически: ресурс ролика — 1 за каждый проход правки, ресурс приспособления — 1 за каждый зажим манипулятором

        '
      var: SERVICE_LIFE[11]~SERVICE_LIFE[14]
    - id: S8D12
      name: Порог трев. (цикл.)
      range: 0~1000000
      unit: циклов
      ac: 4
      text: 'Когда текущий ресурс превышает это значение, станок останавливается при каждом CYCLE START с сообщением об истечении ресурса (должно быть включено Сообщ. трев.); после замены и сброса работа нормальная

        '
      var: SERVICE_LIFE[6]~SERVICE_LIFE[9]
    - id: S8D13
      name: Сброс (время сброса / кнопка)
      range: только чтение / кнопка
      ac: 4
      text: 'После замены детали нажмите значок ↺ справа в её строке; текущий ресурс обнуляется, время сброса обновляется на текущие дату и время

        '
      var: SERVICE_LIFE_TXT[1]~SERVICE_LIFE_TXT[4]
    - id: S8D14
      name: № рол. / № присп.
      range: текст
      ac: 4
      text: 'Номер используемого ролика и приспособления, для прослеживаемости

        '
      var: SERVICE_LIFE_TXT[6]、SERVICE_LIFE_TXT[7]
    - id: S8D15
      name: Сообщ. трев.
      range: ON / OFF
      ac: 4
      text: 'При включении станок останавливается с сообщением, когда деталь превышает порог; при выключении только ведётся учёт

        '
      var: SERVICE_LIFE[20]
- h3: Журнал роликов
  body:
  - img:
      src: roller_record.png
      h: 300
  - params:
    - id: S8D20
      name: № рол. / Дата замены рол. / Тек. № рол.
      range: только чтение
      readonly: true
      text: 'Нажмите **Журнал рол.** справа на экране ресурса: по номерам перечислены номера роликов и даты замены, справа — номер используемого ролика

        '
      var: INI[162]
