title: Резервное копирование и восстановление параметров
head1: Функции станка
refs: |
  Параметры см. [Экран резервного копирования и восстановления](section_31.html)
  Нажмите **Резервное копирование** справа на стартовой странице (нужен пароль пользователя и включение в конфигурации станка)
blocks:
  - h3: Обычная обработка
    body:
      - steps:
          - t: Чтобы станок выполнял обычную программу шлифования, **Выбор режима** на экране копирования должен быть **обработка**
            img: {src: backup_restore.png, h: 300}
  - h3: Резервное копирование параметров
    body:
      - steps:
          - Откройте экран копирования и установите Выбор режима = **резервное копирование**
          - Задайте путь, каталог и имя файла копии
          - Выберите режим копирования (все переменные или пользовательский список)
          - Для пользовательского списка задайте также каталог, имя и число строк списка
          - Нажмите CYCLE START для копирования; после этого верните Выбор режима на **обработка**
  - h3: Восстановление параметров
    body:
      - steps:
          - Откройте экран копирования и установите Выбор режима = **восстанавливаться**
          - Задайте путь, каталог и имя файла восстановления
          - Нажмите CYCLE START для восстановления; после этого верните Выбор режима на **обработка**
      - note: |
          Для восстановления файла с заднего USB логический диск должен быть предварительно настроен в системе с именем //DEV_3
  - h3: Пользовательский список переменных для копирования
    body:
      - note: |
          Файл списка хранится в каталоге подпрограмм системы; правила:
          не более 790 переменных
          на экране вводится общее число строк файла (включая комментарии и пустые строки)
          строки, начинающиеся с точки с запятой ;, — комментарии и не читаются; пустые строки тоже не читаются
          звёздочка * перед именем означает строковую переменную
      - p: "Пример PAR_DEMO.TXT содержит 14 строк (включая комментарии и пустые строки), поэтому Количество строк списка = 14:"
      - table:
          - ["Строка", "Содержимое", "Значение"]
          - ["1", ";PAR_DEMO.TXT", "комментарий, не читается"]
          - ["2", "", "пустая строка, не читается"]
          - ["3", ";пример файла списка параметров", "комментарий, не читается"]
          - ["4", ";укажите общее число строк этого файла", "комментарий, не читается"]
          - ["5", ";строки с точкой с запятой и пустые строки не читаются", "комментарий, не читается"]
          - ["6", ";звёздочка перед именем — строковая переменная", "комментарий, не читается"]
          - ["7", "", "пустая строка, не читается"]
          - ["8", "R0", "копируется R0"]
          - ["9", "R1", "копируется R1"]
          - ["10", "", "пустая строка, не читается"]
          - ["11", "R2", "копируется R2"]
          - ["12", "*STRING", "копируется строковая переменная STRING"]
          - ["13", ";строка комментария", "комментарий, не читается"]
          - ["14", "R3", "копируется R3"]
