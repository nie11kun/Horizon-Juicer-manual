title: Расширенные функции шлифования
head1: Функции станка
refs: |
  Следующие функции нужно включить в конфигурации станка, после чего их клавиши появляются справа на экране шлифования; параметры см. [Экран шлифования](section_1.html)
blocks:
  - h3: Шлифование кольцевых канавок
    body:
      - p: Доступно только после включения в конфигурации станка **Обработка круговых канавок**
      - steps:
          - t: На экране шлифования установите [Тип шлифования](section_1.html#S1D31) = **кольцевая канавка**; экран кольцевых канавок открывается автоматически
            img: {src: grind_ring.png, h: 300}
          - Введите по чертежу число канавок, шаг, подъём и смещения групп (до 4 групп)
          - Совместите круг с первой канавкой и запишите [Начало первого слота.Z / .X](section_1.html#S1D45)
          - Задайте [первую](section_1.html#S1D43) и [последнюю](section_1.html#S1D44) канавку и нажмите CYCLE START — шлифование канавка за канавкой
          - Слева в реальном времени показаны число обработанных канавок и позиция текущей канавки
  - h3: Шлифование метчиков
    marks: [ifIsScrewTap]
    body:
      - steps:
          - t: На экране шлифования установите [Метчик](section_1.html#S1D32) = **да**, чтобы открыть экран параметров метчика
            img: {src: grind_tap.png, h: 300}
          - Задайте по чертежу число, тип, направление и угол канавок
          - Для метчиков через зуб включите [Вырезка](section_1.html#S1D39) и задайте корректировки
          - При наладке подстройте также ось B для правильного затылования; по результату скорректируйте [Нач. угол B](section_1.html#S1D42)
  - h3: Переменный шаг
    body:
      - p: Доступно только после включения в конфигурации станка **Преобразование высоты тона** (один или много)
      - steps:
          - t: Нажмите справа на экране шлифования **Преобразование высоты тона** и включите [переменный шаг](section_1.html#S1D60)
            img: {src: grind_pitch.png, h: 300}
          - Введите шаг преобразования участка и выберите режим (заданный угол / до конечной точки)
          - Совместите круг с местом начала изменения шага и запишите бит преобразования 1; бит 2 рассчитывается автоматически
          - При первой проверке позиции выключите плавную траекторию, после подтверждения включите
      - p: |
          Для деталей с несколькими участками разного шага выберите в конфигурации «много»; откроется экран нескольких шагов, угол и шаг вводятся по участкам
      - img: {src: grind_multipitch.png, h: 300}
  - h3: Фаска обратного отверстия
    body:
      - p: Доступно только после включения в конфигурации станка **Обратная фаска отверстия**
      - steps:
          - t: Нажмите справа на экране шлифования **Обратная фаска отверстия** и включите фаску
            img: {src: grind_chamfer.png, h: 300}
          - Задайте угол перехода, глубину фаски, угол перевода и предварительные фаски на концах
          - "Выберите режим: координаты всех фасок вручную или первая фаска и автоматический расчёт остальных"
          - После шлифования проверьте положение и глубину фасок; при необходимости подстройте коррекцией позиции и коррекцией конечной точки фаски
  - h3: Шлифование переменного диаметра
    body:
      - p: Доступно только после включения в конфигурации станка **Шлифование переменным диаметром**
      - steps:
          - t: Нажмите справа на экране шлифования **Шлифование переменным диаметром** и включите функцию
            img: {src: grind_diachange.png, h: 300}
          - Задайте углы недействительных участков, величины изменения и углы перехода на обоих концах
          - "Выберите режим: резьба + переменный диаметр в каждом проходе или участки переменного диаметра отдельно после резьбы"
  - h3: Сегментная коррекция
    body:
      - p: Доступно только после включения в конфигурации станка **Компенсация промежуточного диаметра / шага**
      - steps:
          - t: Нажмите справа на экране шлифования **Коррекция**, включите коррекцию и задайте число участков
            img: {src: grind_segcomp.png, h: 300}
          - По протоколу измерений введите, начиная с правого конца, координату конца, коррекцию среднего диаметра (по радиусу) и коррекцию хода каждого участка
          - Коррекция действует при автоматическом шлифовании, не при ручной наладке; при одновременно включённых фаске обратного отверстия, переменном диаметре или переменном шаге не выполняется
  - h3: Прогрев пробным прогоном
    body:
      - p: Доступно только после включения в конфигурации станка **Сухой тепловой двигатель** (пробный прогон)
      - steps:
          - t: Нажмите справа на экране шлифования **пробный прогон** и включите **Включение пробного хода**
            img: {src: grind_dryrun.png, h: 300}
          - Задайте диапазоны качания Z и X, частоту круга и скорость осей (деталь и приспособление не должны задеваться)
          - Нажмите CYCLE START — станок качается без нагрузки для прогрева. После прогрева обязательно выключите
  - h3: Самошлифование приспособления
    marks: [ifIsInternal]
    body:
      - p: Доступно только после включения в конфигурации станка **Самошлифовальное приспособление**
      - steps:
          - t: Нажмите справа на экране шлифования **Самошлифовальное приспособление** и включите
            img: {src: grind_fixture.png, h: 300}
          - Задайте левый и правый конец, позицию контакта, проходы, подачу и скорость шлифования приспособления, а также параметры правки
          - Нажмите CYCLE START для шлифования приспособления; после работы обязательно выключите
