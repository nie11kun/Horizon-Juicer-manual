title: Экран правящего круга
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Правка шлифовального круга](section_10.html)

  На экране правки нажмите справа клавишу **Стандартный / Профильный / Двойной ролик / Вращающееся колесо**, чтобы открыть страницу параметров соответствующего правящего круга (показываются только установленные на станке круги)

  '
blocks:
- h3: Привязка правящего круга (общее)
  body:
  - note: 'Перед правкой программа должна знать положение правящего круга относительно шлифовального; используются два параметра:

      **Межцентровое расстояние правки** (вперёд/назад): расстояние между центрами шлифовального и правящего круга, определяет, откуда начинается подача правки

      **Центр правки** (влево/вправо): координата оси правки, при которой правящий круг стоит посередине ширины шлифовального круга; определяет, отцентрирован ли профиль

      Значки замка рядом с обоими параметрами по умолчанию закрыты; для изменения сначала разблокируйте их

      '
  - params:
    - id: S4D12
      marks:
      - ifIsInternal
      name: Расстояние между центрами обрезки
      rec: рассчитать по замеру
      range: -800~800
      unit: мм
      var: DRESSER[3]
      ac: 4
      text: 'Расстояние между центрами шлифовального и правящего круга в направлении подачи; определяет начальную позицию правки вперёд/назад

        Расчёт:

        1. Установите новый круг, измерьте его диаметр D1 и введите в **Диам. нового круга** на экране правки

        2. Введите **Диам.КругаПравки** D2 по чертежу ролика

        3. Переместите станок до касания периферии круга с периферией правящего круга, запишите координату X1 и введите её в **текущий контакт.X**

        ?ifIsFrontDress: 4. Межцентровое расстояние = |X1 + D1/2 + D2/2|

        ?ifIsBackDress: 4. Межцентровое расстояние = |X1 - D1/2 - D2/2|

        После ввода проверьте, что **Точка контакта X,первая** равна только что введённому текущему контакту; если равна — настройка верна

        '
    - id: S4D6
      marks:
      - ifIsDressWare1
      name: Координата осей / перевязочный центр.W (центр правки)
      rec: рассчитать по замеру
      range: -2000~2000
      unit: мм
      var: DRESSER[22]
      ac: 4
      text: 'Координата оси W (горизонтальная ось правки), при которой правящий круг стоит посередине ширины шлифовального круга; определяет положение профиля влево/вправо

        Замер: перемещая W, коснитесь боковыми сторонами правящего круга левого и правого торца шлифовального круга, запишите W1 и W2; центр правки = (W1 + W2) / 2

        Для двойного ролика — координата, при которой середина между роликами совпадает с центром шлифовального круга

        '
    - id: S4D6
      marks:
      - ifIsDressWare2
      name: Координата осей / перевязочный центр.W (центр правки)
      rec: рассчитать по замеру
      range: -2000~2000
      unit: мм
      var: DRESSER[22]
      ac: 4
      text: 'Координата оси W (горизонтальная ось правки), при которой правящий круг стоит посередине ширины шлифовального круга; определяет положение профиля влево/вправо

        Замер: перемещая W, коснитесь боковыми сторонами правящего круга левого и правого торца шлифовального круга, запишите W1 и W2; центр правки = (W1 + W2) / 2

        Для двойного ролика — координата, при которой середина между роликами совпадает с центром шлифовального круга

        '
      dup: true
    - id: S4D13
      marks:
      - ifIsDressWare3
      name: перевязочный центр.W (центр правки)
      rec: рассчитать по замеру
      range: -2000~2000
      unit: мм
      var: DRESSER[22]
      ac: 4
      text: 'Координата горизонтальной оси правки, при которой правящий круг (для одиночного — центр радиуса) стоит посередине ширины шлифовального круга; определяет положение профиля влево/вправо

        Замер: коснитесь боковыми сторонами правящего круга левого и правого торца шлифовального круга, запишите Z1 и Z2; центр правки = (Z1 + Z2) / 2

        Для двойного ролика — координата, при которой середина между роликами совпадает с центром шлифовального круга

        '
    - id: S4D13
      marks:
      - ifIsDressWare4
      name: перевязочный центр.W (центр правки)
      rec: рассчитать по замеру
      range: -2000~2000
      unit: мм
      var: DRESSER[22]
      ac: 4
      text: 'Координата горизонтальной оси правки, при которой правящий круг (для одиночного — центр радиуса) стоит посередине ширины шлифовального круга; определяет положение профиля влево/вправо

        Замер: коснитесь боковыми сторонами правящего круга левого и правого торца шлифовального круга, запишите Z1 и Z2; центр правки = (Z1 + Z2) / 2

        Для двойного ролика — координата, при которой середина между роликами совпадает с центром шлифовального круга

        '
      dup: true
    - id: S4D17
      name: Переключатель блокировки параметров
      range: открыт / закрыт
      ac: 4
      text: 'Значки замка рядом с межцентровым расстоянием и центром правки. По умолчанию закрыт (только чтение), для изменения откройте

        '
    - id: S4D18
      marks:
      - ifIsUW
      name: UW-Позиция правки.X
      range: нет
      unit: мм
      var: DRESSER[141]
      ac: 4
      text: 'Позиция, в которую перемещается ось X при правке устройством UW; здесь правящий круг ведётся осями U и W

        '
- h3: Стандартный / Профильный / Двойной ролик (интерполяционная правка)
  marks:
  - ifIsDressWare1
  body:
  - img:
      src: roller_single_ext.png
      h: 300
    marks:
    - ifIsSingleAndRound
  - img:
      src: roller_double_ext.png
      h: 300
    marks:
    - ifIsSide
- h3: Стандартный / Профильный / Двойной ролик (интерполяционная правка)
  marks:
  - ifIsDressWare3
  body:
  - img:
      src: roller_single_int.png
      h: 300
    marks:
    - ifIsInternal
    - ifIsSingleAndRound
  - img:
      src: roller_square_int.png
      h: 300
    marks:
    - ifIsInternal
    - ifIsSingleAndRound
  - img:
      src: roller_double_ext.png
      h: 300
    marks:
    - ifIsExternal
    - ifIsSide
- h3: Параметры правящего круга для интерполяционной правки
  body:
  - note: 'При интерполяционной правке правящий круг движется по профилю зуба, поэтому его геометрию нужно ввести точно

      '
  - params:
    - id: S4D1
      name: Радиус_Круга_правки / Радиус слева / Радиус справа
      rec: по чертежу ролика
      range: 0~10
      unit: мм
      var: WHEEL[5]~WHEEL[10]
      ac: 4
      text: 'Радиус кромки правящего круга: для одиночного — один радиус, для профильного и двойного — левый и правый радиусы

        Значение прямо влияет на профиль; вводите по чертежу ролика или по замеру

        '
    - id: S4D7
      marks:
      - ifIsSingleAndRound
      name: Ширина круга (толщина профильного ролика)
      rec: по чертежу ролика
      range: 0~100
      unit: мм
      var: WHEEL[4]
      ac: 4
      text: 'Ширина кромки профильного (квадратного) ролика; влияет на ширину профиля

        '
    - id: S4D8
      marks:
      - ifIsSide
      name: Правка расстояния между колесами
      rec: по чертежу ролика
      range: 0~300
      unit: мм
      var: WHEEL[3]
      ac: 4
      text: 'Расстояние между двумя правящими кругами двойного ролика; влияет на ширину профиля

        '
    - id: S4D9
      marks:
      - ifIsSide
      name: Разница в высоте слева и справа
      rec: по замеру
      range: -5~5
      unit: мм
      var: WHEEL[16]
      ac: 4
      text: 'Компенсация разницы высот левого и правого кругов двойного ролика: левый выше правого — положительное значение, ниже — отрицательное

        '
    - id: S4D2
      marks:
      - ifIsDressWare1
      name: безоп. коорд.U / начальный левый конечный контакт.U / начальный правый конечный контакт.U (начальный правый конечный контакт.X)
      rec: замерить вручную
      range: -500~500
      unit: мм
      var: WHEEL[13] / WHEEL[14] / WHEEL[15]
      ac: 4
      text: 'После установки нового круга переместите ось U до лёгкого касания правящим кругом наивысшей точки периферии шлифовального круга и запишите координату U (начальный контакт)

        Правка нового круга начинается с этой позиции; для двойного ролика контакты левого и правого кругов показаны отдельно

        '
    - id: S4D2
      marks:
      - ifIsDressWare2
      name: безоп. коорд.U / начальный левый конечный контакт.U / начальный правый конечный контакт.U (начальный правый конечный контакт.X)
      rec: замерить вручную
      range: -500~500
      unit: мм
      var: WHEEL[13] / WHEEL[14] / WHEEL[15]
      ac: 4
      text: 'После установки нового круга переместите ось U до лёгкого касания правящим кругом наивысшей точки периферии шлифовального круга и запишите координату U (начальный контакт)

        Правка нового круга начинается с этой позиции; для двойного ролика контакты левого и правого кругов показаны отдельно

        '
      dup: true
    - id: S4D14
      marks:
      - ifIsDressWare3
      name: Точка контакта X,первая / начальный левый конечный контакт.X / начальный правый конечный контакт.X
      range: рассчитывается автоматически
      unit: мм
      var: WHEEL[13] / WHEEL[14] / WHEEL[15]
      ac: 4
      text: 'Координата X касания правящим кругом периферии нового шлифовального круга; рассчитывается автоматически после ввода правильного межцентрового расстояния

        Служит для проверки межцентрового расстояния

        '
    - id: S4D14
      marks:
      - ifIsDressWare4
      name: Точка контакта X,первая / начальный левый конечный контакт.X / начальный правый конечный контакт.X
      range: рассчитывается автоматически
      unit: мм
      var: WHEEL[13] / WHEEL[14] / WHEEL[15]
      ac: 4
      text: 'Координата X касания правящим кругом периферии нового шлифовального круга; рассчитывается автоматически после ввода правильного межцентрового расстояния

        Служит для проверки межцентрового расстояния

        '
      dup: true
    - id: S4D3
      marks:
      - ifIsDressWare1
      name: Точка контакта .U / Текущий левый конечный контакт.U / Текущий правый концевой контакт.U (Текущий правый концевой контакт.X)
      range: обновляется автоматически
      unit: мм
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: 'Координата U текущего касания шлифового и правящего кругов, обновляется после каждой правки

        Если на экране правки состояние круга «старый», правка начинается с этой позиции

        '
    - id: S4D3
      marks:
      - ifIsDressWare2
      name: Точка контакта .U / Текущий левый конечный контакт.U / Текущий правый концевой контакт.U (Текущий правый концевой контакт.X)
      range: обновляется автоматически
      unit: мм
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: 'Координата U текущего касания шлифового и правящего кругов, обновляется после каждой правки

        Если на экране правки состояние круга «старый», правка начинается с этой позиции

        '
      dup: true
    - id: S4D15
      marks:
      - ifIsDressWare3
      name: текущий контакт.X / Текущий левый конечный контакт.X / Текущий правый концевой контакт.X
      range: обновляется автоматически
      unit: мм
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: 'Координата X текущего касания шлифового и правящего кругов, обновляется после каждой правки; правка старого круга начинается отсюда

        При определении межцентрового расстояния введите сюда измеренную координату касания

        '
    - id: S4D15
      marks:
      - ifIsDressWare4
      name: текущий контакт.X / Текущий левый конечный контакт.X / Текущий правый концевой контакт.X
      range: обновляется автоматически
      unit: мм
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: 'Координата X текущего касания шлифового и правящего кругов, обновляется после каждой правки; правка старого круга начинается отсюда

        При определении межцентрового расстояния введите сюда измеренную координату касания

        '
      dup: true
- h3: Вращающееся колесо (профильная правка)
  body:
  - img:
      src: roller_form_ext.png
      h: 300
    marks:
    - ifIsExternal
  - img:
      src: roller_form_int.png
      h: 300
    marks:
    - ifIsInternal
  - note: 'При профильной правке накатной ролик подаётся прямо на шлифовальный круг и копирует свой профиль; параметры профиля зуба не нужны

      '
  - params:
    - id: S4D11
      name: Высота зуба (ролика)
      rec: по чертежу ролика
      range: 0~50
      unit: мм
      var: DRESSER[2]
      ac: 4
      text: 'Высота зуба накатного ролика; при правке нового круга программа по ней определяет, полностью ли сформирован контур

        '
    - id: S4D10
      name: Время ожидания чернового ремонта / Уточнение времени пребывания (выдержка черновой / чистовой правки)
      rec: около 1 с
      range: 0~80
      unit: с
      var: DRESSER[48] / WHEEL[19]
      ac: 4
      text: 'Время контакта ролика с кругом после каждой подачи, чтобы профиль сформировался полностью; при чистовой правке можно дольше

        '
    - id: S4D16
      name: Обрезать обратное расстояние (отвод при правке)
      rec: '0'
      range: 0~1
      unit: мм
      var: INI[12]
      ac: 4
      text: 'После каждой подачи и выдержки правящий ролик отходит на это расстояние, отделяясь от круга перед следующей подачей

        При 0 ролик не отходит и подаётся непрерывно

        '
    - id: S4D19
      name: Контакт формирования профиля
      range: только чтение
      unit: мм
      var: WHEEL[13]
      readonly: true
      text: 'Координата контакта ролика, при которой наружный контур нового круга полностью сформирован; записывается программой

        '
    - id: S4D23
      name: 'начальный контакт / текущий контакт (безоп. коорд.U, Точка контакта .U / Точка контакта X,первая, текущий контакт.X)'
      range: нет
      unit: мм
      var: WHEEL[15] / WHEEL[11]
      ac: 4
      text: '**начальный контакт**: координата, при которой ролик начинает касаться нового круга (начало правки нового круга)

        **текущий контакт**: текущая координата касания круга и ролика, обновляется после каждой правки; правка старого круга начинается отсюда

        '
    - id: S4D20
      name: Отступ шлиф. / Боковая подача
      range: 0~1
      unit: мм
      var: TECHNOLOGY[351] / TECHNOLOGY[352]
      ac: 4
      text: 'Показывается после включения в конфигурации станка **Правка круга завершена: лев./прав. шлиф.**: после профильной правки ролик сначала отходит на отступ, затем смещается влево и вправо для доводки обеих сторон

        '
- h3: Частота вращения правящего круга
  body:
  - params:
    - id: S4D4
      name: Диам.КругаПравки
      rec: по чертежу ролика
      range: 0~500
      unit: мм
      var: WHEEL[1]
      ac: 4
      text: 'Наружный диаметр правящего круга. Используется для расчёта частоты и межцентрового расстояния; вводите точно

        '
    - id: S4D5
      name: Лин.скор.Круга_Правки
      rec: около 15 м/с
      range: 0~60, и не выше максимальной допустимой частоты ролика
      unit: м/с
      var: WHEEL[2]
      ac: 4
      text: 'Окружная скорость правящего круга. Соотношение скоростей шлифовального и правящего кругов сильно влияет на качество правки

        '
    - id: S4D21
      name: Част.Вращ.КругаПравки
      range: только чтение
      unit: об/мин
      var: WHEEL[20]
      readonly: true
      text: 'Пересчитывается из линейной скорости и диаметра правящего круга: частота = скорость × 60000 / (π × диаметр)

        '
