title: Экран правки
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Правка шлифовального круга](section_10.html)

  На экранах пользователя нажмите внизу клавишу **Правка параметр**, чтобы открыть эту страницу; клавиши справа открывают страницы профиля зуба и правящего круга

  '
blocks:
- h3: Основной экран правки
  body:
  - img:
      src: dress_main_ext.png
      h: 300
    marks:
    - ifIsExternal
  - img:
      src: dress_main_int.png
      h: 300
    marks:
    - ifIsInternal
  - note: 'Правка запускается двумя способами:

      **Отдельная правка**: подсветите клавишу правки на панели станка и запустите программу; круг правится по параметрам черновой и чистовой правки этой страницы, деталь не шлифуется

      **Правка во время шлифования**: во время шлифования круг правится автоматически по настройке правки экрана процесса; выполняется только чистовая правка (при расширенном процессе — параметры правки каждого этапа таблицы процесса)

      После каждой правки диаметр круга автоматически уменьшается, а позиция шлифования корректируется на величину правки — новая наладка не нужна

      '
  - params:
    - id: S3D1
      marks:
      - ifIsDressWare1
      name: Тип круга для правки (тип правящего устройства)
      range: U-W / формированиеU
      var: DRESSER[1]
      ac: 4
      text: '**U-W** (интерполяционная правка): дисковый правящий круг, оси U и W движутся совместно по профилю зуба и могут править любой заданный профиль

        **формированиеU** (профильная правка): накатной ролик с профилем резьбы, ось U подаётся прямо и копирует профиль ролика на круг

        Выбирайте по фактически установленному правящему кругу, затем задайте параметры на соответствующей странице профиля или ролика справа

        '
    - id: S3D1
      marks:
      - ifIsDressWare2
      name: Тип круга для правки (тип правящего устройства)
      range: формированиеU (фиксировано)
      var: DRESSER[1]
      readonly: true
      text: 'Правящее устройство этого станка имеет только ось U и правит только накатным роликом; тип фиксирован **формированиеU** и не изменяется

        Параметры ролика задаются на странице **Вращающееся колесо** справа

        '
      dup: true
    - id: S3D2
      marks:
      - ifIsDressWare3
      name: Тип круга для правки (тип правящего устройства)
      range: X-W / формированиеX
      var: DRESSER[1]
      ac: 4
      text: '**X-W** (интерполяционная правка): дисковый правящий круг, две оси правки движутся совместно по профилю зуба

        **формированиеX** (профильная правка): накатной ролик, ось X подаётся прямо и копирует профиль ролика на круг

        Выбирайте по фактически установленному правящему кругу, затем задайте параметры на соответствующей странице профиля или ролика справа

        '
    - id: S3D2
      marks:
      - ifIsDressWare4
      name: Тип круга для правки (тип правящего устройства)
      range: формированиеX (фиксировано)
      var: DRESSER[1]
      readonly: true
      text: 'На этом станке заднее правящее устройство для внутренней резьбы, правка только накатным роликом; тип фиксирован **формированиеX** и не изменяется

        Параметры ролика задаются на странице **Вращающееся колесо** справа

        '
      dup: true
    - id: S3D31
      marks:
      - ifIsDressWare5
      name: Тип круга для правки / Тип правящего круга (гидравлическое устройство)
      range: Гидравлический (фиксировано)
      var: DRESSER[1]
      readonly: true
      imgs:
      - src: roller_hyd.png
        h: 300
      text: 'На этом станке гидравлическое правящее устройство с поворотным цилиндром; тип фиксирован **Гидравлический**, тип круга показывается как **Поворотный цилиндр**

        '
    - id: S3D3
      marks:
      - ifIsSingleAndRound
      name: Тип правящего круга
      range: Стандартный / Профильный
      var: DRESSER[4]
      ac: 4
      text: 'Выберите фактически установленный правящий круг:

        **Стандартный** (одиночный ролик): дисковый круг с радиусной кромкой, позволяет править впадину с радиусом

        **Профильный** (квадратный ролик): круг с плоской кромкой; вводятся толщина и левый/правый радиусы

        После переключения нажмите соответствующую клавишу справа и задайте межцентровое расстояние правки и другие параметры ролика

        '
    - id: S3D3
      marks:
      - ifIsSide
      name: Тип правящего круга
      range: Двойной ролик (фиксировано)
      var: DRESSER[4]
      readonly: true
      text: 'Правящее устройство станка несёт левый и правый правящие круги; тип фиксирован **Двойной ролик**, два круга правят левую и правую стороны профиля

        Расстояние между роликами, разница высот слева/справа и др. задаются на странице **Двойной ролик** справа

        '
      dup: true
    - id: S3D32
      name: Тип правящего круга (профильная правка)
      range: Вращающееся колесо (фиксировано)
      readonly: true
      text: 'При профильной правке тип правящего круга фиксирован **Вращающееся колесо** (накатной ролик); профиль ролика совпадает с профилем резьбы и прямо копируется на круг

        Параметры ролика задаются на странице **Вращающееся колесо** справа

        '
    - id: S3D4
      marks:
      - ifIsAllShape
      name: Форма зуба (профиль)
      range: Треугольная / Трапецидальн. / Радиусная (с дополнительными профилями также планетарная и плоская)
      var: DRESSER[5]
      ac: 4
      text: 'Профиль, который правится на круге интерполяционной правкой; после переключения нажмите клавишу профиля справа и задайте его параметры

        При профильной правке профиль задаётся роликом, этот параметр не действует

        '
    - id: S3D24
      name: плоский конус
      range: нет
      unit: мм
      var: DRESSER[142]
      ac: 4
      text: 'Доступен при выборе профиля **плоский**; для правки круга в цилиндр/плоскость (например, круги для шлифования отверстий)

        Значение — разность диаметров двух сторон на ширине круга; положительное — левая сторона больше правой, 0 — цилиндр

        '
    - id: S3D16
      name: ВидКруга_Правк (состояние круга)
      range: новый шлифовальный круг / старый шлифовальный круг
      var: DRESSER[6]
      ac: 7
      text: 'После установки нового круга переключите на **новый шлифовальный круг**, введите правильный диаметр нового круга и параметры правящего круга, затем выполните одну отдельную правку

        Новый круг правится слоями от наружного диаметра до полного профиля; после первого прохода правки состояние автоматически меняется на старый круг, и при остановке и повторном запуске правка продолжается как для старого круга

        ?ifIsInternal: Для нового круга внутренней резьбы программа сама рассчитывает число черновых и чистовых проходов по (диаметр нового круга - максимальный диаметр шлифования) / 2 и подачам черновой/чистовой правки (примерно последние 5 проходов — чистовые) и правит сразу до максимального диаметра шлифования; заданные на экране числа проходов при этом не используются

        '
    - id: S3D17
      name: Является ли новый шлифовальный круг шлифовальным кругом? (профилированный новый круг)
      range: обычный / формирование
      var: DRESSER[114]
      ac: 4
      text: 'Показывается после включения в конфигурации станка

        **обычный**: периферия круга плоская; правка нового круга сначала поднимается на высоту зуба и правит профиль слоями сверху вниз

        **формирование**: круг уже имеет предварительный профиль; правка нового круга без подъёма, сразу по профилю

        '
    - id: S3D20
      name: Угол обрезки (угол правки)
      rec: '0'
      range: -90~90
      unit: °
      var: INI[154]
      ac: 4
      text: 'На станках с осью A — угол поворота шлифовальной бабки при правке; по умолчанию 0°

        Задаётся для обхода столкновений или точной подстройки угла профиля (показывается после включения в конфигурации станка)

        '
- h3: Проходы и величины правки
  body:
  - params:
    - id: S3D7
      name: Кол-во черн.прох.
      range: 0~1000
      var: DRESSER[26]
      ac: 7
      text: 'Число черновых проходов в начале отдельной правки. Черновая правка с большей подачей быстро формирует профиль

        Правка во время шлифования черновую правку не выполняет

        '
    - id: S3D8
      name: Глубина черновой правки
      range: 0~0,5
      unit: мм
      var: DRESSER[28]
      ac: 4
      text: 'Подача на черновой проход правки (радиальная)

        '
    - id: S3D9
      name: Подача_для_черн. (скорость черновой правки)
      range: 0~1000
      unit: мм/мин
      var: DRESSER[30]
      ac: 4
      text: 'Скорость движения правящего круга по профилю при черновой правке

        '
    - id: S3D10
      name: Кол-во чист.прох
      range: 0~1000
      var: DRESSER[27]
      ac: 4
      text: 'Число чистовых проходов после черновых при отдельной правке; правка во время шлифования использует это же число

        '
    - id: S3D11
      name: Глубина чистовой правки (на экране показано как $85309)
      rec: 0,005~0,02
      range: 0~0,1 (предел можно изменить в конфигурации станка)
      unit: мм
      var: DRESSER[29]
      ac: 4
      text: 'Подача на чистовой проход правки (радиальная), определяет итоговое качество профиля круга

        В русском интерфейсе вместо названия этого поля показан код $85309 (нет перевода)

        '
    - id: S3D12
      name: Чистовая подача (скорость чистовой правки)
      range: 0~1000
      unit: мм/мин
      var: DRESSER[31]
      ac: 4
      text: 'Скорость правящего круга при чистовой правке; чем ниже скорость, тем мельче поверхность круга

        '
    - id: S3D22
      name: Количество правки нового круга (подача правки контура)
      range: 0~5
      unit: мм
      var: TECHNOLOGY[304]
      ac: 4
      text: 'Маленькое поле справа от черновой подачи (включается в конфигурации станка). Подача на проход только для наружного контура нового круга

        Если не включено, для контура используется черновая подача (при отсутствии черновых проходов — чистовая)

        '
    - id: S3D23
      name: Скорость правки нового круга (скорость правки контура)
      range: 0~1000
      unit: мм/мин
      var: TECHNOLOGY[305]
      ac: 4
      text: 'Маленькое поле справа от скорости черновой правки. Скорость правки только для наружного контура нового круга

        Показывается после включения в конфигурации станка **Отдельные параметры правки для новых сегментов шлифовального круга**

        '
    - id: S3D18
      name: Совокупная сумма обрезки (накопленная правка)
      range: только чтение
      unit: мм
      var: DRESSER[10]
      readonly: true
      text: 'Величина, снятая правкой с нового круга: (диаметр нового круга - текущий диаметр) / 2

        '
    - id: S3D21
      name: Компенсация при шлифовании (на каждую правку)
      range: -0,5~0,5
      unit: мм
      var: DRESSER[71]
      ac: 4
      text: 'Показывается после включения в конфигурации станка. При правке во время шлифования каждый чистовой проход правки дополнительно смещает позицию шлифования (первый контакт X и текущий контакт X) на это значение; например, при 2 чистовых проходах на правку — на удвоенное значение

        Для серий, где размер детали с правкой стабильно уходит в одну сторону; положительное значение смещает позицию шлифования в X+ (наружная резьба: меньше съём, деталь больше)

        При отдельной правке (подсвечена клавиша правки) не применяется

        '
    - id: S3D26
      name: Накопление компенсаций
      range: только чтение
      unit: мм
      var: DRESSER[72]
      readonly: true
      text: 'Сумма компенсаций при шлифовании, уже внесённых в позицию шлифования

        При правке нового круга программа сначала вычитает эту сумму из позиции шлифования, затем обнуляет её; обнуляется также после ручной наладки первой детали

        Показывается после включения в конфигурации станка **Отображение параметров компенсации положения шлифования после правки**

        '
- h3: Параметры шлифовального круга
  body:
  - params:
    - id: S3D13
      name: Ширина шл. круга
      rec: по замеру
      range: 0~200
      unit: мм
      var: DRESSER[23]
      ac: 7
      text: 'Фактическая ширина круга, используется для расчёта траектории интерполяционной правки; измерьте и введите

        '
    - id: S3D14
      name: Диам. нового круга
      rec: по замеру
      range: 0~1000
      unit: мм
      var: DRESSER[24]
      ac: 7
      text: 'После установки нового круга измерьте наружный диаметр и введите (можно примерно на 0,2 мм больше измеренного, чтобы первая правка полностью сформировала периферию)

        '
    - id: S3D25
      name: Факт. диам. круга (текущий диаметр)
      range: только чтение
      unit: мм
      var: DRESSER[25]
      readonly: true
      text: 'Текущий диаметр круга, рассчитанный программой по каждой правке; используется для пересчёта скорости и контроля диаметра

        '
    - id: S3D15
      name: Лин.скор.круга (при правке)
      rec: около 22 м/с
      range: 0~80
      unit: м/с
      var: WHEEL_LINESPEED_DRESS[2]
      ac: 4
      text: 'Окружная скорость шлифовального круга при правке. В режиме без постоянной частоты вводится скорость, частота пересчитывается по текущему диаметру

        Обычно около 22 м/с; корректируйте по размеру и материалу круга

        При включённом в конфигурации станка **режиме постоянной частоты** вводится частота, а линейная скорость только для чтения

        '
    - id: S3D19
      name: Част. вращ. круга (при правке)
      range: только чтение или ввод в зависимости от конфигурации
      unit: об/мин
      var: DRESSER[37]
      ac: 4
      text: 'Частота круга при правке: частота = скорость × 60000 / (π × текущий диаметр)

        При постоянной частоте круга (конфигурация станка) частота вводится напрямую, скорость только для чтения

        '
    - id: S3D5
      name: Мин. диаметр (минимальный диаметр шлифования)
      rec: по размеру фланца или оправки
      range: 0~1000
      unit: мм
      var: DRESSER[36]
      ac: 4
      text: 'Минимальный допустимый диаметр круга. Если текущий диаметр меньше, станок выдаёт аварийное сообщение и круг нужно заменить

        ?ifIsExternal: Оставьте запас по размеру фланца круга

        ?ifIsInternal: Задайте (внутренний диаметр резьбы детали + 2 × высота профиля) с запасом

        '
    - id: S3D6
      marks:
      - ifIsInternal
      name: Максимальный диаметр шлифования шлифовального круга
      rec: диаметр, при котором круг входит в отверстие детали
      range: 0~1000, и не менее чем на 0,2 меньше диаметра нового круга
      unit: мм
      var: DRESSER[50]
      ac: 4
      text: 'Новый круг автоматически правится до этого диаметра, чтобы входить в отверстие детали

        Если текущий диаметр больше, запуск шлифования даёт аварийное сообщение

        '
- h3: Внешний профиль и профиль червяка
  body:
  - params:
    - id: S3D27
      name: Выбор типа зуба (источник профиля)
      range: Внутренняя интеграция / внешний режим1 / внешний режим2
      var: DRESSER[140]
      ac: 4
      text: 'Показывается после включения внешней программы профиля в конфигурации станка

        **Внутренняя интеграция**: встроенные профили (треугольный, трапецеидальный, радиусный и др.)

        **внешний режим1**: внешняя программа профиля, левая и правая стороны правятся раздельно

        **внешний режим2**: внешняя программа профиля как непрерывная траектория с коррекцией радиуса инструмента

        '
    - id: S3D28
      name: путь к внешней программе / внешний каталог программы / Название программы профиля внешнего зуба
      range: внутреннийSPF / назадUSB / впередUSB / CFКарта
      ac: 4
      text: 'Место хранения, папка и имя внешней программы профиля

        Для заднего порта USB логический диск должен быть предварительно настроен в системе с именем //DEV_3

        '
      var: SHAPE_MODEL[1]、STRING_ADDON[1]、SHAPE_EXTERNAL
    - id: S3D29
      name: Высота зуба / Поднимите нож (подъём)
      range: 0~50
      unit: мм
      ac: 4
      text: 'Высота профиля непрерывной траектории во внешнем режиме2 и высота подъёма перед начальной точкой правки

        '
      var: PROCESS[124]、PROCESS[125]
    - id: S3D30
      marks:
      - ifIsExternal
      - ifIsHasWorm
      name: профиль червяка / Высота зуба червяка
      range: высота 0~200
      unit: мм
      var: INI[19]、WORM_SHAPE
      ac: 4
      text: 'Только для станков с функцией червяка, показывается при Включение червяка = червяк: сверху имя вызываемой программы профиля червяка, снизу высота зуба червяка

        '
