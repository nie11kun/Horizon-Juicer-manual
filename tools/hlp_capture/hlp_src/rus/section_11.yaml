title: Наладка инструмента
head1: Функции станка
refs: |
  Параметры см. [Экран шлифования](section_1.html) и [Экран автоматической наладки](section_5.html)
  Цель наладки: круг должен точно войти в существующую канавку резьбы детали (или нужно определить начальный угол первого шлифования); по ней программа вычисляет **Угол начала обработки** и **первый контакт X**
blocks:
  - h3: Ручная наладка
    body:
      - steps:
          - "?ifIsCenter: Шлифовальный центр: подсветите **Внутренняя резьба** справа на экране выбора обработки"
          - t: "Откройте экран шлифования и задайте основные данные детали: [Шаг резьбы](section_1.html#S1D4), [Направл. резьбы](section_1.html#S1D8), [Количество заходов](section_1.html#S1D9), [Конус](section_1.html#S1D16), [Угол спирали](section_1.html#S1D20)"
            img: {src: grind_main_int.png, h: 300}
            marks: [ifIsInternal]
          - t: "Откройте экран шлифования и задайте основные данные детали: [Шаг резьбы](section_1.html#S1D4), [Направл. резьбы](section_1.html#S1D8), [Количество заходов](section_1.html#S1D9), [Конус](section_1.html#S1D16), [Угол спирали](section_1.html#S1D20)"
            img: {src: grind_main_ext.png, h: 300}
            marks: [ifIsExternal]
          - "?ifIsInternal: Задайте [центр заготовки.X](section_1.html#S1D28): здесь круг входит в отверстие и выходит из него, задайте точно по методике замера"
          - "?ifIsExternal: Вручную переместите X в безопасную позицию вблизи наружного диаметра и запишите X в [Безоп.коорд.X](section_1.html#S1D12) (начальная позиция наладки)"
          - Вручную отведите X в безопасную позицию без столкновений и запишите X в [Безоп. коорд. X](section_1.html#S1D14)
          - Переместите Z к левому и правому концу резьбы и запишите в [левый конец Z](section_1.html#S1D10) и [правый конец Z](section_1.html#S1D11)
          - "?ifIsInternal: Задайте [Безоп.коорд.Z](section_1.html#S1D30) (круг полностью вне детали)"
          - "?ifIsExternal: Выберите [Точка наладки](section_1.html#S1D6) (Начало / Середина / Задано)"
          - Подсветите клавишу **Ручная наладка** на панели и нажмите **CYCLE START**
          - Подсветите клавишу **DRF** (маховичок), выберите шаг маховичка (×1 / ×10 / ×100) и установите коррекцию подачи на минимум
          - "?ifIsExternal: Программа сначала перемещает Z в выбранную точку наладки, X в начальную позицию наладки и поворачивает бабку на начальный угол"
          - "?ifIsInternal: Программа сначала перемещает Z в Безоп.коорд.Z, X в центр заготовки.X, затем Z в начальную точку шлифования внутри детали и поворачивает бабку на начальный угол"
          - Когда круг начинает двигаться по резьбе синхронно с бабкой, маховичком подстройте X (при необходимости Z), чтобы круг точно встал в канавку без нажима на стороны
          - "?ifIsScrewTap: При шлифовании метчика подстройте маховичком и ось B, чтобы X касался детали и затылование было правильным"
          - "Когда круг в канавке, нажмите клавишу **Отвод** на панели: программа сразу записывает текущую позицию, вычисляет начальный угол, выходит из детали и завершается; без клавиши Отвод круг проходит всю резьбу и используется конечная позиция. В конце выключите клавишу ручной наладки"
          - Программа автоматически вычисляет и сохраняет [Угол начала обработки](section_1.html#S1D24) и [первый контакт X](section_1.html#S1D26)
      - note: |
          Советы:
          При работе маховичком держите коррекцию подачи на минимуме; когда круг в канавке, можно отвести X примерно на 0,1 мм, увеличить коррекцию и посмотреть, нет ли нажима дальше по резьбе
          Частота круга при наладке задана программой станка; для изменения обратитесь к изготовителю
          В конфигурации станка выбирается **интерполяционная наладка** (бабка и круг движутся синхронно) или **статическая наладка**; при статической программа после позиционирования останавливается, подстройте маховичком и снова нажмите CYCLE START — позиция записывается и программа завершается
          Для первой детали бабка поворачивается на текущий начальный угол (в конфигурации можно задать начало с 0°); для следующих деталей конфигурация может сразу перемещать X на первый контакт X, чтобы уменьшить подстройку маховичком
          ?ifIsExternal,ifIsHasReOperate: Станок поддерживает вторую наладку: при перезажиме уже шлифованной детали установите [тип наладки](section_1.html#S1D5) «Вторая настройка инструмента»; круг сразу входит в существующую канавку, нужна лишь подстройка
          ?ifIsScrewTap: Если затылование мало и угол B трудно определить при наладке, отшлифуйте одну деталь, измерьте её и затем скорректируйте [Нач. угол B](section_1.html#S1D42)
  - h3: Наладка в серийном производстве
    body:
      - steps:
          - Перед наладкой первой детали установите [первая деталь партии](section_1.html#S1D27) = **первая**; после наладки сохраняются первый контакт X и начальный угол
          - "Если каждую следующую деталь тоже налаживают вручную, установите **не перв.**: наладка обновляет только начальный угол, первый контакт X остаётся от первой детали — размер партии сохраняется"
  - h3: Автоматическая наладка
    marks: [ifIsAuto]
    body:
      - steps:
          - t: Нажмите внизу **Замер Настройка ножа**, чтобы открыть экран автоматической наладки
            img: {src: auto_int.png, h: 300}
            marks: [ifIsInternal]
          - t: Нажмите внизу **Замер Настройка ножа**, чтобы открыть экран автоматической наладки
            img: {src: auto_ext.png, h: 300}
            marks: [ifIsExternal]
          - "?ifIsExternal: Привяжите [позицию совмещения датчика/щупа с кругом](section_5.html#S5D2): вручную совместите центр датчика (щупа) с вершиной круга и запишите Z; при наличии датчика и щупа введите также [расстояние зонда](section_5.html#S5D4)"
          - "?ifIsInternal: Выберите [структура](section_5.html#S5D41) по базовому элементу: **внутренняя дорожка качения** — по канавке резьбы, **обратное отверстие** — по обратному отверстию и т. п.; при необходимости выберите [Режим измерения](section_5.html#S5D42)"
          - "?ifIsInternal: Привяжите [горизонтальное расстояние Z](section_5.html#S5D6) (один раз для нового станка или после замены измерительного устройства); для обратного отверстия привяжите также [Центральное положение зонда.X](section_5.html#S5D24)"
          - "?ifIsInternal: Внутренняя дорожка: вручную введите датчик в первую канавку и запишите [положение измерения.Z](section_5.html#S5D7); подведите к стенке до появления сигнала, ещё примерно на 0,2 мм дальше и запишите [положение измерения.X](section_5.html#S5D9)"
          - "?ifIsInternal: Обратное отверстие: введите радиус щупа, наружный диаметр, положение отверстия и др., вручную коснитесь щупом правого торца и введите [Настройки измерения правого конца.Z](section_5.html#S5D37)"
          - Сначала отшлифуйте одну деталь с ручной наладкой и убедитесь, что смещения нет, затем используйте автоматическую наладку
          - "Подсветите клавишу **Автоматическая наладка** на панели и нажмите **CYCLE START**: измерительное устройство выдвигается, автоматически измеряет и вычисляет начальный угол, затем убирается"
          - Если после шлифования есть смещение, исправьте его в [корректировке результатов наладки](section_5.html#S5D1); поправка прибавляется к каждой следующей автоматической наладке
          - "?ifIsNotCenter: При включённом в конфигурации станка **Прямое шлифование после автоматической настройки инструмента** шлифование начинается сразу после измерения; иначе программа завершается после измерения и шлифование запускается CYCLE START"
          - "?ifIsCenter: На шлифовальном центре после автоматической наладки обработка начинается автоматически с операциями, выбранными на экране выбора обработки"
      - p: "Частые сообщения автоматической наладки:"
      - table:
          - [Сообщение, Причина и устранение]
          - ["?ifIsExternal: Расстояние до заготовки слишком велико, или измерительное положение слишком далеко!", "Стороны не найдены в пределах 300° вперёд и назад: проверьте позицию совмещения, полностью ли выдвинуто устройство и установлена ли деталь"]
          - ["?ifIsExternal: ошибка при возврате измерительного щупа, пожалуйста, проверьте", "Датчик стоит на вершине витка и не сошёл с неё за 3 шага по 5°: проверьте положение датчика и деталь"]
          - ["?ifIsInternal: ошибка в установке на измерительную позицию!", "Внутренняя дорожка: по Z не найдены стороны канавки; проверьте, что положение измерения Z в канавке, а положение X заходит за стенку отверстия"]
          - ["?ifIsInternal: Ошибка измерения, проверьте положение измерения!", "Внутренняя дорожка: датчик многократно попадает на вершину (после 5 сдвигов): проверьте, совмещено ли положение измерения Z с канавкой"]
          - ["?ifIsInternal: ошибка в установке наружного диаметра!", "Щуп не находит правый торец, стенку отверстия или ступеньку в ожидаемом месте: проверьте наружный диаметр, центральное положение зонда, радиус щупа и расстояние отверстия от правого конца"]
          - ["?ifIsInternal: измерительная головка не может войти в отверстие, проверьте параметры!", "Щуп не входит в обратное или торцевое отверстие: проверьте расстояние от правого конца, угол отверстия и глубину выреза; при необходимости включите обнаружение периметра отверстия"]
          - ["?ifIsInternal: Ошибка измерения, нет сигнала щупа!", "Реверс правого торца: не найдена лыска или торец правого возвратного элемента; проверьте позиции выравнивания и измерения торца"]
          - ["?ifIsInternal: Ошибка положения справа, проверьте установку заготовки.", "Измеренный правый торец отличается от настройки больше порога: проверьте зажим или измерьте заново и измените настройку"]
          - ["?ifIsCenter: Ошибка положения слева, проверьте установку заготовки.", "Измеренный левый торец отличается от настройки больше порога: проверьте зажим или измерьте заново и измените настройку"]
          - ["?ifIsCenter: длина заготовки указана неверно!", "При левом измерении по Z не найден левый торец: проверьте длину внешнего круга, высоту левого фланца и левый угол измерения"]
          - ["?ifIsCenter: внешний выбег: … mm, круговость заготовки превышает допустимое значение! Порог: … mm", "Биение по 3 точкам превышает порог: проверьте зажим и приспособление"]
