title: Управление конфигурацией станка
head1: Функции станка
refs: |
  Параметры см. [Экран конфигурации станка](section_7.html)
blocks:
  - h3: Экран конфигурации станка
    body:
      - img: {src: setting_password.png, h: 300}
      - p: |
          Экран конфигурации станка — экран управления конфигурацией изготовителя: структура станка, включение и скрытие опциональных функций, ограничения диапазонов ввода параметров
          Экран защищён паролем: при входе показывается код запроса, изготовитель сообщает по нему пароль разблокировки
          **Для доступа или изменения конфигурации станка обратитесь к изготовителю станка**; не изменяйте её самостоятельно — неверные настройки могут вызвать неправильные движения станка
      - alarm: "Обращайтесь к изготовителю по конфигурации станка в следующих случаях:"
        items:
          - Нужно включить или выключить опциональные экраны — пробный прогон, сегментную коррекцию, переменный шаг, фаску обратного отверстия, статистику и т. п.
          - После замены системы ЧПУ или повторного импорта программы станка, когда нужно сбросить данные станка
          - Нужно расширить или сузить диапазон ввода параметров, например коррекции среднего диаметра или подачи процесса
