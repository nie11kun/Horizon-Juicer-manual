title: Экран резервного копирования и восстановления
head1: Параметры экранов HMI
blocks:
- h3: Экран резервного копирования и восстановления параметров
  body:
  - p: Клавиша **Резервное копирование** справа на стартовой странице открывает этот экран только после включения в конфигурации станка **Резервное копирование и восстановление параметров** (иначе нажатие ничего не делает)
  - img:
      src: backup_restore.png
      h: 300
  - params:
    - id: S31D1
      name: Выбор режима
      rec: нет
      range: обработка / резервное копирование / восстанавливаться
      text: '**обработка**: CYCLE START запускает обычную программу шлифования

        **резервное копирование** / **восстанавливаться**: CYCLE START выполняет резервное копирование или восстановление параметров, шлифования нет

        После копирования или восстановления обязательно переключите обратно на **обработка**, иначе станок не сможет нормально работать; при выходе с экрана клавишей **возвращаться** (справа внизу) режим автоматически переключается на обработку

        '
    - id: S31D2
      name: Путь резервного копирования
      rec: нет
      range: внутреннийSPF / впередUSB / CFКарта
      text: 'Место хранения файла резервной копии

        Для копирования на передний USB поместите файл конфигурации **extdev.ini** в системный каталог **/oem/sinumerik/nck** (или соответствующий каталог user) и перезапустите систему. Задний USB можно использовать только для восстановления, не для копирования

        '
    - id: S31D3
      name: Каталог резервного копирования
      rec: нет
      range: имя папки копии
      text: 'Если папки нет, она создаётся автоматически

        '
    - id: S31D4
      name: имя файла (резервной копии)
      rec: нет
      range: имя файла копии
      text: 'Файл копии сохраняется в папке копии; если его нет, он создаётся автоматически

        '
    - id: S31D5
      name: Режим резервного копирования
      rec: нет
      range: все переменные / Пользовательские переменные
      text: 'Копировать все глобальные переменные или только выбранные

        Для пользовательских переменных задайте также Список каталогов, Имя списка и Количество строк списка

        Правила списка см. [Резервное копирование и восстановление параметров](section_30.html)

        '
    - id: S31D6
      name: Список каталогов
      rec: нет
      range: папка списка пользовательских переменных
      text: 'Папка должна находиться в каталоге подпрограмм системы

        Правила списка см. [Резервное копирование и восстановление параметров](section_30.html)

        '
    - id: S31D7
      name: Имя списка
      rec: нет
      range: имя списка пользовательских переменных
      text: 'По умолчанию текстовый файл, расширение не вводится

        Правила списка см. [Резервное копирование и восстановление параметров](section_30.html)

        '
    - id: S31D8
      name: Количество строк списка
      rec: нет
      range: 0-800
      text: 'Общее число строк файла списка пользовательских переменных

        Система читает переменные списка построчно до этого числа строк

        Правила списка см. [Резервное копирование и восстановление параметров](section_30.html)

        '
    - id: S31D9
      name: путь восстановления
      rec: нет
      range: внутреннийSPF / назадUSB / впередUSB / CFКарта
      text: 'Где хранится восстанавливаемый файл копии

        Для восстановления с заднего USB логический диск должен быть настроен с именем **//DEV_3**

        '
    - id: S31D10
      name: каталог восстановления
      rec: нет
      range: имя папки восстановления
      text: 'Папка, в которой находится восстанавливаемый файл копии

        '
    - id: S31D11
      name: имя файла (восстановления)
      rec: нет
      range: имя файла восстановления
      text: 'Файл восстановления хранится в папке восстановления

        '
refs: 'Порядок работы см. [Резервное копирование и восстановление параметров](section_30.html)

  Нажмите клавишу **Резервное копирование** справа на стартовой странице (уровень пароля пользователя и включение в конфигурации станка)

  '
