title: Параметры торцов
head1: Параметры экранов HMI
blocks:
- h3: Параметры шлифования
  body:
  - img:
      src: center_face_grind.png
      h: 300
  - params:
    - id: S27D3
      name: Режим обработки
      rec: по необходимости
      range: Единичн / Массовое
      text: 'Определяет, с какой позиции начинается шлифование

        **Единичн**: после запуска обработка продолжается с **текущей** позиции; для наладки или дошлифовки одной детали

        **Массовое**: после запуска обработка начинается с **начальной** позиции; для непрерывной обработки партии

        '
    - id: S27D1
      var: INI[44]
      name: Высота фланца левого торца
      rec: нет
      range: больше нуля
      text: 'Влияет на шлифование левого торца и автоматическую наладку

        Измерьте фактическую высоту фланца детали с точностью 0,1 мм

        '
    - id: S27D4
      name: Нач. точка шлифования.X (левый торец)
      rec: рассчитывается автоматически
      range: нет
      text: 'Рассчитывается по текущему контакту наружного цилиндра, только чтение

        ?ifIsHasU: начальная точка = текущий контакт цилиндра + 0,1 мм

        ?ifIsNotHasUFront: начальная точка = текущий контакт цилиндра + 0,1 мм

        ?ifIsNotHasUBack: начальная точка = текущий контакт цилиндра - 0,1 мм

        '
    - id: S27D5
      name: Конеч. точка шлифования.X (левый торец)
      rec: рассчитывается автоматически
      range: нет
      text: 'Рассчитывается по текущему контакту цилиндра и высоте левого фланца, только чтение

        ?ifIsHasU: конечная точка = текущий контакт цилиндра + высота фланца + 1 мм

        ?ifIsNotHasUFront: конечная точка = текущий контакт цилиндра + высота фланца + 1 мм

        ?ifIsNotHasUBack: конечная точка = текущий контакт цилиндра - высота фланца - 1 мм

        При возвратном ходе конечная точка дополнительно сокращается на **Компенсация конечной точки** в столбце левого торца

        '
    - id: S27D6
      name: Левый конец начального контакта.Z / начальный контакт шлифования.Z
      rec: ввести после ручного замера
      range: нет
      ac: 4
      text: 'Координата Z, с которой круг начинает шлифовать левый торец. При ручной наладке подведите круг к левому торцу с зазором около 0,05 мм и введите Z

        В режиме Массовое каждая деталь начинается отсюда; по ней рассчитывается и начальная точка шлифования цилиндра; после правки торцевого круга корректируется на величину правки

        '
    - id: S27D7
      name: Левый конец в настоящее время находится в контакте.Z / Текущий контакт шлифования.Z
      rec: накапливается автоматически
      range: нет
      ac: 4
      text: 'Текущая позиция шлифования левого торца, обновляется после каждой подачи; в режиме Единичн программа продолжает отсюда

        '
    - id: S27D2
      name: Толщина правой торцевой стенки
      rec: нет
      range: больше нуля
      text: 'Влияет на шлифование правого торца

        Измерьте фактическую толщину стенки детали с точностью 0,1 мм

        '
    - id: S27D8
      name: Нач. точка шлифования.X (правый торец)
      rec: рассчитывается автоматически
      range: нет
      text: 'Рассчитывается по текущему контакту цилиндра и толщине правой стенки, только чтение

        ?ifIsHasU: начальная точка = текущий контакт цилиндра - толщина стенки

        ?ifIsNotHasUFront: начальная точка = текущий контакт цилиндра - толщина стенки

        ?ifIsNotHasUBack: начальная точка = текущий контакт цилиндра + толщина стенки

        '
    - id: S27D9
      name: Конеч. точка шлифования.X (правый торец)
      rec: рассчитывается автоматически
      range: нет
      text: 'Рассчитывается по текущему контакту цилиндра, только чтение

        ?ifIsHasU: конечная точка = текущий контакт цилиндра + 1 мм

        ?ifIsNotHasUFront: конечная точка = текущий контакт цилиндра + 1 мм

        ?ifIsNotHasUBack: конечная точка = текущий контакт цилиндра - 1 мм

        При возвратном ходе конечная точка дополнительно сокращается на **Компенсация конечной точки** в столбце правого торца

        '
    - id: S27D10
      name: правый конец начального контакта.Z / начальный контакт шлифования.Z
      rec: ввести после ручного замера
      range: нет
      ac: 4
      text: 'Координата Z, с которой круг начинает шлифовать правый торец. При ручной наладке подведите круг к правому торцу с зазором около 0,05 мм и введите Z

        В режиме Массовое каждая деталь начинается отсюда; по ней рассчитывается и конечная точка шлифования цилиндра; после правки торцевого круга корректируется на величину правки

        '
    - id: S27D11
      name: Правый конец в настоящее время находится в контакте.Z / Текущий контакт шлифования.Z
      rec: накапливается автоматически
      range: нет
      ac: 4
      text: 'Текущая позиция шлифования правого торца, обновляется после каждой подачи; в режиме Единичн программа продолжает отсюда

        '
- h3: Параметры процесса
  body:
  - img:
      src: center_face_process.png
      h: 300
  - params:
    - id: S27D40
      name: Левый конец накопительного шлифования / Левая крайняя настройка шлифования / Правый конец накопительного шлифования / Правый конец настройки шлифования
      range: только чтение
      unit: мм
      readonly: true
      text: 'Заданный общий съём процессов левого и правого торца (проходы × подача всех этапов) и уже снятая с текущей детали величина

        '
      var: PROCESS[61]、PROCESS[117]、PROCESS[62]、PROCESS[118]
    - id: S27D12
      name: Обработано
      rec: '0'
      range: больше нуля
      text: 'Считается автоматически

        Увеличивается на 1 при каждом завершении программы в режиме Массовое

        '
    - id: S27D13
      name: Задано (правка через n деталей)
      rec: '0'
      range: по технологии
      text: 'Круг правится один раз после этого числа деталей

        Позволяет автоматически править круг после нескольких деталей

        Примечание: правка использует чистовые параметры страницы правки (проходы / величина / скорость)

        '
    - id: S27D14
      name: число проходов
      rec: нет
      range: больше нуля
      text: 'По припуску детали

        '
    - id: S27D15
      name: глубина подачи
      rec: 0,005~0,05
      range: больше нуля
      text: 'Распределите подачу по технологии: обычно большая подача на этапе Черновая и малая на этапе Чистовая

        '
    - id: S27D16
      name: скорость шлифования
      rec: '100'
      range: больше нуля
      text: 'Скорость перемещения круга от начальной до конечной точки шлифования

        '
    - id: S27D17
      name: правка через n проходов
      rec: нет
      range: больше нуля
      text: 'Круг правится, когда число проходов текущего этапа достигает этого значения

        Примечание: правка использует чистовые параметры страницы правки (проходы / величина / скорость)

        '
    - id: S27D18
      name: линейная скорость круга
      rec: 30 м/с
      range: 15~50
      text: 'Линейная скорость шлифования сильно зависит от материала круга и детали

        Определите значение испытанием

        При включённом **Режим постоянной скорости** в конфигурации станка значение только для чтения, вводится частота круга

        '
    - id: S27D19
      name: частота вращения бабки
      rec: '120'
      range: по технологии
      unit: об/мин
      text: 'Частота бабки при шлифовании торцов; влияет на шероховатость и производительность. Обычно около 120 об/мин, корректируйте по результату

        '
- h3: Параметры правки
  body:
  - img:
      src: center_face_dress.png
      h: 300
  - params:
    - id: S27D20
      name: Совокупная сумма обрезки
      rec: нет
      range: нет
      text: 'Величина, снятая правкой с текущего круга, по радиусу

        '
    - id: S27D21
      name: Точная регулировка конуса
      rec: '0'
      range: 0~0,02
      text: 'Если на торце детали небольшой конус, этот параметр правит на круге небольшой наклон для исправления

        Только для тонкой подстройки; большое значение оставит полосы на поверхности

        '
    - id: S27D22
      name: ВидКруга_Правк (состояние круга)
      rec: нет
      range: новый шлифовальный круг / старый шлифовальный круг
      text: 'После установки нового круга переключите на новый; задайте также правильный диаметр нового круга и начальную позицию правки

        '
    - id: S27D23
      name: Кол-во черн.прох.
      rec: нет
      range: больше нуля
      text: 'Число черновых проходов при правке клавишей правки

        '
    - id: S27D24
      name: Глубина черновой правки
      rec: нет
      range: больше нуля
      text: 'Подача на черновой проход правки

        '
    - id: S27D25
      name: Подача_для_черн. (скорость черновой правки)
      rec: нет
      range: больше нуля
      text: 'Скорость черновой правки

        '
    - id: S27D26
      name: Кол-во чист.прох
      rec: нет
      range: больше нуля
      text: 'Число чистовых проходов при правке клавишей правки

        Правка во время шлифования использует это же число

        '
    - id: S27D27
      name: Глубина чистовой правки (на экране показано как $85309)
      rec: нет
      range: больше нуля
      text: 'Подача на чистовой проход правки

        '
    - id: S27D28
      name: Чистовая подача (скорость чистовой правки)
      rec: нет
      range: больше нуля
      text: 'Скорость чистовой правки

        '
    - id: S27D29
      name: Обрезать начальную точку.X
      rec: координата алмаза примерно в 5 мм перед кругом
      range: нет
      text: 'Вручную подведите алмаз к подходящей позиции перед кругом и запишите координату как начальную точку правки

        '
    - id: S27D30
      name: конечная точка обрезки.X
      rec: координата алмаза примерно в 5 мм за кругом
      range: нет
      text: 'Вручную подведите алмаз к подходящей позиции за кругом и запишите координату как конечную точку правки

        '
    - id: S27D31
      name: Лин.скор.круга (при правке)
      rec: нет
      range: больше нуля
      text: 'Линейная скорость круга при правке; задайте подходящее значение для качества правки

        При включённом **Режим постоянной скорости** значение только для чтения, вводится частота круга

        '
    - id: S27D32
      name: Контакт подстройки тока.Z (текущий контакт правки)
      rec: накапливается автоматически
      range: нет
      text: 'Координата Z алмаза и круга в направлении влево/вправо

        Координата касания текущего круга с алмазом; при состоянии «старый круг» правка начинается отсюда. Обновляется после каждой правки

        '
    - id: S27D33
      name: первоначальный триммирующий контакт.Z (начальный контакт правки)
      rec: ввести после ручного замера
      range: нет
      text: 'Координата Z алмаза и круга в направлении влево/вправо

        Позиция правки для нового круга; при первой правке алмаз не должен касаться круга на ходе от начальной к конечной точке

        '
    - id: S27D34
      name: способ шлифования
      rec: по необходимости
      range: взад и вперед / Держать
      text: 'Движение при шлифовании

        взад и вперед: после подачи круг проходит вертикально от начальной до конечной точки и обратно

        Держать: круг подаётся без вертикального движения (врезное шлифование)

        '
    - id: S27D35
      name: частота вращения круга при шлифовании
      rec: по необходимости
      range: больше нуля
      text: 'Частота круга при шлифовании

        При включённом **Режим постоянной скорости** вводится напрямую, иначе пересчитывается из линейной скорости (только чтение)

        '
    - id: S27D36
      name: Скорость правки колеса (частота круга при правке)
      rec: по необходимости
      range: больше нуля
      text: 'Частота круга при правке

        При включённом **Режим постоянной скорости** вводится напрямую, иначе пересчитывается из линейной скорости (только чтение)

        '
    - id: S27D37
      name: Компенсация обрезки во время обработки
      rec: нет
      range: -0,5~0,5
      text: 'Коррекция позиции шлифования при каждой правке во время шлифования

        Положительное значение — в положительном направлении оси

        Применяется на каждую правку; для случаев, когда размер детали стабильно уходит в одну сторону

        Показывается после включения в конфигурации станка **Отображение параметров компенсации положения шлифования после правки**

        '
    - id: S27D38
      name: Компенсация конечной точки (левого торца)
      rec: нет
      range: больше нуля, меньше высоты фланца
      text: 'Коррекция конечной точки возвратного хода при шлифовании левого торца

        По умолчанию конечная точка — на высоте фланца; если круг не должен полностью сходить с левого торца, задайте коррекцию

        Пример: 5 мм — ход заканчивается за 5 мм до высоты фланца

        Не задавайте слишком большое значение, иначе конечная точка окажется ближе к цилиндру, чем начальная

        '
    - id: S27D39
      name: Компенсация конечной точки (правого торца)
      rec: нет
      range: больше нуля, меньше толщины стенки
      text: 'Коррекция конечной точки возвратного хода при шлифовании правого торца

        По умолчанию конечная точка — на толщине стенки; если круг не должен полностью сходить с правого торца, задайте коррекцию

        Пример: 5 мм — ход заканчивается за 5 мм до толщины стенки

        Не задавайте слишком большое значение, иначе конечная точка окажется ближе к цилиндру, чем начальная

        '
refs: 'Порядок работы см. [Шлифование наружного цилиндра и торцов](section_24.html)

  На шлифовальном центре нажмите внизу экранов пользователя **Торцевая грань параметр**; клавиши справа переключают параметры шлифования / процесса / правки

  '
