title: Экран шлифования
head1: Параметры экранов HMI
refs: 'Порядок работы см. [Шлифование](section_12.html), расширенные функции — [Расширенные функции шлифования](section_13.html)

  На экранах пользователя нажмите внизу клавишу **Пар-ры параметр** (шлифование), чтобы открыть эту страницу

  '
blocks:
- h3: Основной экран шлифования
  body:
  - img:
      src: grind_main_ext.png
      h: 300
    marks:
    - ifIsExternal
  - img:
      src: grind_main_int.png
      h: 300
    marks:
    - ifIsInternal
  - note: 'В левом верхнем углу в реальном времени показаны машинные координаты X/Z и смещения DRF (маховичок) — для считывания позиций при ручных замерах

      Во время работы программы (цикл запущен) параметры заготовки и позиций доступны только для чтения; после остановки их снова можно изменять

      Зелёная область внизу (Угол начала обработки / текущий контакт.X / первый контакт X) — результат наладки, по умолчанию заблокирована (только чтение)

      '
  - params:
    - id: S1D1
      name: Режим обработки
      range: Единичн / Массовое
      var: INI[27]
      ac: 4
      text: 'Определяет, с какой позиции X круг начинает врезание при каждом запуске программы

        **Единичн** (наладка по одной детали): продолжение с позиции шлифования, достигнутой в конце прошлого запуска (текущий контакт.X); для пробного шлифования первой детали и дошлифовки той же детали

        **Массовое** (серийное производство): при каждом запуске текущий контакт.X сбрасывается на первый контакт X и накопленная подача процесса обнуляется, каждая новая деталь шлифуется полностью от позиции наладки

        Переключайте на Массовое только после того, как первая деталь отшлифована правильно

        '
    - id: S1D8
      name: Направл. резьбы
      range: Правое / левое
      var: INI[1]
      ac: 4
      text: 'Задаётся по чертежу детали. Направление резьбы определяет направление вращения оси C при движении Z, а также, с какого конца детали (левого или правого) начинается шлифование

        '
    - id: S1D9
      name: Количество заходов
      range: 1~100
      var: WORK[1]
      ac: 4
      text: 'Число заходов резьбы по чертежу. Угол оси C рассчитывается по ходу = заходы × шаг; многозаходные резьбы шлифуются заход за заходом с делением

        '
    - id: S1D4
      name: Шаг резьбы
      range: 0~100
      unit: мм
      var: INI[5]
      ac: 4
      text: 'Шаг резьбы по чертежу (расстояние между соседними витками, а не ход)

        ?ifIsExternal,ifIsHasWorm: На станках с функцией червяка в режиме червяка значение вычисляется как модуль × π и вручную не изменяется

        '
    - id: S1D53
      marks:
      - ifIsExternal
      - ifIsHasWorm
      name: Включение червяка
      range: винт / червяк
      var: INI[87]
      ac: 4
      text: 'Показывается только на станках с функцией червяка

        **винт**: вводится шаг, правка использует встроенные резьбовые профили

        **червяк**: вводится модуль, шаг пересчитывается как π × модуль, правка использует профиль червяка, угол подъёма рассчитывается по делительному диаметру

        '
    - id: S1D54
      marks:
      - ifIsExternal
      - ifIsHasWorm
      name: Червячный модуль
      range: 0~50
      unit: мм
      var: INI[77]
      ac: 4
      text: 'Только для станков с функцией червяка, вводится при Включение червяка = червяк. Введите нормальный/осевой модуль по чертежу; экран рассчитывает шаг = π × модуль

        '
    - id: S1D55
      marks:
      - ifIsExternal
      - ifIsHasWorm
      name: Диаметр делительной окружности
      range: 0~400
      unit: мм
      var: INI[40]
      ac: 4
      text: 'Только для станков с функцией червяка; вводится в режиме червяка при включённом автоматическом расчёте угла подъёма: угол = arctan(заходы × шаг / (π × делительный диаметр))

        '
    - id: S1D16
      name: Конус
      rec: по чертежу детали
      range: -10~10
      var: INI[15]
      ac: 4
      text: 'Вводится для конических резьб; для цилиндрической резьбы введите 0

        Значение — изменение радиуса на единицу длины детали: для конусности 1:16 введите 1/16/2 = 0,03125

        Если известны диаметры обоих концов: (больший диаметр - меньший диаметр) / длина / 2

        ?ifIsExternal: Наружная резьба шлифуется от меньшего конца к большему; при шлифовании от меньшего к большему вводите положительное значение, иначе отрицательное

        ?ifIsInternal: Внутренняя резьба шлифуется от большего конца к меньшему; при шлифовании от большего к меньшему вводите положительное значение, иначе отрицательное

        Полное приращение X по длине = длина шлифования × конус + Компенс. конуса

        '
    - id: S1D19
      name: Угол спирали (переключатель)
      range: ON / OFF
      var: INI[39]
      ac: 4
      text: '**ON**: угол подъёма рассчитывается по заходам, шагу и среднему диаметру: угол = arctan(заходы × шаг / (π × средний диаметр))

        **OFF**: угол подъёма вводится вручную

        '
    - id: S1D20
      name: Угол спирали
      range: -90~90
      unit: °
      var: INI[18]
      ac: 4
      text: 'На станках с осью A шлифовальная бабка перед шлифованием и наладкой поворачивается на этот угол; значение используется также для пересчёта профиля в нормальное сечение при правке

        ?ifIsHasA: На станках с осью A при запуске наладки или шлифования гидрозажим автоматически освобождается и бабка поворачивается на этот угол

        '
    - id: S1D23
      name: Средний диаметр
      range: 0~500
      unit: мм
      var: INI[40]
      ac: 4
      text: 'Используется только для автоматического расчёта угла подъёма; вводится после включения переключателя Угол спирали. При OFF поле недоступно

        '
    - id: S1D10
      name: Конец резьбы Z, координата (левый конец)
      range: -2000~2000
      unit: мм
      var: INI[2]
      ac: 4
      text: 'Вручную подведите центр круга к левому концу шлифуемой резьбы и запишите машинную координату Z

        Разность левого и правого конца — длина шлифования; круг должен прошлифовать всю резьбу

        '
    - id: S1D11
      name: Начало резьбы Z, координата (правый конец)
      range: -2000~2000
      unit: мм
      var: INI[3]
      ac: 4
      text: 'Вручную подведите центр круга к правому концу шлифуемой резьбы и запишите машинную координату Z

        Программа по направлению резьбы сама решает, начинать шлифование с левого или правого конца

        '
    - id: S1D12
      marks:
      - ifIsExternal
      name: Безоп.коорд.X (начальная позиция наладки)
      rec: вблизи наружного диаметра детали
      range: безопасная позиция, круг вне детали
      unit: мм
      var: INI[11]
      ac: 4
      text: 'Для наружной резьбы — начальная позиция наладки: при наладке ось X сначала ускоренно перемещается сюда, затем используется маховичок

        Установите как можно ближе к наружному диаметру детали без риска и запишите координату X

        '
    - id: S1D28
      marks:
      - ifIsInternal
      name: центр заготовки.X
      rec: координата X, при которой центр круга совпадает с центром бабки
      range: нет
      unit: мм
      var: INI[11]
      ac: 4
      text: 'Для внутренней резьбы круг входит в отверстие и выходит из него по Z в этой позиции X, поэтому её нужно задать точно

        Замер: переместите X до касания кругом стенки отверстия, запишите X1; измерьте диаметр отверстия D1 и диаметр круга D2

        Центр заготовки = X1 ± (D1 - D2) / 2 (знак в сторону центра отверстия)

        '
    - id: S1D52
      marks:
      - ifIsExternal
      - ifIsHasLoadingArm
      name: Безоп. коорд. Z (позиция загрузки)
      rec: позиция Z, удобная для загрузки манипулятором
      range: нет
      unit: мм
      var: INI[29]
      ac: 4
      text: 'Показывается только на станках с манипулятором

        Перед загрузкой/выгрузкой манипулятором ось Z перемещается в эту позицию и ждёт манипулятор

        '
    - id: S1D30
      marks:
      - ifIsInternal
      name: Безоп.коорд.Z
      rec: круг полностью вне детали
      range: -2000~2000
      unit: мм
      var: INI[29]
      ac: 4
      text: 'В начале внутреннего шлифования, при правке и при выходе ось Z сначала перемещается сюда; здесь круг выходит из отверстия

        Должна быть не менее чем на 30 мм дальше правого конца детали, чтобы в этой позиции безопасно перемещать X

        '
    - id: S1D14
      name: Безоп. коорд. X
      rec: ось X вдали от детали
      range: нет
      unit: мм
      var: INI[24]
      ac: 4
      text: 'Безопасная позиция, в которую отходит ось X при запуске программы, в конце обработки и после аварийного прерывания

        Рекомендуется позиция подальше назад, чтобы движения Z, C и загрузки не задевали деталь

        '
    - id: S1D29
      name: Нач. угол C (угол зажима детали)
      rec: угол, удобный для загрузки и выгрузки
      range: 0~360
      unit: °
      var: INI[28]
      ac: 4
      text: 'В конце программы бабка изделия (ось C) поворачивается на этот угол для удобного зажима/снятия детали или захвата манипулятором

        '
    - id: S1D18
      marks:
      - ifIsExternal
      name: Без. отвод X (безопасный отвод при шлифовании)
      rec: круг полностью вне детали
      range: ≥ 10
      unit: мм
      var: TECHNOLOGY[130]
      ac: 4
      text: 'Для наружной резьбы: после каждого прохода в конечной точке ось X отводится на это расстояние от первого контакта X, затем Z возвращается в начальную точку

        Безопасная позиция = первый контакт X + это расстояние; обратный ход Z не должен задевать деталь

        '
    - id: S1D15
      name: Компенс. шага (по всей длине)
      rec: по протоколу измерений
      range: -500~500
      unit: мм
      var: INI[25]
      ac: 7
      text: 'Исправляет накопленную ошибку шага по всей длине; введите ошибку хода по всей длине из протокола измерений

        Программа использует полный угол C = 360 × (длина шлифования - компенсация) / ход. Положительное значение уменьшает угол C на той же длине — реальный ход увеличивается; отрицательное — наоборот

        '
    - id: S1D17
      name: Компенс. конуса (по всей длине)
      rec: по результатам измерений
      range: -9~9
      unit: мм
      var: INI[142]
      ac: 7
      text: 'Используется, если после шлифования средний диаметр на концах различается; значение — радиальная компенсация на всю длину

        Складывается с конусом: полное приращение X = длина шлифования × конус + Компенс. конуса

        '
    - id: S1D51
      marks:
      - ifIsInternal
      name: Метод выхода
      rec: по размеру круга и отверстия
      range: Выход напрямую / спиральный выход
      var: INI[85]
      ac: 4
      text: 'Как круг выходит из отверстия после достижения конца резьбы

        **Выход напрямую**: X возвращается в центр заготовки, затем Z выходит по прямой; если круг меньше отверстия

        **спиральный выход**: выход по винтовой линии резьбы; если круг больше отверстия или на пути выхода есть уступ

        '
- h3: Коррекции и результат наладки
  body:
  - params:
    - id: S1D2
      name: Компенс. диаметра (коррекция среднего диаметра)
      range: по умолчанию ±1 (предел можно изменить в конфигурации станка)
      unit: мм
      var: GRIND[5]
      ac: 7
      text: 'Если измеренный средний диаметр после шлифования отличается от заданного, введите разность по диаметру здесь вместо изменения подачи процесса

        Положительное значение увеличивает средний диаметр (наружная резьба — меньше съём, внутренняя — больше), отрицательное уменьшает

        Пример: средний диаметр наружной резьбы больше на 0,02 мм → введите -0,02

        Однократная коррекция: в начале следующего шлифования половина значения прибавляется к текущему контакту X и первому контакту X, после чего значение обнуляется (отдельная правка и наладка его не используют, оно сохраняется до шлифования)

        Сначала разблокируйте ввод значком замка справа

        '
    - id: S1D3
      name: Компенс. длины (коррекция смещения)
      range: -100~100
      unit: мм
      var: TOOL_SET[43]
      ac: 7
      text: 'Если стороны профиля прошлифованы неравномерно (смещение), введите смещение по Z

        Программа пересчитывает смещение Z в угол = смещение / ход × 360 и прибавляет его к углу начала обработки, круг смещается в канавке в осевом направлении

        Однократная коррекция: в начале следующего шлифования прибавляется к углу начала обработки и обнуляется; сначала разблокируйте ввод значком замка справа

        '
    - id: S1D56
      name: Переключатель блокировки параметров
      range: открыт / закрыт
      ac: 7
      text: 'Значки замка рядом с коррекцией среднего диаметра, коррекцией смещения и результатом наладки защищают важные значения от случайного изменения

        Закрыт (по умолчанию): параметры только для чтения; нажмите, чтобы открыть для изменения. После выхода с экрана и повторного входа блокировка восстанавливается автоматически

        '
    - id: S1D24
      name: Угол начала обработки (C)
      range: 0~360
      unit: °
      var: TOOL_SET[5]
      ac: 4
      text: 'Начальный угол оси C для шлифования, вычисляемый автоматически по окончании наладки, чтобы круг точно входил в винтовую канавку

        Обычно вручную не изменяется; коррекция смещения исправляет его автоматически

        '
    - id: S1D25
      name: текущий контакт.X
      range: нет
      unit: мм
      var: PROCESS[5]
      ac: 4
      text: 'Текущая позиция шлифования круга в детали, обновляется автоматически после каждой подачи

        В режиме Единичн программа продолжает с этой позиции

        ?ifIsCenter: На главном экране шлифовального центра показывается как Внутренний шлифовальный токовый контакт.X

        '
    - id: S1D26
      name: первыйКонтактХ (первый контакт X)
      range: нет
      unit: мм
      var: PROCESS[14]
      ac: 4
      text: 'Позиция первого контакта круга с деталью, записанная по окончании наладки

        В режиме Массовое каждый запуск начинается с этой позиции; после правки круга программа автоматически корректирует значение на величину правки

        ?ifIsCenter: На главном экране шлифовального центра показывается как Внутреннее шлифование, начальный контакт.X

        '
    - id: S1D27
      name: первая деталь партии (первая / не перв.)
      range: первая / не перв.
      var: TOOL_SET[58]
      ac: 4
      text: 'Для серийного производства, когда каждую деталь налаживают вручную, но размер должен оставаться одинаковым

        **первая**: наладка заново вычисляет первый контакт X и угол начала обработки

        **не перв.**: наладка вычисляет только начальный угол, первый контакт X остаётся от первой детали — размер партии сохраняется

        '
- h3: Настройки наладки
  marks:
  - ifIsExternal
  body:
  - params:
    - id: S1D5
      marks:
      - ifIsHasReOperate
      name: тип наладки (Первый раз устанавливаю нож / Вторая настройка инструмента)
      range: Первый раз устанавливаю нож / Вторая настройка инструмента
      var: TOOL_SET[9]
      ac: 4
      text: '**Первая наладка**: новая деталь или новый круг; круг сначала идёт в начальную позицию наладки, затем вводится в резьбу маховичком

        **Вторая наладка**: деталь уже шлифовалась (например, перезажата после черновой обработки); круг сразу входит в существующую канавку, нужна только точная подстройка

        После первой наладки программа автоматически переключается на вторую

        '
    - id: S1D6
      name: Точка наладки
      range: Начало / Середина / Задано
      var: TOOL_SET[20]
      ac: 4
      text: 'Позиция Z, в которой круг входит в резьбу при ручной наладке

        **Начало**: на начальном конце шлифования

        **Середина**: посередине между левым и правым концом; для длинных деталей уменьшает накопленную ошибку

        **Задано**: в координате Z, введённой ниже в поле Расположение; чтобы обойти недостающие витки, уступы и т. п.

        '
    - id: S1D7
      name: Расположение (позиция наладки в заданной точке)
      range: между левым и правым концом детали
      unit: мм
      var: INI[135]
      ac: 4
      text: 'Вводится только при Точка наладки = Задано. Вручную подведите круг в нужную позицию и запишите координату Z

        '
- h3: Тип шлифования
  body:
  - params:
    - id: S1D57
      marks:
      - ifIsInternal
      name: Тип шлифования (тип станка)
      range: Внешняя резьба / Внутренняя резьба / Червь / внешний круг / кольцевая канавка
      var: GRIND[1]
      ac: 4
      text: 'Показывает тип шлифования программы, заданный конфигурацией станка; обычно не изменяется

        '
    - id: S1D31
      name: Тип шлифования
      range: Нить (резьба) / кольцевая канавка
      var: RING[1]
      ac: 4
      text: 'При выборе «кольцевая канавка» автоматически открывается экран кольцевых канавок, шлифование ведётся канавка за канавкой

        Переключение возможно только после включения функции кольцевых канавок в конфигурации станка

        '
    - id: S1D32
      marks:
      - ifIsScrewTap
      name: Метчик (шлифование метчика)
      range: нет / да
      var: SCREW_TAP[1]
      ac: 4
      text: '«да» открывает экран параметров метчика, шлифование как метчика (с затылованием осью B); для обычной резьбы выберите «нет»

        '
- h3: Экран кольцевых канавок
  body:
  - img:
      src: grind_ring.png
      h: 300
  - note: 'Чтобы выбрать кольцевую канавку как тип шлифования, обработка кольцевых канавок должна быть включена в конфигурации станка

      После выбора экран открывается автоматически. Слева показано текущее состояние (только чтение): число канавок, канавок к обработке, обработано, начало Z/X текущей канавки и текущий X

      Канавки задаются максимум 4 группами; внутри группы канавки равномерно расположены с одинаковыми параметрами. Позиции Z/X каждой канавки программа вычисляет по первой канавке и параметрам групп

      '
  - params:
    - id: S1D43
      name: Начало шлифования паза
      rec: '1'
      range: ≥ 1
      var: RING[3]
      ac: 4
      text: 'Номер канавки, с которой начинается шлифование (считая от начального конца). Для новой детали — 1; при дошлифовке части канавок — номер первой из них

        '
    - id: S1D44
      name: Торцевая шлифовальная канавка (последняя канавка)
      range: ≥ первой канавки
      var: RING[4]
      ac: 4
      text: 'Номер канавки, на которой шлифование заканчивается. Канавок к обработке = последняя - первая + 1

        '
    - id: S1D45
      name: Начало первого слота.Z
      range: нет
      unit: мм
      var: INI[3]
      ac: 4
      text: 'Позиция Z шлифования первой канавки: вручную совместите круг с центром первой канавки и запишите Z

        '
    - id: S1D46
      name: Начало первого слота.X
      range: нет
      unit: мм
      var: PROCESS[14]
      ac: 4
      text: 'Позиция первого контакта по X для первой канавки: вручную коснитесь кругом первой канавки и запишите X; остальные канавки вычисляются по вертикальному смещению и подъёму

        '
    - id: S1D48
      name: число канавок (Первая группа ~ Четвертая группа)
      range: ≥ 0
      var: RING[12]、RING[22]、RING[32]、RING[42]
      ac: 4
      text: 'Количество канавок в группе; для неиспользуемых групп — 0

        '
    - id: S1D47
      name: шаг канавок / подъём канавки (Первая группа ~ Четвертая группа)
      range: шаг больше 0
      unit: мм
      var: 槽距 RING[11]、RING[21]、RING[31]、RING[41]；槽升量 TECHNOLOGY[165]~TECHNOLOGY[168]
      ac: 4
      text: '**Шаг**: расстояние по Z между соседними канавками группы

        **Подъём**: приращение X (по радиусу) от канавки к канавке в группе, для деталей с изменяющимся диаметром дна; для одинакового диаметра — 0

        '
    - id: S1D49
      name: горизонтальное смещение группы (Первая группа ~ Четвертая группа)
      range: нет
      unit: мм
      var: RING[13]、RING[23]、RING[33]、RING[43]
      ac: 4
      text: 'Дополнительное смещение по Z первой канавки группы относительно последней канавки предыдущей группы, если расстояние между группами отличается от шага внутри группы

        '
    - id: S1D50
      name: вертикальное смещение группы (Первая группа ~ Четвертая группа)
      range: нет
      unit: мм
      var: RING[14]、RING[24]、RING[34]、RING[44]
      ac: 4
      text: 'Дополнительное смещение по X первой канавки группы относительно последней канавки предыдущей группы, если диаметр дна в группах различается

        '
    - id: S1D125
      name: состояние канавок (Количество кольцевых канавок / Количество слотов, подлежащих обработке / Количество обработанных пазов / Начало текущего слота.Z / Начало текущего слота.X)
      range: только чтение
      readonly: true
      var: RING[2]、RING[5]、RING[6]、RING[10]、RING[9]
      text: 'Слева в реальном времени показаны: общее число канавок, канавок к обработке в этот раз, уже обработано, а также начальные Z и X шлифуемой канавки

        '
- h3: Экран параметров метчика
  marks:
  - ifIsScrewTap
  body:
  - img:
      src: grind_tap.png
      h: 300
  - note: 'Открывается при Метчик = да. Параметры заготовки справа те же, что на основном экране; при шлифовании метчика ось B (затылование) движется синхронно с осью C по числу канавок

      '
  - params:
    - id: S1D33
      name: Кол-во канавок
      range: ≥ 1
      var: SCREW_TAP[2]
      ac: 4
      text: 'Количество стружечных канавок метчика, обычно 3 или 4; по чертежу

        '
    - id: S1D34
      name: Тип слота (тип канавки)
      range: Прямая / спиральная
      var: SCREW_TAP[3]
      ac: 4
      text: 'По чертежу. Для спиральных канавок задайте также направление и угол канавки; программа корректирует по ним такт затылования оси B

        '
    - id: S1D35
      name: Тип канавки (направление спиральной канавки)
      range: Правое / Левое
      var: SCREW_TAP[4]
      ac: 4
      text: 'Направление спирали стружечных канавок; для прямых канавок не нужно. Эквивалентное число канавок для затылования рассчитывается по-разному при совпадающем и противоположном направлении с резьбой

        '
    - id: S1D36
      name: Угол подъема (спиральной канавки)
      range: 0~90
      unit: °
      var: SCREW_TAP[5]
      ac: 4
      text: 'Угол спирали стружечных канавок по чертежу; для прямых канавок не нужен

        '
    - id: S1D39
      name: Вырезка (через зуб)
      range: OFF / ON
      var: SCREW_TAP[7]
      ac: 4
      text: 'Включите для метчиков с шлифованием через зуб и задайте две корректировки ниже

        '
    - id: S1D40
      name: Угол работы (коррекция начального угла C через зуб)
      rec: по результату шлифования
      range: -360~360
      unit: °
      var: SCREW_TAP[8]
      ac: 4
      text: 'Коррекция начального угла C при шлифовании через зуб; начальный угол B корректируется пропорционально. Изменяйте, если затылование или начало резания не на месте

        '
    - id: S1D41
      name: Угол отскока (коррекция угла через зуб)
      rec: по результату шлифования
      range: -360~360
      unit: °
      var: SCREW_TAP[9]
      ac: 4
      text: 'Коррекция угла шлифования каждой канавки при шлифовании через зуб; если сохраняемые зубья задеваются, измените значение, чтобы они оставались целыми

        '
    - id: S1D42
      name: Нач. угол B
      range: 0~360
      unit: °
      var: SCREW_TAP[6]
      ac: 4
      text: 'Начальный угол оси B (затылование) в начале шлифования; изменение смещает затылование относительно режущей кромки

        Коррекция смещения также пропорционально корректирует это значение

        '
    - id: S1D58
      name: Предварительная черновая правка (настройка черновой обработки)
      range: да / нет
      var: TECHNOLOGY[175]
      ac: 4
      text: '**да** (черновая с затылованием): на этапе Черновая тоже выполняется затылование осью B

        **нет** (черновая без затылования): без шлифования через зуб черновая выполняется как обычная резьба, затылование только на следующих этапах — черновая быстрее

        '
- h3: Экран переменного шага
  body:
  - img:
      src: grind_pitch.png
      h: 300
  - note: 'Для деталей, у которых в середине есть участок с шагом, отличным от концов. После включения переменного шага в конфигурации станка справа на основном экране появляется клавиша **Преобразование высоты тона** (переменный шаг)

      От начальной точки до бита преобразования 1 используется обычный шаг, от бита 1 до бита 2 — шаг преобразования, от бита 2 до конца снова обычный шаг

      '
  - params:
    - id: S1D60
      name: переменный шаг
      range: OFF / ON
      var: TOOL_SET[60]
      ac: 4
      text: 'При включении шлифование ведётся с переменным шагом; если позиции преобразования заданы неверно (не между началом и концом шлифования или в обратном порядке), программа останавливается с аварийным сообщением

        '
    - id: S1D61
      name: Плавная резьба (плавная траектория)
      range: OFF / ON
      var: TECHNOLOGY[302]
      ac: 4
      text: 'При включении переходы шага сглаживаются плавной кривой, без резкого изменения шага

        При первой проверке позиций преобразования выключите, чтобы видеть реальные точки изменения

        '
    - id: S1D62
      name: Значение преобразования высоты тона (шаг преобразования)
      range: 0~100
      unit: мм
      var: TOOL_SET[67]
      ac: 4
      text: 'Шаг на участке преобразования (между битами 1 и 2)

        '
    - id: S1D63
      name: Режим переменного шага
      range: заданный угол / Преобразование конечной точки
      var: TOOL_SET[61]
      ac: 4
      text: '**заданный угол**: вводится угол поворота C на участке преобразования; бит 2 рассчитывается по биту 1, шагу и углу

        **Преобразование конечной точки**: шаг преобразования используется от бита 1 до конца шлифования

        '
    - id: S1D64
      name: переменный угол наклона (угол преобразования)
      range: ≥ 0
      unit: °
      var: TOOL_SET[68]
      ac: 4
      text: 'В режиме «заданный угол»: угол поворота оси C на участке преобразования

        '
    - id: S1D65
      name: Бит преобразования координат1 / Бит преобразования координат2
      range: между началом и концом шлифования
      unit: мм
      var: TOOL_SET[65] / TOOL_SET[66]
      ac: 4
      text: 'Координаты Z начала и конца участка преобразования. Бит 1 вводится вручную (совместите круг с местом, где начинает меняться шаг, и запишите Z)

        Бит 2 рассчитывается по режиму переменного шага и показывается только для чтения

        На экране нескольких шагов бит 1 показан как Позиция1

        '
- h3: Экран нескольких шагов
  body:
  - img:
      src: grind_multipitch.png
      h: 300
  - note: 'Для деталей с несколькими последовательными участками разного шага. После установки переменного шага в многоучастковый режим в конфигурации станка эта страница открывается клавишей **Преобразование высоты тона** справа

      Начиная с Позиция1 — 5 участков; начало следующего участка рассчитывается по шагу и углу C участка: Позиция(n+1) = Позиция n ∓ шаг n × угол n / 360

      '
  - params:
    - id: S1D66
      name: Позиция1 ~ Позиция6
      range: между началом и концом шлифования
      unit: мм
      var: TOOL_SET[65]、TECHNOLOGY[418]~TECHNOLOGY[421]、TOOL_SET[66]
      ac: 4
      text: 'Позиция1 — координата Z начала первого участка, вводится вручную; Позиция2…Позиция6 рассчитываются по шагу и углу каждого участка и показываются только для чтения

        '
    - id: S1D67
      name: угол каждого участка
      range: ≥ 0
      unit: °
      var: TECHNOLOGY[422]~TECHNOLOGY[426]
      ac: 4
      text: 'Угол поворота оси C на каждом участке преобразования

        '
    - id: S1D68
      name: шаг каждого участка
      range: больше 0
      unit: мм
      var: TECHNOLOGY[427]~TECHNOLOGY[431]
      ac: 4
      text: 'Шаг каждого участка; для ненужных участков установите угол 0

        '
- h3: Экран самошлифования приспособления
  marks:
  - ifIsInternal
  body:
  - img:
      src: grind_fixture.png
      h: 300
  - note: 'Для станков внутренней резьбы, шлифующих (исправляющих) базовую поверхность приспособления собственным кругом. После включения в конфигурации станка на основном экране появляется клавиша **Самошлифовальное приспособление**

      При включении запуск программы выполняет шлифование приспособления и специальную правку круга для него; резьба не шлифуется. Обязательно выключите после работы

      '
  - params:
    - id: S1D70
      name: Самошлифовальное приспособление
      range: OFF / ON
      var: INI[69]
      ac: 4
      text: 'При включении запуск программы выполняет цикл шлифования приспособления

        '
    - id: S1D71
      name: безопасный стартовый бит.Z
      range: нет
      unit: мм
      var: INI[90]
      ac: 4
      text: 'Безопасная позиция Z перед шлифованием и правкой приспособления; движение X здесь не должно вызывать столкновений

        '
    - id: S1D72
      name: Левая конечная координата.Z / Правая конечная координата.Z
      range: нет
      unit: мм
      var: DRESSER[61] / DRESSER[62]
      ac: 4
      text: 'Координаты Z круга на левом и правом краю поверхности приспособления; при шлифовании Z качается между ними

        '
    - id: S1D73
      name: текущий контакт.X (шлифование приспособления)
      range: нет
      unit: мм
      var: DRESSER[63]
      ac: 4
      text: 'Координата X касания кругом поверхности приспособления; автоматически увеличивается после каждой подачи

        '
    - id: S1D74
      name: Время шлифования / Количество корма (число проходов / подача)
      range: проходов ≥ 1
      unit: подача в мм
      var: DRESSER[54] / DRESSER[70]
      ac: 4
      text: 'Число ходов шлифования приспособления и подача X на ход

        '
    - id: S1D75
      name: скорость шлифования / Скорость вращения головы / Время жительства / Частота вр. круга
      range: нет
      var: PROCESS[40] / TECHNOLOGY[232] / DRESSER[53] / DRESSER[119]
      ac: 4
      text: '**скорость шлифования**: скорость качания Z (мм/мин)

        **Скорость вращения головы**: частота вращения бабки изделия при шлифовании приспособления (об/мин)

        **Время жительства**: выдержка в каждой конечной точке (с)

        **Частота вр. круга**: частота вращения круга при шлифовании приспособления (об/мин)

        '
    - id: S1D76
      name: Обрезать левый конец.W / Обрезать правый конец.W / Угол обрезки.C
      range: нет
      var: DRESSER[64] / DRESSER[65] / INI[68]
      ac: 4
      text: 'Для правки круга перед шлифованием приспособления: координаты левого и правого конца хода горизонтальной оси правки и угол C, при котором находится правящее устройство на бабке

        '
    - id: S1D77
      name: Точка контакта X / Время обрезки / Количество корма (правка приспособления)
      range: нет
      var: DRESSER[66] / DRESSER[67] / DRESSER[68]
      ac: 4
      text: 'Координата X касания кругом правящего устройства, число проходов правки и подача на проход

        '
    - id: S1D78
      name: Скорость правки / Част. вращ. круга / Скорость правки колеса
      range: нет
      var: PROCESS[37] / DRESSER[117] / DRESSER[118]
      ac: 4
      text: 'Скорость оси правки, частота вращения шлифовального круга и правящего круга при правке приспособления; при скорости правящего круга 0 он не запускается

        '
- h3: Экран фаски обратного отверстия
  body:
  - img:
      src: grind_chamfer.png
      h: 300
  - note: 'Для внутренней резьбы шариковых гаек: там, где резьба пересекается с отверстием возвратного канала, круг отходит в заданных позициях, образуя фаску без острых кромок. После включения в конфигурации станка на основном экране появляется клавиша **Обратная фаска отверстия**

      Для каждой фаски: в пределах угла перехода C ось X наклонно отходит на глубину фаски X, держит её на угле перевода C и наклонно возвращается в резьбу

      '
  - params:
    - id: S1D80
      name: включение фаски
      range: OFF / ON
      var: INI[83]
      ac: 4
      text: 'При включении шлифование резьбы автоматически отходит в позициях фасок

        '
    - id: S1D81
      name: Прецизионное шлифование без снятия фасок
      range: OFF / ON
      var: INI[111]
      ac: 4
      text: 'При включении на этапах Чистовая и Финишная отход для фасок не выполняется; фаски делаются только на этапах Черновая и Получистовая

        '
    - id: S1D82
      name: компенсировать.X (режим коррекции конца фаски)
      range: прямой / Градиент
      var: TECHNOLOGY[293]
      ac: 4
      text: 'Как применяется коррекция X в конце фаски

        **прямой**: сразу после фаски

        **Градиент**: плавно от конца этой фаски до начала следующей

        Показывается после включения в конфигурации станка **Обратная фаска отверстия → фаска-XПоказать параметры компенсации**

        '
    - id: S1D83
      name: Плавная резьба (плавная траектория)
      range: OFF / ON
      var: TOOL_SET[18]
      ac: 4
      text: 'При включении траектория отхода сглаживается; при первой проверке позиций фасок выключите

        '
    - id: S1D84
      name: Залить в угол перехода.C / Глубина фаски.X / угол перевода.C
      range: угол перехода ≥ 0, угол перевода ≥ 2
      var: R241 / R242 / R243
      ac: 4
      text: '**Залить в угол перехода.C**: угол C наклона фаски; чем больше угол, тем положе наклон

        **Глубина фаски.X**: глубина отхода по X

        **угол перевода.C**: угол C, на котором глубина фаски сохраняется (длина дна фаски)

        '
    - id: S1D85
      name: Угол предварительной фаски / Глубина предварительной фаски
      range: угол ≥ 0
      var: TECHNOLOGY[238] / TECHNOLOGY[239]
      ac: 4
      text: 'Дополнительный угол C и глубина X предварительной фаски на обоих концах фаски — для перехода на входе и выходе

        '
    - id: S1D86
      name: Настройки режима
      range: Ручной ввод / Автоматический расчет / автоматическое обнаружение
      var: INI[23]
      ac: 4
      text: '**Ручной ввод**: координата Z каждой фаски вводится в полях 1.Z~20.Z слева

        **Автоматический расчет**: вводится только первая фаска, остальные рассчитываются по числу обратных отверстий, их шагу и коррекции второй дорожки

        ?ifIsAuto: **автоматическое обнаружение**: щуп автоматической наладки находит базовое отверстие, по нему рассчитываются все фаски

        '
    - id: S1D87
      name: Тип обратного отверстия
      range: Двойная дорожка / Одноместная дорожка
      var: TECHNOLOGY[387]
      ac: 4
      text: '**Двойная дорожка**: каждому отверстию соответствуют две соседние дорожки (через виток) по одной фаске; отверстия равномерно расположены

        **Одноместная дорожка**: одна фаска на отверстие; шаг каждого отверстия вводится ниже в «Расстояние между фасками.Z» (до 24)

        '
    - id: S1D88
      name: Количество обратных отверстий / Обратное расстояние между отверстиями.Z
      range: количество 1~12
      unit: шаг в мм
      var: INI[45] / INI[46]
      ac: 4
      text: 'Для автоматического расчёта: число обратных отверстий и расстояние по Z между центрами соседних отверстий

        '
    - id: S1D89
      name: Текущая компенсация за вторую дорожку.Z
      range: нет
      unit: мм
      var: TOOL_SET[8]
      readonly: true
      text: 'Двойная дорожка: коррекция Z второй фаски относительно первой (через виток), рассчитывается по текущему диаметру круга:

        коррекция = базовое значение.Z + (текущий диаметр круга - минимальный эталонный диаметр) × смещение на мм.Z (если диаметр не больше эталонного — базовое значение)

        '
    - id: S1D90
      name: Компенсированный минимальный эталонный диаметр / Основа компенсации и компенсация.Z / Компенсация каждого миллиметра смещения.Z
      range: смещение на мм -0,5~0,5
      var: TECHNOLOGY[68] / TECHNOLOGY[69] / TECHNOLOGY[70]
      ac: 4
      text: 'Для расчёта коррекции второй дорожки: изменение диаметра круга меняет точку контакта с фаской, это компенсируется линейно смещением на миллиметр диаметра

        '
    - id: S1D91
      name: Эталонное отверстие для измерений-Верно / компенсация позиции.Z
      range: базовое отверстие 1~10
      var: INI[84] / INI[47]
      ac: 4
      text: '**Эталонное отверстие для измерений (справа)**: какое обратное отверстие, считая справа, измеряется при автоматическом обнаружении

        **компенсация позиции.Z**: точная подстройка Z первой фаски

        '
    - id: S1D92
      name: Количество фасок(1-24) / 1.Z~20.Z
      range: количество фасок 1~24
      unit: мм
      var: R240 / R244~R263
      ac: 4
      text: 'Количество фасок и координата Z начала каждой; в ручном режиме вводятся по одной, в автоматических режимах заполняются программой

        '
    - id: S1D93
      name: Расстояние между фасками.Z (одна дорожка)
      range: 0~100
      unit: мм
      var: TECHNOLOGY[393]~TECHNOLOGY[411]
      ac: 4
      text: 'Одна дорожка с неравным шагом: расстояние по Z между соседними фасками

        '
    - id: S1D94
      name: Компенсация конечной точки фаски.X
      range: -0,1~0,1
      unit: мм
      var: TECHNOLOGY[272]~TECHNOLOGY[291]
      ac: 4
      text: 'Коррекция X после фасок 1…20 для выравнивания размеров резьбы по обе стороны фаски; способ применения выбирается в «компенсировать.X»

        Показывается после включения в конфигурации станка **Обратная фаска отверстия → фаска-XПоказать параметры компенсации**

        '
- h3: Экран пробного прогона
  body:
  - img:
      src: grind_dryrun.png
      h: 300
  - note: 'Для прогрева станка: станок без нагрузки совершает возвратные движения в заданном диапазоне, чтобы температура шпинделя и направляющих стабилизировалась. После включения в конфигурации станка на основном экране появляется клавиша **пробный прогон**

      '
  - params:
    - id: S1D100
      name: Включение пробного хода
      range: OFF / ON
      var: GRIND[10]
      ac: 7
      text: 'При включении запуск программы выполняет прогрев пробным прогоном без шлифования; после прогрева обязательно выключите

        '
    - id: S1D101
      marks:
      - ifIsInternal
      name: Автоматический коготь (автоматический патрон)
      range: OFF / ON
      var: TECHNOLOGY[35]
      ac: 4
      text: 'Разжимается и зажимается ли патрон автоматически во время пробного прогона, чтобы прогреть и гидропатрон

        '
    - id: S1D102
      name: Автоматически включать охлаждение
      range: OFF / ON
      var: TECHNOLOGY[67]
      ac: 4
      text: 'Включается ли СОЖ автоматически во время пробного прогона

        '
    - id: S1D103
      name: Прямая инициализация.Z / отрицательное завершение.Z
      range: нет
      unit: мм
      var: TECHNOLOGY[36] / TECHNOLOGY[39]
      ac: 4
      text: 'Начальная и конечная точка качания Z при пробном прогоне; ось C вращается вместе с Z

        '
    - id: S1D104
      name: Отрицательный начальный.X / прямое завершение.X
      range: нет
      unit: мм
      var: TECHNOLOGY[40] / TECHNOLOGY[49]
      ac: 4
      text: 'Задняя начальная и передняя конечная точка качания X при пробном прогоне; не должны задевать деталь и приспособление

        '
    - id: S1D105
      name: Частота вращ. круга / Скорость бега
      range: ≥ 0
      var: TECHNOLOGY[50] / TECHNOLOGY[55]
      ac: 4
      text: 'Частота вращения круга (об/мин) и скорость качания осей (мм/мин) при пробном прогоне

        '
- h3: Экран шлифования переменного диаметра
  body:
  - img:
      src: grind_diachange.png
      h: 300
  - note: 'Для резьб, глубина которых на обоих концах должна плавно уменьшаться (сбег): на концах круг отходит в заданном диапазоне углов, образуя переход. После включения в конфигурации станка на основном экране появляется клавиша **Шлифование переменным диаметром**

      Каждый конец: недействительный участок → переходный участок (плавная подача до нормальной глубины) → нормальная резьба

      '
  - params:
    - id: S1D110
      name: Возможность шлифования переменного диаметра
      range: OFF / ON
      var: TECHNOLOGY[110]
      ac: 7
      text: 'При включении оба конца резьбы шлифуются с переменным диаметром по параметрам ниже

        '
    - id: S1D111
      name: Плавная резьба (плавная траектория)
      range: OFF / ON
      var: TECHNOLOGY[301]
      ac: 4
      text: 'При включении участок переменного диаметра сглаживается; при первой проверке позиций выключите

        '
    - id: S1D112
      name: Неверное положение зуба (недействительный участок)
      range: Плавная обработка / Большая переработка
      var: TECHNOLOGY[155]
      ac: 7
      text: 'Обработка недействительного участка на концах

        **Плавная обработка**: недействительный участок сохраняет отход переменного диаметра

        **Большая переработка** (одинаковый диаметр): недействительный участок шлифуется на нормальную глубину резьбы

        '
    - id: S1D113
      name: Правый неправильный угол зуба / Левый неправильный угол зуба
      range: ≥ 0
      unit: °
      var: TECHNOLOGY[139] / TECHNOLOGY[140]
      ac: 4
      text: 'Угол C недействительного участка на правом и левом конце; длина по Z = угол / 360 × ход

        '
    - id: S1D114
      name: Уменьшение диаметра правой стороны / Левая сторона переменного диаметра
      range: -2~2
      unit: мм
      var: TECHNOLOGY[115] / TECHNOLOGY[117]
      ac: 4
      text: 'Отход X на конце относительно нормальной резьбы; положительное значение отводит круг (резьба мельче)

        '
    - id: S1D115
      name: Правый угол перехода / левый угол перехода
      range: ≥ 0
      unit: °
      var: TECHNOLOGY[116] / TECHNOLOGY[118]
      ac: 4
      text: 'Угол C, на котором отход возвращается к нормальной глубине; чем больше угол, тем плавнее переход

        '
    - id: S1D116
      name: Режим шлифования
      range: Резьба+Изменение диаметра / Только изменение диаметра
      var: TECHNOLOGY[379]
      ac: 4
      text: '**Резьба+Изменение диаметра**: каждый проход шлифует всю резьбу по траектории переменного диаметра

        **Только изменение диаметра**: сначала шлифуется нормальная резьба, затем отдельно участки переменного диаметра на обоих концах

        '
    - id: S1D117
      name: Количество изменений диаметра
      range: 1~100
      var: TECHNOLOGY[380]
      ac: 4
      text: 'В режиме «Только изменение диаметра»: число проходов по участкам переменного диаметра

        '
- h3: Экран сегментной коррекции
  body:
  - img:
      src: grind_segcomp.png
      h: 300
  - note: 'Для длинных резьб, у которых средний диаметр и ход корректируются по участкам по результатам измерений. После включения в конфигурации станка на основном экране появляется клавиша **Коррекция**

      Деталь делится максимум на 10 участков от правого конца к левому; правый и левый конец Z на экране показывают диапазон шлифования (только чтение)

      Сегментная коррекция действует только на обычную траекторию шлифования резьбы: если одновременно включены фаска обратного отверстия, шлифование переменного диаметра (режим Резьба+Изменение диаметра) или переменный шаг, эти траектории сегментную коррекцию не используют

      '
  - params:
    - id: S1D120
      name: Вкл. сегмент. компенс.
      range: OFF / ON
      var: TECHNOLOGY[311]
      ac: 7
      text: 'При включении шлифование идёт по траектории сегментной коррекции (не действует при ручной наладке и не работает вместе с фаской обратного отверстия, переменным диаметром или переменным шагом)

        '
    - id: S1D121
      name: Кол-во сегмент. компенс.
      range: 0~10
      var: TECHNOLOGY[312]
      ac: 7
      text: 'На сколько участков делится вся длина шлифования

        '
    - id: S1D122
      name: Сегмент n.Z (граница участка)
      range: между левым и правым концом детали
      unit: мм
      var: TECHNOLOGY[333]~TECHNOLOGY[341]
      ac: 4
      text: 'Координата Z границы между участком n и n+1 (считая от правого конца). Последний участок заканчивается на левом конце детали, поэтому вводится (число участков - 1) границ

        '
    - id: S1D123
      name: Сегмент n — коррекция среднего диаметра
      range: нет
      unit: мм
      var: TECHNOLOGY[313]~TECHNOLOGY[322]
      ac: 4
      text: 'Накопленная коррекция X (по радиусу) в конце участка n относительно начала шлифования, внутри участка — линейно

        '
    - id: S1D124
      name: Сегмент n — коррекция хода
      range: нет
      unit: мм
      var: TECHNOLOGY[323]~TECHNOLOGY[332]
      ac: 4
      text: 'Коррекция хода участка n: положительное значение увеличивает реальный ход участка, отрицательное уменьшает

        '
