title: Правка кругов для наружного цилиндра и торцов
head1: Функции станка
refs: |
  Параметры см. [Параметры наружного цилиндра](section_26.html) и [Параметры торцов](section_27.html)
  Правку круга внутренней резьбы см. [Правка шлифовального круга](section_10.html)
blocks:
  - h3: Правка наружного круга
    body:
      - steps:
          - t: Откройте **внешний круг параметр** и нажмите справа **Параметры обрезки**
            img: {src: center_od_dress.png, h: 300}
          - "Новый круг: установите состояние круга **новый шлифовальный круг**"
          - Задайте проходы, подачи и скорости черновой и чистовой правки (скорость — горизонтальная скорость алмаза)
          - "Гидравлическое правящее устройство: вручную выдвиньте его и убедитесь, что алмаз выдвинут полностью"
          - Вручную подведите алмаз к левому краю наружного круга и запишите Z в **Обрезать начальную точку.Z**
          - Вручную подведите алмаз к правому краю наружного круга и запишите Z в **конечная точка обрезки.Z**
          - "?ifIsHasU: В начальной точке правки слегка коснитесь алмазом наивысшей точки круга и задайте координату U как **начальный контакт правки**"
          - "?ifIsNotHasU: В начальной точке правки слегка коснитесь алмазом наивысшей точки круга и задайте координату X как **начальный контакт правки**"
          - Задайте по замеру диаметр нового круга и другие параметры
          - Вернитесь на экран выбора обработки и подсветите справа только **внешний круг**
          - Подсветите клавишу **Правка** и нажмите CYCLE START
      - note: |
          Правка старого круга: задайте черновые и чистовые проходы, подсветите клавишу правки и запустите
          Правка во время шлифования использует только чистовые проходы
          Если правка не запускается, проверьте начальную/конечную точки правки и работу датчика выдвижения алмаза
  - h3: Правка торцевого круга
    body:
      - steps:
          - t: Откройте **Торцевая грань параметр** и нажмите справа **Параметры обрезки**
            img: {src: center_face_dress.png, h: 300}
          - "Новый круг: установите состояние **новый шлифовальный круг** и задайте параметры черновой и чистовой правки"
          - Вручную выдвиньте гидравлическое правящее устройство и убедитесь, что оно на месте
          - "?ifIsHasU: Совместите алмаз с передним и задним краем торцевого круга и запишите координаты U как начальную и конечную точки правки"
          - "?ifIsNotHasU: Совместите алмаз с передним и задним краем торцевого круга и запишите координаты X как начальную и конечную точки правки"
          - Слегка коснитесь алмазом торца круга и задайте координату Z как **первоначальный триммирующий контакт.Z** (начальный контакт правки)
          - Вернитесь на экран выбора обработки и подсветите справа только **левый торец** или **Правый торец**
          - Подсветите клавишу **Правка** и нажмите CYCLE START
      - note: |
          После замены круга позиции правки всегда нужно привязать заново
          Каждая правка наружного круга соответственно смещает начальную и конечную точки шлифования цилиндра; ставшие неподходящими из-за этого точки правки также корректируются автоматически
