title: Экран конфигурации станка
head1: Параметры экранов HMI
refs: 'Экран конфигурации станка — экран управления конфигурацией для изготовителя и сервиса: структура станка, включение функций и ограничения ввода

  Вход: на стартовой странице нажмите справа расширенное меню (▷), затем **станок Конфигурация**; требуется пароль. **Для доступа обратитесь к изготовителю станка за паролем**

  Изменения действуют сразу; неверные настройки могут вызвать неправильные движения станка — не изменяйте их самостоятельно

  '
blocks:
- h3: Проверка пароля
  body:
  - img:
      src: setting_password.png
      h: 300
  - params:
    - id: S7D1
      name: Проверка пароля
      range: 6 цифр
      ac: 3
      text: 'Нажмите третью клавишу справа — в правом нижнем углу появится 6-значный код запроса. Сообщите код изготовителю, введите полученный пароль разблокировки в это поле и нажмите INPUT

        При каждом нажатии клавиши показывается новый код; при неверном пароле выдаётся сообщение

        '
- h3: Список конфигурации
  body:
  - img:
      src: setting_list.png
      h: 300
  - note: 'После разблокировки показывается список конфигурации; листайте клавишами страниц. Переключатели меняются клавишей SELECT, числа вводятся напрямую

      Клавиша **Сбросить данные** справа восстанавливает заводские значения этого станка (обязательно выполнить один раз после импорта нового пакета программ); выполняется после подтверждения

      '
  - params:
    - id: S7D2
      name: шлифование (группа настроек)
      range: см. таблицу
      ac: 3
      text: 'Тип привода круга, действие круга после обработки, спиральный выход, автоматический угол подъёма, режим постоянной скорости, расширенный интерфейс процесса, обработка кольцевых канавок, индикация трёхпроволочного измерения, автоматический расчёт черновой подачи, индикация компенсации после правки, направление обработки левой резьбы, управление автоматической дверью, отвод при обесточивании, дополнительный канал СОЖ, индикация давления, режим подачи при двунаправленном шлифовании и др.

        '
    - id: S7D3
      name: правка (группа настроек)
      range: см. таблицу
      ac: 3
      text: 'Тип привода правящего круга, действие правящего круга после обработки, режим подъёма нового круга, плоскость универсального профиля, индикация угла оси A при правке, реверс правящего круга, внешняя программа профиля, перенастройка скорости каждые 20 правок, ранний запуск ролика, обычный или профилированный новый круг, режимы треугольного/трапецеидального/двухрадиусного профилей, дополнительные профили, отдельные параметры контура нового круга, доводка сторон после профильной правки, правка плоского круга и др.

        '
    - id: S7D4
      name: наладка (группа настроек)
      range: см. таблицу
      ac: 3
      text: 'Режим ручной наладки (интерполяционная / статическая), угол ручной наладки, переход не первой детали сразу на первый контакт, устройство и режим автоматической наладки, датчик цилиндра щупа, направление измерения, режим автоматической наладки внутренней резьбы и др.

        '
    - id: S7D5
      marks:
      - ifIsCenter
      name: шлифовальный центр (группа настроек)
      range: см. таблицу
      ac: 3
      text: 'Тип привода наружного круга, направление вращения бабки при наружном/торцевом шлифовании, действие наружного круга после обработки, позиция стола после внутреннего шлифования, гидроуправление наружного правящего устройства, угол бабки при правке наружного круга, контроль боковой двери, модуль измерения в процессе и его скорости и др.

        '
    - id: S7D6
      name: включение скрытых экранов
      range: ON / OFF
      ac: 3
      text: 'Определяет, показываются ли в HMI экраны: резервное копирование и восстановление, статистика, жизненный цикл правящего круга, манипулятор, переменный шаг (один/много), самошлифование приспособления, фаска обратного отверстия, шлифование переменного диаметра, пробный прогон, сегментная коррекция, дополнительная конфигурация процесса, настройка оси Y, ресурс комплектующих

        Для выключенных функций клавиши не показываются и связанные параметры не действуют

        '
    - id: S7D7
      name: ограничения диапазона ввода параметров
      range: 0 — ограничение по умолчанию
      ac: 3
      text: 'Ограничивают значения, которые оператор может ввести на экранах, для защиты от ошибок:

        ?ifIsInternal: минимальное расстояние Безоп.коорд.Z от правого конца детали

        верхние пределы коррекции среднего диаметра, подачи процесса, частоты бабки и подачи правки

        ?ifIsCenter: верхний предел подачи правки наружного круга

        '
  - table:
    - - Пункт конфигурации (примеры)
      - Действие
    - - Движение шлифовального круга после обработки
      - после программы круг останавливается, сохраняет скорость или вращается на низкой скорости
    - - Режим постоянной скорости
      - на экранах процесса и правки частота круга вводится напрямую, линейная скорость меняется с диаметром
    - - Расширенный интерфейс процесса
      - каждый этап таблицы процесса получает свои параметры правки
    - - Автоматический расчет объема грубого шлифования
      - вводится общий съём, черновая подача рассчитывается обратно
    - - Завершить автоматическое закрытие обрезки/Ключ настройки инструмента
      - соответствующая функциональная клавиша панели выключается автоматически после правки или наладки
    - - Включение возврата при обесточивании
      - при пропадании питания круг автоматически отходит, чтобы не повредить деталь
    - - С автоматическим механизмом настройки инструмента
      - показывает экран и функцию автоматической наладки
    - - Преобразование высоты тона
      - 'OFF / один / много: нет экрана, экран одного участка или нескольких участков переменного шага'
