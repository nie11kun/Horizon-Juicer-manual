title: Выбор обработки
head1: Параметры экранов HMI
blocks:
- h3: Экран выбора обработки
  body:
  - img:
      src: center_select.png
      h: 300
  - note: 'Шлифовальный центр за один установ может последовательно шлифовать наружный цилиндр, левый/правый торцы, наружные ступени и внутреннюю резьбу. Страница сводит режимы обработки, съёмы и позиции контакта всех операций

      Клавиши справа **внешний круг / левый торец / Правый торец / шаги внешнего круга / Внутренняя резьба** при подсветке включают операцию в обработку; повторное нажатие отменяет

      ?ifIsHasLoadingArm: На станках с манипулятором подсвеченная справа **с манипулятором** включает автоматическую загрузку/выгрузку, **пробный тест** — прогон последовательности манипулятора без деталей

      Слева показаны начальные и текущие контакты каждой операции, как на страницах параметров

      '
  - params:
    - id: S28D5
      name: Текущий съём припуска / Общий съём припуска, Левый конец накопительного шлифования / Левая крайняя настройка шлифования, Правый конец накопительного шлифования / Правый конец настройки шлифования (по операциям)
      range: только чтение
      unit: мм
      readonly: true
      var: PROCESS[59]、PROCESS[115]、PROCESS[61]、PROCESS[117]、PROCESS[62]、PROCESS[118]
      text: 'Заданный общий съём и уже снятая с текущей детали величина для каждой операции, как на странице параметров

        '
    - id: S28D6
      name: признаки выбора операций (внешний круг / Правый торец / левый торец / шаги внешнего круга / Внутренняя резьба)
      range: только чтение
      readonly: true
      var: PROCESS[44]、PROCESS[46]、PROCESS[45]、PROCESS[95]、PROCESS[42]
      text: 'Состояние выбора операций наружного цилиндра, правого торца, левого торца, ступеней и внутренней резьбы: при подсвеченной клавише справа в середине экрана показано, что операция выбрана и входит в обработку

        '
    - id: S28D7
      name: Онлайн-измерение
      range: OFF / ON
      ac: 4
      var: TECHNOLOGY[296]
      text: 'Показывается после включения в конфигурации станка модуля измерения в процессе: при включении наружный диаметр измеряется в процессе шлифования и шлифование заканчивается по достижении размера

        '
- h3: Выбор обработки
  body:
  - params:
    - id: S28D1
      name: Параметры процесса (внутренняя резьба)
      rec: открывает экран процесса внутренней резьбы
      range: кнопка
      text: 'Нажмите кнопку **Параметры процесса** в строке внутренней резьбы, чтобы открыть экран процесса внутренней резьбы

        '
    - id: S28D2
      var: TOOL_SET[60]
      name: переменный шаг
      rec: шлифуется ли деталь с переменным шагом
      range: постоянный шаг / переменный шаг
      text: 'Для обычных деталей с постоянным шагом выберите **постоянный шаг**

        Для деталей с переменным ходом выберите **переменный шаг** и задайте шаги на экране переменного шага (внизу **Пар-ры параметр**, затем справа **Преобразование высоты тона**)

        Показывается после установки **Преобразование высоты тона** в «один» или «много» в конфигурации станка

        '
    - id: S28D3
      name: Параметры процесса (наружный цилиндр)
      rec: открывает экран наружного процесса
      range: кнопка
      text: 'Нажмите кнопку **Параметры процесса** в строке наружного цилиндра, чтобы открыть экран наружного процесса

        '
    - id: S28D4
      name: Параметры процесса (торцы)
      rec: открывает экран процесса торцов
      range: кнопка
      text: 'Нажмите кнопку **Параметры процесса** в строке торцов, чтобы открыть экран процесса торцов

        '
refs: 'Порядок работы см. [Шлифование наружного цилиндра и торцов](section_24.html)

  '
