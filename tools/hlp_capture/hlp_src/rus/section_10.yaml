title: Правка шлифовального круга
head1: Функции станка
refs: |
  Параметры см. [Экран правки](section_3.html), [Экран правящего круга](section_4.html) и [Экран профиля зуба](section_6.html)
blocks:
  - h3: Виды правки
    body:
      - table:
          - [Вид правки, Когда выполняется, Используемые параметры]
          - [Правка нового круга, отдельно один раз после замены круга, "черновые + чистовые параметры экрана правки (новый круг правится слоями от периферии до полного профиля)"]
          - [Правка старого круга, отдельно для восстановления профиля, черновые + чистовые параметры экрана правки]
          - [Правка во время шлифования, автоматически по настройке правки экрана процесса, "чистовые параметры экрана правки (при расширенном процессе — параметры правки этапов таблицы процесса)"]
          - [Правка по числу деталей, автоматически перед следующей деталью после заданного числа деталей, чистовые параметры экрана правки]
  - h3: Правка нового круга
    body:
      - steps:
          - t: "?ifIsCenter: Шлифовальный центр: подсветите **Внутренняя резьба** справа на экране **обработка выбирать**, чтобы правился круг для внутреннего шлифования"
            marks: [ifIsCenter]
          - t: После установки нового круга нажмите внизу **Правка параметр**, чтобы открыть экран правки
            img: {src: dress_main_int.png, h: 300}
            marks: [ifIsInternal]
          - t: После установки нового круга нажмите внизу **Правка параметр**, чтобы открыть экран правки
            img: {src: dress_main_ext.png, h: 300}
            marks: [ifIsExternal]
          - t: "Выберите [Тип круга для правки](section_3.html#S3D2): **X-W** — интерполяционная правка дисковым кругом, **формированиеX** — накатной ролик"
            marks: [ifIsDressWare3]
          - t: "Выберите [Тип круга для правки](section_3.html#S3D1): **U-W** — интерполяционная правка дисковым кругом, **формированиеU** — накатной ролик"
            marks: [ifIsDressWare1]
          - t: "Интерполяционная правка: выберите [Тип правящего круга](section_3.html#S3D3) и [Форма зуба](section_3.html#S3D4), затем нажмите клавишу профиля справа и задайте параметры профиля"
            img: {src: shape_tri_int.png, h: 300}
          - t: "Нажмите клавишу правящего круга справа (Стандартный / Профильный / Двойной ролик / Вращающееся колесо) и введите по чертежу диаметр, радиусы или высоту зуба"
            img: {src: roller_single_int.png, h: 300}
          - t: "Привяжите правящий круг: задайте [межцентровое расстояние правки](section_4.html#S4D12) и [центр правки](section_4.html#S4D13)"
            marks: [ifIsInternal]
            note: |
              Межцентровое расстояние: измерьте диаметр нового круга D1 и введите его в Диам. нового круга; введите диаметр правящего круга D2; переместите X до касания периферии правящего круга и введите X1 в **текущий контакт.X**
              ?ifIsFrontDress: межцентровое расстояние = |X1 + D1/2 + D2/2|
              ?ifIsBackDress: межцентровое расстояние = |X1 - D1/2 - D2/2|
              После ввода **Точка контакта X,первая** на странице правящего круга должна быть равна X1 — тогда всё верно
              Центр правки: коснитесь торцов круга левой и правой стороной правящего круга, запишите Z1 и Z2; центр = (Z1 + Z2) / 2
          - t: "Привяжите правящий круг: задайте [центр правки](section_4.html#S4D6) и введите координату U касания правящим кругом периферии нового круга в [начальный контакт U](section_4.html#S4D2)"
            marks: [ifIsExternal]
          - t: "Вернитесь на экран правки и установите [состояние круга](section_3.html#S3D16) **новый шлифовальный круг**"
          - t: "Введите [Диам. нового круга](section_3.html#S3D14) (примерно на 0,2 мм больше измеренного), [Ширина шл. круга](section_3.html#S3D13) и [Лин.скор.круга](section_3.html#S3D15) (обычно около 22 м/с)"
          - t: "Задайте [Мин. диаметр](section_3.html#S3D5); при меньшем диаметре — аварийное сообщение"
          - t: "Задайте [максимальный диаметр шлифования](section_3.html#S3D6): новый круг автоматически правится до этого диаметра, чтобы входить в отверстие"
            marks: [ifIsInternal]
          - t: Задайте число проходов, подачи и скорости черновой и чистовой правки
            note: |
              ?ifIsInternal: Для нового круга внутренней резьбы программа сама рассчитывает черновые и чистовые проходы по (диаметр нового круга - максимальный диаметр шлифования) / 2 (примерно последние 5 — чистовые); введённые числа проходов не используются
          - t: Подсветите клавишу **Правка** на панели станка и нажмите **CYCLE START**; станок правит автоматически
            note: |
              После первого прохода правки состояние автоматически меняется на старый круг; диаметр и позиция шлифования обновляются с каждой правкой. При остановке и повторном запуске правка продолжается как для старого круга с текущего контакта
              При включённом в конфигурации станка «Завершить автоматическое закрытие обрезки/Ключ настройки инструмента» клавиша правки выключается автоматически
  - h3: Правка старого круга
    body:
      - steps:
          - Проверьте на экране правки, что состояние круга **старый шлифовальный круг**
          - Задайте число черновых и чистовых проходов и подачи
          - Подсветите клавишу **Правка** и нажмите **CYCLE START**; правка начинается с текущего контакта на странице правящего круга
  - h3: Правка во время шлифования
    body:
      - steps:
          - t: "На [экране процесса](section_2.html#S2D6) задайте для каждого этапа **правку через n проходов**; 0 — без правки на этапе"
            img: {src: process_batch.png, h: 300}
          - t: "На экране процесса задайте [Задано — большой / малый круг](section_2.html#S2D2) для правки через каждые n деталей"
          - t: Правка во время шлифования выполняет только чистовую правку с параметрами экрана правки; при расширенном процессе правка по этапам использует параметры этапов таблицы процесса, а правка по числу деталей — по-прежнему чистовые параметры экрана правки
          - t: Чтобы после правки сделать один проход без подачи, подсветите справа на экране процесса **После обрезки Пустой нож один раз** (не действует при счёте правки по заходам)
          - t: Счёт правки каждого этапа обнуляется в конце этапа и не переносится на следующий; правка по числу деталей считается после каждой готовой детали и выполняется перед следующей деталью при достижении числа
  - h3: Частые причины, по которым правка не запускается
    body:
      - alarm: "Если после запуска правки появляется сообщение или ничего не движется, проверьте:"
        items:
          - "Шаг, левый/правый конец, позиции отвода на экране шлифования не заданы разумно (для правки можно временно задать примерные значения)"
          - Межцентровое расстояние / центр правки заданы неверно или с неверным знаком
          - "?ifIsInternal: Текущий диаметр круга больше максимального или меньше минимального диаметра шлифования"
