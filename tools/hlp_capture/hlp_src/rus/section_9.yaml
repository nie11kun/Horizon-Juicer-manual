title: Стартовая страница и навигация
head1: Параметры экранов HMI
refs: 'Нажмите клавишу **CUSTOM** на панели оператора, чтобы открыть экраны станка; сначала показывается стартовая страница

  '
blocks:
- h3: Стартовая страница
  body:
  - img:
      src: welcome_main.png
      h: 300
  - note: 'На стартовой странице показан общий фон; модель станка и серийный номер смотрите в **Фабрика информация**. Программные клавиши справа:

      **Фабрика информация**: модель станка и серийный номер

      **Резервное копирование**: резервное копирование и восстановление параметров (нужен пароль пользователя; открывается только после включения в конфигурации станка)

      **Аксессуары Жизнь**: учёт количества использований изнашиваемых деталей (открывается только после включения в конфигурации станка)

      **обработка статистика**: количество деталей, отшлифованных каждым кругом (положение 3 ключа; открывается только после включения в конфигурации станка)

      Клавиши резервного копирования, ресурса комплектующих и статистики показываются всегда; если экран не включён в конфигурации станка, нажатие на клавишу его не открывает

      Клавиша ▷ внизу переключает на расширенное меню (**станок Конфигурация** — конфигурация станка, нужен пароль пользователя); повторное нажатие возвращает назад

      Клавиша **пользователь интерфейс** внизу экрана открывает экраны обработки (параметры шлифования и др.)

      '
- h3: Навигация по экранам пользователя
  body:
  - img:
      src: grind_main_int.png
      h: 300
    marks:
    - ifIsInternal
  - img:
      src: grind_main_ext.png
      h: 300
    marks:
    - ifIsExternal
  - note: 'Горизонтальные программные клавиши внизу экранов пользователя переключают страницы параметров:

      **Пар-ры параметр** (шлифование): параметры заготовки и позиций, коррекции, а также расширенные функции — пробный прогон, сегментная коррекция, переменный шаг и др.

      **Обраб. параметр** (процесс): таблица процесса для этапов Черновая, Получистовая, Чистовая, Финишная

      **Правка параметр**: параметры правки круга, профиля зуба и правящего круга

      ?ifIsAuto: **Замер Настройка ножа**: параметры автоматической наладки

      ?ifIsCenter: **внешний круг параметр / Торцевая грань параметр / обработка выбирать**: шлифование наружного цилиндра и торцов и выбор операций шлифовального центра

      **возвращаться**: назад на стартовую страницу

      Выберите параметр на любой странице и нажмите клавишу **HELP** на панели оператора — откроется справка по этому параметру

      '
  - img:
      src: help_view.png
      h: 300
  - note: 'Рисунок выше: после выбора параметра на экране автоматической наладки и нажатия HELP справка по нему показывается в нижней половине экрана; клавиши справа переключают полноэкранный режим, оглавление и поиск, выход из справки — соответствующей клавишей

      '
- h3: Функциональные клавиши панели оператора
  body:
  - note: 'После нажатия **CYCLE START** программа определяет, что выполнять, по подсвеченным функциональным клавишам на панели станка:

      **Правка**: только правка круга, без наладки и шлифования (даже если одновременно подсвечена клавиша наладки)

      **Ручная наладка**: выполняется ручная наладка, см. [Наладка инструмента](section_11.html)

      ?ifIsAuto: **Автоматическая наладка**: выполняется автоматическая наладка (если одновременно подсвечена клавиша ручной наладки — выполняется автоматическая)

      ?ifIsNotCenter: **Вращение оси C**: запускается шлифовальный круг и бабка изделия вращается непрерывно, без правки, наладки и шлифования; остановка клавишей RESET

      **Отвод**: нажатая во время правки, наладки или шлифования, прерывает текущее движение, круг безопасно выходит из заготовки и программа завершается (этой клавишей также завершают ручную наладку)

      Если ни одна из этих клавиш не подсвечена, CYCLE START запускает шлифование

      Если на экране пробного прогона включено **Включение пробного хода**, в первую очередь выполняется прогрев пробным прогоном и больше ничего

      ?ifIsCenter: Шлифовальный центр: правятся круги и шлифуются те операции, которые выбраны (подсвечены) на экране выбора обработки

      ?ifIsInternal: Станок для внутренней резьбы: при включённом **Самошлифовальное приспособление** шлифуется только приспособление

      '
- h3: Права доступа
  body:
  - note: 'Изменение параметров ограничено уровнем доступа системы ЧПУ; при недостаточном уровне параметр можно только просматривать:

      **Положение 0 ключа**: ежедневные корректировки — коррекция среднего диаметра, коррекция смещения, коррекции по всей длине

      **Положение 3 ключа**: большинство параметров обработки (заготовка, процесс, правка, наладка) и статистика

      **Пароль пользователя**: резервное копирование и вход в конфигурацию станка

      **Пароль изготовителя**: все пункты конфигурации станка

      Уровень доступа каждого параметра указан в его справке как «Уровень доступа»

      '
- h3: Информация о станке
  body:
  - img:
      src: info.png
      h: 300
  - params:
    - id: S9D1
      name: 'Серийный номер:'
      range: задаётся изготовителем
      ac: 3
      text: 'Заводской номер станка, совпадает с табличкой. При обращении в сервис сообщите этот номер и модель станка

        '
      var: INI[131]
