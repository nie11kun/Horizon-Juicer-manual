# 带红框标注的截图，在图下方统一输出说明（键为图片文件名）
welcome_main.png: 红框：右侧为欢迎页功能软键（备份恢复、配件寿命、加工统计需在机床配置中开启后才显示）；下方 **用户界面** 软键进入加工参数界面
dress_main_ext.png: 红框：单独修整时使用的粗修、精修参数
dress_main_int.png: 红框：单独修整时使用的粗修、精修参数
process_batch.png: 红框：各工序（粗磨、半精磨、精磨、终磨）的工艺参数表
center_select.png: 红框：选择本次加工包含的工序（外圆、右端面、左端面、外圆台阶、内螺纹），点亮表示选中
