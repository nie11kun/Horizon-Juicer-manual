title: 自动对刀界面
head1: HMI界面参数定义
refs: '具体操作步骤请参考[对刀](section_11.html)

  机床配置有自动对刀机构时，屏幕下方出现 **自动对刀** 软键，点击进入本页

  自动对刀：点亮操作面板上的自动对刀键后按循环启动，测量机构（接近开关或测头）自动伸出，找到工件上的定位基准，计算出 **加工起始角.C**，测量完成后机构退回，无需手动对刀

  自动对刀只计算加工起始角.C，不改变初始接触.X；测量成功后当前接触.X 复位为初始接触.X，工艺累计进刀清零，相当于从头开始磨削这个工件

  测头/开关每次寻找边缘时先快速接触，再退开慢速复测一次，以慢速结果为准；机床配置可改为只检测一次

  页面左上角实时显示测量机构的信号状态（点亮表示检测到工件），底部显示 X、Z、C 轴实时坐标，便于手动标定各位置

  '
blocks:
- h3: 通用参数
  body:
  - params:
    - id: S5D1
      name: 对刀结果调整
      rec: 按偏刀情况
      range: 无
      unit: mm 或 °（见说明）
      var: TOOL_SET[42]
      ac: 7
      text: '自动对刀完成并磨削后，如果发现螺纹两侧磨削不均（偏刀），用此值修正自动对刀的结果

        该值会持续叠加在每次自动对刀结果上，调整后无需重新标定测量机构

        ?ifIsExternal: 外螺纹：单位为 mm，相当于把测量到的位置沿 Z 向平移

        ?ifIsInternal: 内螺纹测量内滚道、测量反向孔（常规）、外圆面右端反：单位为 mm，相当于把测量到的位置沿 Z 向平移；测量反向孔（只测C）、测量右端台阶、测量右端孔：单位为 °，直接叠加到算出的加工起始角上

        '
- h3: 外螺纹自动对刀
  marks:
  - ifIsExternal
  body:
  - img:
      src: auto_ext.png
      h: 300
  - note: '外螺纹机床用接近开关和/或测头检测工件螺纹的牙侧。测量过程：

      **接近开关**：C 轴先转到 0°，开关伸出；如果正好碰在牙顶上，C 轴每次正转 5° 离开牙顶（最多 3 次，仍离不开则停机提示"测头回退出错,请检查"），然后正转、反转（各最多 300°）各找一次牙侧，两侧角度的中点即为牙槽中心

      **测头**：同时配有开关和测头时，开关先粗测，测头再从开关测得的角度按开关-测头距换算转到测头位置精测，以测头结果为准；只配测头时从上一次对刀记录的角度开始。测头伸出后同样正反转找两侧牙侧取中点

      测量完成后测量机构退回，程序按重合位、对刀结果调整与导程换算出加工起始角。C 轴转动范围内碰不到牙侧时报警"测头距离工件过远,或检测位置太靠外侧!"

      '
  - params:
    - id: S5D2
      name: 开关-砂轮重合位
      rec: 手动标定
      range: 无
      unit: mm
      var: INI[43]
      ac: 4
      text: '接近开关中心与砂轮齿顶在 Z 方向对齐时的 Z 坐标，只配接近开关时显示

        标定方法：手动移动工作台，使接近开关中心对准砂轮齿顶，记录此时 Z 坐标

        '
    - id: S5D3
      name: 测头-砂轮重合位
      rec: 手动标定
      range: 无
      unit: mm
      var: INI[43]
      ac: 4
      text: '测头中心与砂轮齿顶在 Z 方向对齐时的 Z 坐标，配有测头时显示（同时配有开关和测头时，以测头为基准，开关位置由开关-测头距换算）

        标定方法：手动移动工作台，使测头中心对准砂轮齿顶，记录此时 Z 坐标

        '
    - id: S5D4
      marks:
      - ifIsKaiGuanAndCeTouCeLiang
      name: 开关-测头距
      range: 无
      unit: mm
      var: TOOL_SET[51]
      ac: 4
      text: '同时配有接近开关和测头时显示：接近开关中心到测头中心的水平距离

        测头在左、开关在右时输入正值，反之输入负值；程序据此把测头测量位置换算到同一条螺纹槽上

        '
- h3: 内螺纹自动对刀
  marks:
  - ifIsInternal
  body:
  - note: '内螺纹机床把测量机构伸入或贴近工件，测量定位基准。左上角 **结构** 决定用哪种方式测量，页面随之切换：

      **内滚道**：接近开关伸入工件内孔，沿 Z 向找到一个螺纹槽的两侧，以槽中心定位

      **反向孔**：测头测量螺母上的反向器孔（或其它定位基准），以孔中心定位

      机床配置开启 **可选测量右端小台阶/定位孔** 后，反向孔页面上方多出 **测量模式**，还可选择测量右端台阶、测量右端孔、外圆面右端反

      测头在工件后方还是前方由机床配置中的 **测量方向** 决定，界面数值均按实际坐标输入即可

      测量结束后测量机构退回，Z 轴回到测量起始位.Z，再退到磨削界面的安全位置.Z，X 轴回到工件中心.X

      '
  - params:
    - id: S5D41
      name: 结构
      range: 内滚道/反向孔
      var: TECHNOLOGY[159]
      ac: 4
      text: '按机床配置的测量机构和工件的定位基准选择，切换后页面显示对应的参数

        **内滚道**：用接近开关测量螺纹槽

        **反向孔**：用测头测量反向孔、右端台阶、右端孔或外圆找平面

        '
    - id: S5D6
      name: 测量水平距.Z
      rec: 按测量计算
      range: 无
      unit: mm
      var: TOOL_SET[11]
      ac: 4
      text: '测量机构（测头或开关）与砂轮在 Z 方向的距离，直接影响磨削是否偏刀，需准确标定：

        1. 用测头接触工件右端面，记录 Z 坐标 Z1

        2. 将砂轮齿顶对准工件右端面，记录 Z 坐标 Z2

        3. 测量水平距 = |Z1 - 测头半径 - Z2|

        用于内滚道、测量反向孔（常规）；测量右端台阶、测量右端孔、只测C、外圆面右端反不使用此值

        '
    - id: S5D5
      name: 测量起始位.Z
      rec: 测头在工件外约 50mm
      range: 无
      unit: mm
      var: INI[49]
      ac: 4
      text: '每次自动对刀开始时 Z 轴先移动到此位置，再伸出测量机构；测量结束后也回到此位置

        应保证测量机构伸出时与工件、卡盘之间留有足够距离

        '
    - id: S5D8
      name: 测量角.C / 反向孔测量角.C
      rec: 测量机构能正对测量位置
      range: ≥ 0
      unit: °
      var: INI[50]
      ac: 4
      text: '**内滚道**（显示为测量角.C）：开关伸出前头架转到的角度，保证开关伸入内孔时不与工件干涉

        **测量反向孔**：头架转到此角度时，测头应正对反向孔，能伸入孔的中部

        **测量右端孔**：头架转到此角度时，测头应正对右端定位孔

        '
- h3: 结构：内滚道（接近开关）
  marks:
  - ifIsInternal
  body:
  - img:
      src: auto_int_groove.png
      h: 300
  - note: '测量过程：Z 轴到测量起始位，C 轴转到测量角，开关伸出；X 轴移到测量起始位.X，Z 轴移到测量位.Z；X 轴移向测量位.X（此时开关应处在螺纹槽内、没有信号），然后 Z 轴先向左、再向右移动（各最多 2 个螺距），分别碰到螺纹槽两侧牙侧，取中点作为槽中心，换算出加工起始角

      如果开关移向测量位.X 时碰在牙顶上：默认沿 Z 向移动 1/4 螺距离开后再找槽；机床配置开启 **测量内滚道-后退平移调整位置** 后，改为先退回测量起始位.X、沿 Z 向平移 1/8 螺距再试，最多 5 次，仍失败则停机提示"测量失败, 请检查测量位置设置是否合适"

      两侧找不到牙侧时报警"检测不到信号,检查测量位.X是否合适!"

      ?ifIsCenter: 磨削中心在内滚道方式下，右侧 **右端测量** 点亮时，测完螺纹槽后再测量右端面；**外圆跳动**、**左端测量** 必须在右端测量打开后才能选择，参数见下方"磨削中心工件测量"

      '
  - params:
    - id: S5D25
      name: 测量起始位.X
      range: 无
      unit: mm
      var: TECHNOLOGY[177]
      ac: 4
      text: '开关能安全进入工件内孔、又不碰到孔壁的 X 坐标；测量结束后开关先退回到此 X 位置再退出工件

        '
    - id: S5D7
      name: 测量位.Z
      rec: 开关在第一个螺纹槽内
      range: 无
      unit: mm
      var: INI[53]
      ac: 4
      text: '手动将开关伸入工件，大致对准第一个螺纹槽中间，记录此时 Z 坐标。开关在此 Z 位置移到测量位.X，然后沿 Z 向两侧找槽的牙侧，因此应保证此位置在槽内

        '
    - id: S5D9
      name: 测量位.X
      rec: 检测到信号后再靠近 0.2mm 左右
      range: 无
      unit: mm
      var: INI[52]
      ac: 4
      text: '开关靠近内孔表面的目标 X 坐标：手动移动 X 轴直到开关刚检测到孔壁，再往孔壁方向多走约 0.2mm，记录此坐标

        开关在螺纹槽内移到此位置时不应有信号，沿 Z 向移动碰到牙侧时才有信号；设置过浅会检测不到牙侧，过深可能碰撞工件

        '
- h3: 结构：反向孔（测头）
  marks:
  - ifIsInternal
  body:
  - img:
      src: auto_int.png
      h: 300
  - note: '测量过程（测量反向孔）：Z 轴到测量起始位，头架转到 右端/外圆测量角，X 轴移到工件外圆外 5mm 处，测头伸出；测头径向移入外圆以内约 1.5 个测头直径，沿 Z 向（最多 100mm）碰到工件右端面（与右端测量设置比较，超出阈值报警"工件右端过长"）；然后退回外圆外 5mm，转到反向孔测量角，从测得的右端面向工件内移动 反向孔距右端.Z，伸入孔内，正反转 C 轴（各最多 300°）找孔的上下两侧，再沿 Z 向（各最多 2 个螺距）找左右两侧，得到孔中心，换算出加工起始角

      测量右端台阶、测量右端孔模式同样先测右端面；外圆面右端反模式不测右端面

      测头伸不进孔（碰到孔外沿）时报警"测头无法进入孔内,请检查参数设置!"；找不到右端面或在 C 向、Z 向找不到孔壁时报警"工件外径设置有误!"，请检查外圆直径、测头中心位、反向孔距右端等参数

      '
  - params:
    - id: S5D42
      name: 测量模式
      range: 测量反向孔/测量右端台阶/测量右端孔/外圆面右端反
      var: TECHNOLOGY[128]
      ac: 4
      text: '需在机床配置中开启 **可选测量右端小台阶/定位孔** 后显示，未开启时固定为测量反向孔

        各模式的测量方式和参数见下方说明

        '
    - id: S5D24
      name: 测头中心位.X
      range: 无
      unit: mm
      var: PROCESS[54]
      ac: 4
      text: '测头位于工件回转中心时的 X 坐标。可用测头接触工件外圆的坐标加（或减）工件半径计算得到

        程序以此为基准，按外圆直径计算测头靠近工件外表面的位置

        '
    - id: S5D11
      name: 测头半径
      rec: 按测头图纸
      range: 0~10
      unit: mm
      var: TOOL_SET[10]
      ac: 4
      text: '测头测球的半径，按测头规格输入。程序用它计算测头伸入工件的深度和接触点修正

        '
    - id: S5D10
      name: 外圆直径
      rec: 实测
      range: 0~500
      unit: mm
      var: INI[35]
      ac: 4
      text: '工件外圆直径，决定测头靠近工件外表面的位置，以及腰形孔尺寸换算成 C 轴角度，需准确输入

        '
    - id: S5D12
      name: 反向孔距右端.Z
      rec: 测头能进入孔中部
      range: 0~500
      unit: mm
      var: INI[36]
      ac: 4
      text: '**测量反向孔**：工件右端面到反向孔中心的 Z 向距离，测头从测得的右端面位置向工件内移动此距离到达孔位置

        **测量右端孔**：测头沿 Z 向伸入右端定位孔的深度

        '
    - id: S5D13
      name: 孔缺口深
      rec: 按工件
      range: -20~100
      unit: mm
      var: PROCESS[55]
      ac: 4
      text: '**测量反向孔**：反向孔外侧有缺口（沉孔）时，测头需要多伸入的深度；无缺口输入 0

        **测量右端孔**：右端定位孔中心到工件外圆表面的径向距离

        '
    - id: S5D14
      name: 反向孔类型
      range: 圆形孔/腰形孔
      var: TOOL_SET[23]
      ac: 4
      text: '按工件反向孔形状选择

        **圆形孔**：C 向找上下两侧、Z 向找左右两侧

        **腰形孔**：沿腰形孔的宽、长方向斜向找边，需继续设置腰形孔角度、长、宽（见下图）

        '
    - id: S5D21
      name: 测量模式（常规/只测C）
      rec: 常规
      range: 常规/只测C
      var: INI[163]
      ac: 4
      text: '**常规**：测量孔的上下（C 向）和左右（Z 向），定位孔中心并计算加工起始角

        **只测C**：只测上下方向得到孔的角度位置；右端面的测量误差自动写入磨削界面的 **偏刀补偿**，对刀结果调整按角度（°）叠加

        '
    - id: S5D18
      name: 孔周探测 / 探测范围 / 探测步距
      rec: 范围 30°，步距 5°
      range: 孔周探测 关/开；探测范围、探测步距 0~360
      unit: °
      var: TECHNOLOGY[156] / TECHNOLOGY[157] / TECHNOLOGY[158]
      ac: 4
      text: '工件孔小或装夹角度不准时打开：测头按设定角度伸不进反向孔时，头架先向一个方向、再向另一个方向按步距逐次转动（各转到探测范围的一半），每次重新尝试伸入孔内

        '
    - id: S5D23
      name: 右端/外圆测量角.C（外圆找平.C）
      rec: 测头测量时不干涉
      range: 0~360
      unit: °
      var: INI[132]
      ac: 4
      text: '自动对刀开始时头架转到的角度，测头在此角度伸出并测量右端面或外圆，应保证测头不碰卡爪、缺口等

        外圆面右端反模式下此项显示为 **外圆找平.C**，即测量外圆找平面时的起始角度

        '
    - id: S5D37
      name: 右端测量设置.Z / 右端实际测量
      rec: 手动测量后设置
      range: 无
      unit: mm
      var: INI[137]、INI[51]
      ac: 4
      text: '手动用测头接触工件右端面，把 Z 坐标输入 **右端测量设置**；右侧显示每次自动测量得到的实际值

        '
    - id: S5D38
      name: 右端测量阈值.Z / 右端测量误差
      rec: '0.05'
      range: 0~0.5
      unit: mm
      var: INI[138]、INI[140]
      ac: 4
      text: '右侧显示本次测得的右端面与设置值之差（实测 - 设置）。差值大于阈值时报警"工件右端过长，检查是否放置有误或重新设置右端磨削位置"，程序停止；反方向的偏差不报警

        超差通常是工件过长或装夹未到位，检查工件或修改右端测量设置后继续

        '
  - h4: 反向孔类型：腰形孔
    body:
    - img:
        src: auto_int_slot.png
        h: 300
    - params:
      - id: S5D15
        name: 腰形孔角度 / 腰形孔长 / 腰形孔宽
        rec: 按图纸（展开图尺寸）
        range: 角度 0~180，长宽 0~100
        unit: ° / mm
        var: INI[32] / INI[33] / INI[34]
        ac: 4
        text: '腰形孔在工件外圆展开图上的倾斜角度及长、宽。参考界面示意图设置，一般右旋工件角度大于 90°，左旋工件小于 90°

          测头沿孔宽方向找两边得到孔的中线，再沿孔长方向找两端得到孔中心

          '
  - h4: 测量模式：测量右端台阶
    body:
    - img:
        src: auto_int_step.png
        h: 300
    - note: '用工件右端面上的小台阶确定角度：测头先测出右端面，再沿 Z 向后退半个测头半径，头架正转一整圈内找到台阶侧面，以此角度加上对刀结果调整作为加工起始角；右端面的误差自动写入磨削界面的偏刀补偿

        转一整圈仍未碰到台阶时报警"工件外径设置有误!"

        本模式只需设置测头中心位、测量起始位、测头半径、外圆直径和右端测量相关参数

        '
  - h4: 测量模式：测量右端孔
    body:
    - img:
        src: auto_int_hole.png
        h: 300
    - note: '用工件右端面上的定位孔确定角度：测头先测出右端面，再移到定位孔所在半径（外圆半径减去 **孔缺口深** 中填写的孔中心到外圆距离），头架转到 **反向孔测量角.C**，测头沿 Z 向伸入孔内 **反向孔距右端.Z** 的深度，然后正反转 C 轴（各最多 40°）找孔两侧，取中点加上对刀结果调整作为加工起始角；右端面的误差自动写入磨削界面的偏刀补偿

        伸不进孔时报警"测头无法进入孔内,请检查参数设置!"；±40° 内找不到孔壁时报警"工件外径设置有误!"

        本模式借用反向孔的三个参数，含义见上方对应参数说明

        '
  - h4: 测量模式：外圆面右端反
    body:
    - img:
        src: auto_int_flat.png
        h: 300
    - note: '用工件外圆上的找平面（如铣扁、键槽）确定角度，再用右端反向器端面确定 Z 向位置：

        1. 头架转到外圆找平.C，测头移到外圆找平.Z / 外圆找平.X，正反转 C 轴测出找平面两侧，取中点作为角度基准

        2. 测头退出后回到工件中心，头架再转动 **端反旋转角.C**，测头移到 **端反测量.Z / 端反测量.X**，沿 Z 向接触右端反向器端面

        3. 测得的端面位置（扣除对刀结果调整）加上 **滚道端反距**，换算成砂轮到滚道起点的角度，得到加工起始角

        打开 **跳过外圆测量** 时不执行第 1 步：头架从外圆找平.C 直接再转端反旋转角.C，角度基准取 0°

        找平面或端面碰不到时停机提示"测量错误,测头未检测到信号"

        '
    - params:
      - id: S5D46
        name: 跳过外圆测量
        rec: 关（工件有找平面时）
        range: 关/开
        var: TECHNOLOGY[433]
        ac: 4
        text: '**关**（默认）：按上面的步骤先测外圆找平面确定角度，再测右端反向器端面

          **开**：不测外圆找平面，界面上的外圆找平.C / 外圆找平.Z / 外圆找平.X 隐藏；头架停在原来设置的外圆找平.C，再转 **端反旋转角.C**，测头直接到端反位置测端面。加工起始角以 0° 为角度基准，只由测得的端面位置换算

          适用于工件没有找平面、或靠夹具定位每件装夹角度都一致的情况；打开前先确认外圆找平.C 加端反旋转角.C 能让测头伸到端反位置。磨出的位置有偏差时用 **对刀结果调整** 修正

          '
      - id: S5D43
        name: 外圆找平.C / 外圆找平.Z / 外圆找平.X
        range: 无
        var: INI[132] / TOOL_SET[72] / TOOL_SET[73]
        ac: 4
        text: '测头在工件外圆找平面上测量的位置：头架先转到外圆找平.C，测头移到外圆找平.Z、外圆找平.X（贴近找平面），正反转动 C 轴测出平面两侧

          手动把测头移到找平面中间、刚好能检测到信号的位置，记录 Z、X 坐标

          打开 **跳过外圆测量** 后这三项隐藏，外圆找平.Z / .X 不再使用，外圆找平.C 仍作为头架起始角度

          '
      - id: S5D44
        name: 滚道端反距
        range: 0~500
        unit: mm
        var: TOOL_SET[74]
        ac: 4
        text: '右端反向器端面到滚道磨削起点的 Z 向距离，用于把测得的端面位置换算成加工起始角

          '
      - id: S5D45
        name: 端反测量.Z / 端反测量.X / 端反旋转角.C
        range: 无
        var: TOOL_SET[75] / TOOL_SET[76] / TOOL_SET[77]
        ac: 4
        text: '测量右端反向器端面时测头的 Z、X 位置，以及找平之后头架需要再转动的角度（使测头能伸到端反位置）

          测头先移到端反测量.Z 外侧，再移到端反测量.X，然后沿 Z 向接触端面

          '
- h3: 磨削中心工件测量
  marks:
  - ifIsCenter
  body:
  - img:
      src: auto_center.png
      h: 300
  - note: '磨削中心在自动对刀时还可以检查工件装夹：右侧软键选择本次自动对刀要包含的测量，点亮表示包含（图中各项都已点亮）

      **右端测量**（内滚道方式下可选，测头方式除外圆面右端反外总是测量）：测出右端面位置，与右端测量设置比较

      **外圆跳动**：在外圆上相隔 120° 测 3 点，最大与最小值之差即为跳动，超过阈值报警"工件圆度过大"

      **左端测量**：测头移到外圆外侧、比左端面耳高低约 1.5 个测头直径的位置，头架转到左端测量角避开卡爪，沿 Z 向（最多 工件外圆长度 + 5mm）测出左端面位置；碰不到时报警"工件长度设置有误!"，超出阈值报警"工件左端过长"，测量成功后测得的工件外圆长度自动写回设置值

      测量顺序：内滚道方式先测螺纹槽，再依次测右端面、外圆跳动、左端面；测头方式依次测右端面、外圆跳动、反向孔，最后测左端面

      外圆跳动和左端测量只在内滚道方式和 **测量反向孔** 模式下执行，测量右端台阶、测量右端孔、外圆面右端反模式下不执行

      外圆跳动和左端测量必须先进行右端测量：内滚道方式下打开它们时右端测量会自动点亮，关闭右端测量时另外两项一起关闭。测量完成后，对应工序的当前磨削接触位置复位到初始值

      '
  - params:
    - id: S5D20
      name: 外圆跳动阈值 / 外圆当前跳动
      rec: '0.08'
      range: 0~0.5
      unit: mm
      var: INI[128]、INI[134]
      ac: 4
      text: '外圆跳动打开时显示。3 点测得的跳动大于阈值则报警并停止；右侧显示本次测得的跳动值

        '
    - id: S5D22
      name: 左端测量角.C
      rec: 测头测量时不干涉
      range: 0~360
      unit: °
      var: TOOL_SET[59]
      ac: 4
      text: '左端测量打开时显示。测量左端面时头架转到的角度，使测头能接触左端面并避开卡爪

        '
    - id: S5D27
      name: 左端面耳高
      rec: 按图纸
      range: 0~100
      unit: mm
      var: INI[44]
      ac: 4
      text: '工件左端面凸耳的径向高度，按图纸或实测输入。左端测量时测头移到外圆外侧、比耳高低约 1.5 个测头直径的位置，再沿 Z 向接触左端面；耳高设置过大测头会越过凸耳碰不到端面

        端面磨削时也用它计算左端面磨削终点

        '
    - id: S5D39
      name: 左端测量设置.Z / 左端实际测量
      rec: 手动测量后设置
      range: 无
      unit: mm
      var: TOOL_SET[46]、TOOL_SET[47]
      ac: 4
      text: '手动用测头接触工件左端面，把 Z 坐标输入左端测量设置；右侧显示自动测量值

        '
    - id: S5D40
      name: 左端测量阈值.Z / 左端测量误差
      rec: '0.05'
      range: 0~0.5
      unit: mm
      var: TOOL_SET[48]、TOOL_SET[49]
      ac: 4
      text: '右侧显示本次测得的左端面与设置值之差（实测 - 设置），大于阈值时报警"工件左端过长，检查是否放置有误或重新设置左端磨削位置"；反方向的偏差不报警

        '
    - id: S5D28
      name: 工件外圆长度
      rec: 按图纸
      range: 0~500
      unit: mm
      var: INI[31]、INI[141]
      ac: 4
      text: '左侧为设置值，右侧为本次由右端、左端测量结果算出的长度；左端测量完成后测量值自动写回设置值

        左端测量时测头从右端面起沿 Z 向最多移动 此长度 + 5mm 寻找左端面，设置过短会报警"工件长度设置有误!"

        '
