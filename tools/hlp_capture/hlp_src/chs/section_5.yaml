title: 自动对刀界面
head1: HMI界面参数定义
refs: '具体操作步骤请参考[对刀](section_11.html)

  机床配置有自动对刀机构时，屏幕下方出现 **自动对刀** 软键，点击进入本页

  自动对刀：点亮操作面板上的自动对刀键后启动程序，测头（或接近开关）自动找到工件螺纹/基准位置，计算出加工起始角，无需手动对刀

  '
blocks:
- h3: 通用参数
  body:
  - params:
    - id: S5D1
      name: 对刀结果调整
      rec: 按偏刀情况
      range: 无
      unit: °
      var: TOOL_SET[42]
      ac: 7
      text: '自动对刀完成并磨削后，如果发现螺纹两侧磨削不均（偏刀），用此值修正自动对刀算出的起始角

        该值会持续叠加在每次自动对刀结果上，调整后无需重新标定测头

        '
- h3: 外螺纹自动对刀
  marks:
  - ifIsExternal
  body:
  - img:
      src: auto_ext.png
      h: 300
  - note: '外螺纹机床用接近开关（和/或测头）检测工件螺纹位置。界面右侧显示测量机构伸出、检测信号的实时状态

      '
  - params:
    - id: S5D2
      name: 开关-砂轮重合位
      rec: 手动标定
      range: 无
      unit: mm
      var: INI[43]
      ac: 4
      text: '接近开关中心与砂轮齿顶在 Z 方向对齐时的 Z 坐标

        标定方法：手动移动工作台，使接近开关中心对准砂轮齿顶，记录此时 Z 坐标

        '
    - id: S5D3
      name: 测头-砂轮重合位
      rec: 手动标定
      range: 无
      unit: mm
      var: INI[43]
      ac: 4
      text: '测头中心与砂轮齿顶在 Z 方向对齐时的 Z 坐标

        标定方法：手动移动工作台，使测头中心对准砂轮齿顶，记录此时 Z 坐标

        '
    - id: S5D4
      marks:
      - ifIsKaiGuanAndCeTouCeLiang
      name: 开关-测头距
      range: 无
      unit: mm
      var: TOOL_SET[51]
      ac: 4
      text: '接近开关中心到测头中心的水平距离

        测头在左、开关在右时输入正值，反之输入负值

        '
- h3: 内螺纹自动对刀
  marks:
  - ifIsInternal
  body:
  - img:
      src: auto_int.png
      h: 300
  - note: '内螺纹机床用测头（或开关）伸入工件测量。左上角 **结构** 选择工件定位基准：

      **反向孔**：以螺母上的反向器孔定位（测头进入孔中，测孔中心）

      **内滚道**：直接测量内滚道/螺纹槽定位

      机床配置开启"可选测量右端小台阶/定位孔"后，**测量模式** 还可选择：测量反向孔、测量右端台阶、测量右端孔、外圆面右端反

      页面底部显示 X、Z、C 轴实时坐标，便于手动标定各位置

      '
  - params:
    - id: S5D41
      name: 结构
      range: 内滚道/反向孔
      var: TECHNOLOGY[159]
      ac: 4
      text: '按工件选择对刀定位的基准，切换后下方显示对应的参数

        '
    - id: S5D42
      name: 测量模式
      range: 测量反向孔/测量右端台阶/测量右端孔/外圆面右端反
      var: TECHNOLOGY[128]
      ac: 4
      text: '**测量反向孔**：测头进入反向器孔，测上下、左右定位孔中心

        **测量右端台阶 / 测量右端孔**：用工件右端的小台阶或定位孔确定 C 向起始角

        **外圆面右端反**：先在外圆找平面找正 C 向，再测右端反向器端面确定 Z 向位置

        '
    - id: S5D6
      name: 测量水平距.Z
      rec: 按测量计算
      range: 无
      unit: mm
      var: TOOL_SET[11]
      ac: 4
      text: '测头（开关）与砂轮在 Z 方向的距离，直接影响磨削是否偏刀，需准确标定：

        1. 用测头接触工件右端面，记录 Z 坐标 Z1

        2. 将砂轮齿顶对准工件右端面，记录 Z 坐标 Z2

        3. 测量水平距 = |Z1 - 测头半径 - Z2|

        '
    - id: S5D24
      name: 测头中心位.X
      range: 无
      unit: mm
      var: PROCESS[54]
      ac: 4
      text: '测头位于工件中心时的 X 坐标。可用测头接触工件外圆的坐标加上工件半径计算得到

        '
    - id: S5D5
      name: 测量起始位.Z
      rec: 测头在工件外约 50mm
      range: 无
      unit: mm
      var: INI[49]
      ac: 4
      text: '测头伸出后开始测量前 Z 轴所在的安全位置，工件与测头之间留出距离

        '
    - id: S5D11
      name: 测头半径
      rec: 按测头图纸
      range: 0~10
      unit: mm
      var: TOOL_SET[10]
      ac: 4
      text: '测头测球的半径，按测头规格输入

        '
    - id: S5D10
      name: 外圆直径
      rec: 实测
      range: 0~500
      unit: mm
      var: INI[35]
      ac: 4
      text: '工件外圆直径，影响测量端面和外圆时测头的位置，需准确输入

        '
    - id: S5D8
      name: 反向孔测量角.C（测量角.C）
      rec: 测头能进入孔中部
      range: ≥ 0
      unit: °
      var: INI[50]
      ac: 4
      text: '测量反向孔时头架转到的角度，此时测头应正对反向孔，能伸入孔的中部

        '
    - id: S5D12
      name: 反向孔距右端.Z
      rec: 测头能进入孔中部
      range: 0~500
      unit: mm
      var: INI[36]
      ac: 4
      text: '工件右端面到反向孔中心的距离，测头按此值移动到孔位置

        '
    - id: S5D13
      name: 孔缺口深
      rec: 按工件
      range: -20~100
      unit: mm
      var: PROCESS[55]
      ac: 4
      text: '反向孔侧面有开口时设置，测量时测头避开此缺口；无缺口输入 0

        '
    - id: S5D14
      name: 反向孔类型
      range: 圆形孔/腰形孔
      var: TOOL_SET[23]
      ac: 4
      text: '按工件反向孔形状选择；腰形孔需继续设置腰形孔角度、长、宽

        '
    - id: S5D21
      name: 测量模式（常规/只测C）
      rec: 常规
      range: 常规/只测C
      var: INI[163]
      ac: 4
      text: '**常规**：测量孔的上下（C 向）和左右（Z 向），定位孔中心并计算螺纹起始角

        **只测C**：只测上下方向定位孔的旋转中心，端面误差自动补偿到磨削界面的偏刀补偿

        '
    - id: S5D15
      name: 腰形孔角度 / 腰形孔长 / 腰形孔宽
      rec: 按图纸（展开图尺寸）
      range: 角度 0~180，长宽 0~100
      unit: ° / mm
      var: INI[32] / INI[33] / INI[34]
      ac: 4
      text: '腰形孔在展开图上的倾斜角度及长、宽。参考界面示意图设置，一般右旋工件角度大于 90°，左旋工件小于 90°

        '
    - id: S5D18
      name: 孔周探测 / 探测范围 / 探测步距
      rec: 范围 30°，步距 5°
      range: 0~360
      unit: °
      var: TECHNOLOGY[156] / TECHNOLOGY[157] / TECHNOLOGY[158]
      ac: 4
      text: '工件孔小或无定位装置时打开：测头按设定位置无法进入反向孔时，头架在探测范围内按步距逐次转动，继续尝试进入孔内

        '
    - id: S5D23
      name: 右端/外圆测量角.C
      rec: 测头测量时不干涉
      range: 0~360
      unit: °
      var: INI[132]
      ac: 4
      text: '测量右端面或外圆时头架转到的角度，保证测头能正常接触被测面

        '
    - id: S5D37
      name: 右端测量设置.Z / 右端实际测量
      rec: 手动测量后设置
      range: 无
      unit: mm
      var: INI[137]、INI[51]
      ac: 4
      text: '手动用测头接触工件右端面，把 Z 坐标输入 **右端测量设置**；右侧显示自动测量得到的实际值

        '
    - id: S5D38
      name: 右端测量阈值.Z / 右端测量误差
      rec: '0.05'
      range: 0~0.5
      unit: mm
      var: INI[138]、INI[140]
      ac: 4
      text: '自动测得的右端面与设置值之差（右侧显示的误差）超过阈值时报警

        超差通常是工件过长或装夹未到位，检查工件或修改右端测量设置后继续

        '
  - h4: 开关测量方式
    marks:
    - ifIsKaiGuanCeLiang
    body:
    - params:
      - id: S5D25
        name: 测量起始位.X
        range: 无
        unit: mm
        var: TECHNOLOGY[177]
        ac: 4
        text: '测量内滚道时开关能安全进入工件内孔的 X 坐标

          '
      - id: S5D7
        name: 测量位.Z
        rec: 开关在第一个螺纹槽内
        range: 无
        unit: mm
        var: INI[53]
        ac: 4
        text: '手动将开关伸入工件，大致对准第一个螺纹槽，记录此时 Z 坐标

          '
      - id: S5D9
        name: 测量位.X
        rec: 检测到信号后再靠近 0.2mm 左右
        range: 无
        unit: mm
        var: INI[52]
        ac: 4
        text: '开关接近工件开始测量的 X 坐标，为避免开关碰撞工件需准确输入

          '
  - h4: 外圆面右端反模式
    body:
    - params:
      - id: S5D43
        name: 外圆找平.C / 外圆找平.Z / 外圆找平.X
        range: 无
        var: INI[132] / TOOL_SET[72] / TOOL_SET[73]
        ac: 4
        text: '测头在工件外圆找平面（如键槽、铣扁）上测量的位置：先转到 C 角度，移到 Z、X 坐标，正反转动 C 轴测出平面中心，确定 C 向基准

          '
      - id: S5D44
        name: 滚道端反距
        range: 0~500
        unit: mm
        var: TOOL_SET[74]
        ac: 4
        text: '右端反向器端面到滚道磨削起点的 Z 向距离，用于把测得的端面位置换算成砂轮起始角

          '
      - id: S5D45
        name: 端反测量.Z / 端反测量.X / 端反旋转角.C
        range: 无
        var: TOOL_SET[75] / TOOL_SET[76] / TOOL_SET[77]
        ac: 4
        text: '测量右端反向器端面时测头的 Z、X 位置，以及找平后头架需要再转动的角度（使测头能进入端反位置）

          '
- h3: 磨削中心工件测量
  marks:
  - ifIsCenter
  body:
  - note: '磨削中心在自动对刀时还可测量外圆跳动和左右端面，检查工件装夹是否到位。右侧 **右端测量 / 外圆跳动 / 左端测量** 软键可单独执行对应测量

      '
  - params:
    - id: S5D20
      name: 外圆跳动阈值 / 外圆当前跳动
      rec: '0.08'
      range: 0~0.5
      unit: mm
      var: INI[128]、INI[134]
      ac: 4
      text: '测量外圆时跳动大于阈值则报警；右侧显示本次测得的跳动值

        '
    - id: S5D22
      name: 左端测量角.C
      rec: 测头测量时不干涉
      range: 0~360
      unit: °
      var: TOOL_SET[59]
      ac: 4
      text: '测量左端面时头架转到的角度，使测头能正常接触左端面并避开卡爪

        '
    - id: S5D27
      name: 左端面耳高
      rec: 按图纸
      range: 0~100
      unit: mm
      var: INI[44]
      ac: 4
      text: '工件左端面凸耳的高度，按图纸或实测输入

        '
    - id: S5D39
      name: 左端测量设置.Z / 左端实际测量
      rec: 手动测量后设置
      range: 无
      unit: mm
      var: TOOL_SET[46]、TOOL_SET[47]
      ac: 4
      text: '手动用测头接触工件左端面，把 Z 坐标输入左端测量设置；右侧显示自动测量值

        '
    - id: S5D40
      name: 左端测量阈值.Z / 左端测量误差
      rec: '0.05'
      range: 0~0.5
      unit: mm
      var: TOOL_SET[48]、TOOL_SET[49]
      ac: 4
      text: '自动测得的左端面与设置值之差超过阈值时报警

        '
    - id: S5D28
      name: 工件外圆长度
      rec: 按图纸
      range: 0~500
      unit: mm
      var: INI[31]、INI[141]
      ac: 4
      text: '更换新工件后首次测量左端面时使用，手动测量后输入；右侧显示自动测得的工件长度，可用于比较

        '
