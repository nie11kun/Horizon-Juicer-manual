title: 参数备份恢复界面
head1: HMI界面参数定义
blocks:
- h3: 参数备份恢复界面
  body:
  - p: 需在机床配置中开启 **参数备份恢复** 后，欢迎页右侧才显示 **备份恢复** 软键
  - img:
      src: backup_restore.png
      h: 300
  - params:
    - id: S31D1
      name: 模式选择
      rec: 无
      range: 加工/备份/恢复
      text: '设置为需要进行的选项

        备份恢复完成后需要切换回**加工**

        '
    - id: S31D2
      name: 备份路径
      rec: 无
      range: 内部SPF/前USB/CF卡
      text: '设置需要将备份文件存储在那个地方

        如需备份到前置USB，需要将配置文件 **extdev.ini** 放入 oem 或 user 系统目录下: **/oem/sinumerik/nck**，并重启系统。测试无法备份到后置 USB

        '
    - id: S31D3
      name: 备份目录
      rec: 无
      range: 备份文件夹名称
      text: '如果文件夹不存在会自动创建

        '
    - id: S31D4
      name: 文件名称
      rec: 无
      range: 备份文件名称
      text: '备份文件会存储在备份文件夹内，如果文件不存在会自动创建

        '
    - id: S31D5
      name: 备份模式
      rec: 无
      range: 所有变量/自定义变量
      text: '设置备份所有全局变量或者指定备份某些变量

        指定自定义备份变量需要额外定义：列表目录、列表名称、列表行数

        具体列表规则参考[参数备份恢复](section_30.html)

        '
    - id: S31D6
      name: 列表目录
      rec: 无
      range: 自定义变量备份表所在文件夹
      text: '此文件夹需要定义在系统子程序路径下

        具体列表规则参考[参数备份恢复](section_30.html)

        '
    - id: S31D7
      name: 列表名称
      rec: 无
      range: 自定义变量备份表名称
      text: '默认为txt文档，无需写后缀

        具体列表规则参考[参数备份恢复](section_30.html)

        '
    - id: S31D8
      name: 列表行数
      rec: 无
      range: 0-800
      text: '设置自定义变量列表文件总行数

        系统会根据此处设置的行数，逐行读取自定义列表内的变量

        具体列表规则参考[参数备份恢复](section_30.html)

        '
    - id: S31D9
      name: 恢复路径
      rec: 无
      range: 内部SPF/后USB/前USB/CF卡
      text: '设置需要恢复的变量备份文件存储在那个地方

        如需恢复存储在后置USB的文件，需要在逻辑驱动器中配置好，名称设置为：**//DEV_3**

        '
    - id: S31D10
      name: 恢复目录
      rec: 无
      range: 恢复文件夹名称
      text: '读取需要恢复的备份文件所在的文件夹

        '
    - id: S31D11
      name: 文件名称
      rec: 无
      range: 恢复文件名称
      text: '恢复文件存储在恢复文件夹内

        '
refs: '具体操作步骤请参考[参数备份恢复](section_30.html)

  在欢迎页右侧点击 **备份恢复** 软键进入（需用户口令级别，机床配置中开启后显示）

  '
