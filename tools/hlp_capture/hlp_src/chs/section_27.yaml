title: 端面参数
head1: HMI界面参数定义
blocks:
- h3: 磨削参数
  body:
  - img:
      src: center_face_grind.png
      h: 300
  - params:
    - id: S27D3
      name: 加工模式
      rec: 根据需要
      range: 单件调整/批量生产
      text: '此参数影响磨削时起刀位置

        **单件调整**：启动程序后从**当前**磨削位置开始加工，适合调试或单件修磨

        **批量生产**：启动程序后从**初始**磨削位置开始加工，适合连续加工同一批工件

        '
    - id: S27D1
      var: INI[44]
      name: 左端面耳高
      rec: 无
      range: 大于零
      text: '此参数影响磨削左端面及自动对刀时候的动作

        测量加工工件的实际耳高尺寸，精确到0.1mm

        '
    - id: S27D4
      name: 左端面磨削起点
      rec: 自动计算
      range: 无
      text: '此参数时根据外圆参数界面的当前磨削接触自动计算而来

        磨削起点=外圆当前接触+0.1mm

        磨削起点=外圆当前接触-0.1mm

        磨削起点=外圆当前接触+0.1mm

        '
    - id: S27D5
      name: 左端面磨削终点
      rec: 自动计算
      range: 无
      text: '此参数时根据外圆参数界面的当前磨削接触和耳高自动计算而来

        磨削终点=外圆当前接触+耳高+1mm

        磨削终点=外圆当前接触-耳高-1mm

        磨削终点=外圆当前接触-耳高+1mm

        '
    - id: S27D6
      name: 左端面初始磨削接触
      rec: 手动测量后输入
      range: 无
      text: ''
    - id: S27D7
      name: 左端面当前磨削接触
      rec: 自动累计
      range: 无
      text: ''
    - id: S27D2
      name: 右端面壁厚
      rec: 无
      range: 大于零
      text: '此参数影响磨削右端面时候的动作

        测量工件的实际壁厚尺寸，精确到0.1mm

        '
    - id: S27D8
      name: 右端面磨削起点
      rec: 自动计算
      range: 无
      text: '此参数时根据外圆参数界面的当前磨削接触和壁厚自动计算而来

        磨削起点=外圆当前接触-壁厚

        磨削起点=外圆当前接触+壁厚

        磨削起点=外圆当前接触-壁厚

        '
    - id: S27D9
      name: 右端面磨削终点
      rec: 自动计算
      range: 无
      text: '此参数时根据外圆参数界面的当前磨削接触和耳高自动计算而来

        磨削终点=外圆当前接触+1mm

        磨削终点=外圆当前接触-1mm

        磨削终点=外圆当前接触+1mm

        '
    - id: S27D10
      name: 右端面初始磨削接触
      rec: 手动测量后输入
      range: 无
      text: ''
    - id: S27D11
      name: 右端面当前磨削接触
      rec: 自动累计
      range: 无
      text: ''
- h3: 工艺参数
  body:
  - img:
      src: center_face_process.png
      h: 300
  - params:
    - id: S27D40
      name: 左端/右端 累计磨削 / 设定磨削
      range: 只读
      unit: mm
      readonly: true
      text: '左、右端面工艺的设定总磨削量（各工序次数 × 进给累加）与当前工件已磨削量

        '
      var: PROCESS[61]、PROCESS[117]、PROCESS[62]、PROCESS[118]
    - id: S27D12
      name: 已加工
      rec: '0'
      range: 大于零
      text: '此参数为自动累计值

        每在批量加工模式下完成一次磨削程序，此参数自动累加一次

        '
    - id: S27D13
      name: 修整设定
      rec: '0'
      range: 根据工艺要求
      text: '此参数设定为每磨削几件修整一次砂轮

        通过设定此参数可以实现加工多件工件后自动修整一次砂轮的功能

        注意：修整时调用修整界面精修参数(次数/修整量/速度)

        '
    - id: S27D14
      name: 循环次数
      rec: 无
      range: 大于零
      text: '根据工件磨削余量控制

        '
    - id: S27D15
      name: 进给深度
      rec: 0.005~0.05
      range: 大于零
      text: '根据磨削工艺要求，合理分配粗磨精磨进刀量，一般粗磨大进刀量去余量，精磨小进刀量光刀

        '
    - id: S27D16
      name: 磨削速度
      rec: '100'
      range: 大于零
      text: '砂轮从磨削起点到终点移动时的速度

        '
    - id: S27D17
      name: 修整设定
      rec: 无
      range: 大于零
      text: '当前工艺磨削循环次数到达修整设定次数后进行一次修整

        注意：修整时调用修整界面精修参数(次数/修整量/速度)

        '
    - id: S27D18
      name: 砂轮线速度
      rec: 30m/s
      range: 15~50
      text: '砂轮磨削线速度根据砂轮材质及工件材质不同变化较大

        具体设置方案请进行测试后设置

        '
    - id: S27D19
      name: 头架转速
      rec: '120'
      range: 小于120转
      text: '头架转速和表面粗糙度有关

        '
- h3: 修整参数
  body:
  - img:
      src: center_face_dress.png
      h: 300
  - params:
    - id: S27D20
      name: 累计修整量
      rec: 无
      range: 无
      text: '记录当前砂轮半径方向已修整掉多少

        '
    - id: S27D21
      name: 锥度微调
      rec: '0'
      range: 0~0.02
      text: '加工的工件经过测量后，如果端面有轻微锥度的话，可以通过此参数将砂轮稍微修处斜面来调整

        注意此参数只能作为微调使用，不可过大调整，以免加工出的工件表面有条纹

        '
    - id: S27D22
      name: 砂轮状态
      rec: 无
      range: 新砂轮/旧砂轮
      text: '当更换新砂轮时，切换到新砂轮。还需设置正确新砂轮直径及初始修整位置

        '
    - id: S27D23
      name: 粗修次数
      rec: 无
      range: 大于零
      text: '点击修整键进行修整的时候，执行粗修的次数

        '
    - id: S27D24
      name: 粗修进给量
      rec: 无
      range: 大于零
      text: '粗修时每次修整进给量

        '
    - id: S27D25
      name: 粗修速度
      rec: 无
      range: 大于零
      text: '粗修时修整速度

        '
    - id: S27D26
      name: 精修次数
      rec: 无
      range: 大于零
      text: '点击修整键进行修整的时候，执行精修的次数

        磨削中修整的时候，调用此精修次数进行修整

        '
    - id: S27D27
      name: 精修进给量
      rec: 无
      range: 大于零
      text: '精修时每次修整进给量

        '
    - id: S27D28
      name: 精修速度
      rec: 无
      range: 大于零
      text: '精修时修整速度

        '
    - id: S27D29
      name: 修整起点
      rec: 金刚笔在砂轮前侧5mm处U轴坐标
      range: 取值范围
      text: '手动将金刚笔开到砂轮前侧合适位置，记录坐标定位修整起点

        '
    - id: S27D30
      name: 修整终点
      rec: 金刚笔在砂轮后侧外5mm处U轴坐标
      range: 取值范围
      text: '手动将金刚笔开到砂轮后侧合适位置，记录坐标定位修整起点

        '
    - id: S27D31
      name: 砂轮线速度
      rec: 无
      range: 大于零
      text: '修整时，砂轮的线速度。为保证修整质量，请设置合适数值

        '
    - id: S27D32
      name: 当前接触
      rec: 自动累积
      range: 无
      text: '此参数输入金刚笔和砂轮左右位置上Z轴的坐标

        当前砂轮和金刚笔接触时候的坐标，砂轮状态为旧砂轮时使用此修整位置开始修整。此参数每次修整后会自动计算累计

        '
    - id: S27D33
      name: 初始接触
      rec: 手动测量后输入
      range: 无
      text: '此参数输入金刚笔和砂轮左右位置上Z轴的坐标

        新砂轮时砂轮和金刚笔修整位置，此参数需保证第一次修整时金刚笔从起点到终点修整过程中金刚笔不要接触砂轮

        '
    - id: S27D34
      name: 磨削方式
      rec: 根据需要选择
      range: 来回/保持
      text: '此参数为磨削时的动作

        来回：进刀后，砂轮垂直从磨削起点移动到磨削终点，再反向回来

        保持：砂轮持续进刀，不进行垂直移动磨削

        '
    - id: S27D35
      name: 磨削砂轮转速
      rec: 根据需要选择
      range: 大于零
      text: '此参数为磨削砂轮转速

        此选项开放输入时表示砂轮为恒转速模式

        '
    - id: S27D36
      name: 修整砂轮转速
      rec: 根据需要选择
      range: 大于零
      text: '此参数为修整时砂轮转速

        此选项开放输入时表示砂轮为恒转速模式

        '
    - id: S27D37
      name: 加工中修整补偿
      rec: 无
      range: -0.5~0.5
      text: '此参数为磨削中修整时，对磨削位置的补偿量

        补偿量输入正值为坐标轴正向补偿

        设定值为每次修整的补偿量，推荐在加工中工件尺寸一直往一个方向发展的情况下，对磨削接触点进行调整

        '
    - id: S27D38
      name: 左端面终点补偿
      rec: 无
      range: 大于零，小于耳高长度
      text: '此参数为磨削左端面时，来回拉磨时水平终点位置补偿值

        默认为加工终点为耳高长度，如果需要砂轮不完全移动出工件左端面，可以设置此补偿值

        例如输入5mm，表示来回拉磨时终点再距离耳高5mm处结束

        需要注意，此参数不能设置过大，导致终点位置比起点位置还靠近外圆面

        '
    - id: S27D39
      name: 右端面终点补偿
      rec: 无
      range: 大于零，小于壁厚长度
      text: '此参数为磨削右端面时，来回拉磨时水平终点位置补偿值

        默认为加工终点为壁厚长度，如果需要砂轮不完全移动出工件右端面，可以设置此补偿值

        例如输入5mm，表示来回拉磨时终点再距离壁厚5mm处结束

        需要注意，此参数不能设置过大，导致终点位置比起点位置还靠近外圆面

        '
refs: '具体操作步骤请参考[外圆端面磨削](section_24.html)

  磨削中心机型在用户界面点击屏幕下方 **端面参数** 软键进入；右侧软键切换磨削/工艺/修整参数

  '
