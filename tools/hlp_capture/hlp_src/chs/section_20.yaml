title: 外圆端面修整
head1: 机床功能介绍
refs: |
  具体参数设置请参考[外圆参数](section_26.html)、[端面参数](section_27.html)
  内螺纹砂轮修整请参考[砂轮修整](section_10.html)
blocks:
  - h3: 外圆砂轮修整
    body:
      - steps:
          - t: 进入 **外圆参数**，点击右侧 **修整参数**
            img: {src: center_od_dress.png, h: 300}
          - 新砂轮：选择砂轮状态为 **新砂轮**
          - 设置粗修、精修的次数、修整量和速度（速度为金刚笔水平移动速度）
          - 打开液压修整器：手动伸出修整器，确认金刚笔已伸出到位
          - 手动移动机床使金刚笔对准外圆砂轮左侧边缘，记录 Z 坐标到 **修整起点**
          - 手动移动机床使金刚笔对准外圆砂轮右侧边缘，记录 Z 坐标到 **修整终点**
          - "?ifIsHasU: 使金刚笔在修整起点位置轻触砂轮最高点，将 U 坐标设为 **初始修整接触**"
          - "?ifIsNotHasU: 使金刚笔在修整起点位置轻触砂轮最高点，将 X 坐标设为 **初始修整接触**"
          - 按实际测量设置新砂轮直径等参数
          - 返回加工选择界面，右侧只点亮 **外圆**，其他关闭
          - 点亮 **修整** 键，按循环启动
      - note: |
          旧砂轮修整：设置粗修、精修次数后，点亮修整键启动即可
          磨削中修整只使用精修次数
          修整无法启动时检查修整起点/终点是否合适，以及金刚笔伸出检测是否正常
  - h3: 端面砂轮修整
    body:
      - steps:
          - t: 进入 **端面参数**，点击右侧 **修整参数**
            img: {src: center_face_dress.png, h: 300}
          - 新砂轮：选择砂轮状态为 **新砂轮**，设置粗修、精修参数
          - 打开液压修整器，手动伸出确认到位
          - "?ifIsHasU: 使金刚笔对准端面砂轮前、后侧边缘，分别记录 U 坐标到修整起点、修整终点"
          - "?ifIsNotHasU: 使金刚笔对准端面砂轮前、后侧边缘，分别记录 X 坐标到修整起点、修整终点"
          - 使金刚笔轻触砂轮端面，将 Z 坐标设为 **初始修整接触**
          - 返回加工选择界面，右侧只点亮 **左端面** 或 **右端面**，其他关闭
          - 点亮 **修整** 键，按循环启动
      - note: |
          更换新砂轮后都要重新校准修整位置
          修整外圆时每修一次，外圆磨削的起点、终点会自动跟随调整；因此导致修整起点、终点不合适时也会自动调整
