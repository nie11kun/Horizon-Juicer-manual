title: 加工选择
head1: HMI界面参数定义
blocks:
- h3: 加工选择界面
  body:
  - img:
      src: center_select.png
      h: 300
  - note: '磨削中心一次装夹可依次完成外圆、左/右端面、外圆台阶和内螺纹磨削。本页汇总各工序的加工模式、磨削量和接触位置

      右侧 **外圆 / 左端面 / 右端面 / 外圆台阶 / 内螺纹** 软键点亮表示本次加工包含该工序，再次点击取消

      ?ifIsHasLoadingArm: 配有机械手的机床，右侧 **用机械手** 点亮时使用机械手自动上下料，**模拟测试** 点亮时机械手按流程空运行测试

      左侧显示各工序的初始接触与当前接触位置，内容与各参数页一致

      '
  - params:
    - id: S28D5
      name: 累计磨削 / 设定磨削（各工序）
      range: 只读
      unit: mm
      readonly: true
      var: PROCESS[59]、PROCESS[115]、PROCESS[61]、PROCESS[117]、PROCESS[62]、PROCESS[118]
      text: '各工序工艺的设定总磨削量与当前工件已磨削量，内容与对应参数页一致

        '
    - id: S28D6
      name: 工序选中标识
      range: 只读
      readonly: true
      var: PROCESS[44]、PROCESS[46]、PROCESS[45]、PROCESS[95]、PROCESS[42]
      text: '外圆、右端面、左端面、外圆台阶、内螺纹各工序的选中状态：右侧对应软键点亮后，在中间显示该工序已选中，本次加工将包含此工序

        '
    - id: S28D7
      name: 在线测量
      range: 关/开
      ac: 4
      var: TECHNOLOGY[296]
      text: '机床配置开启外圆在线测量模块后显示：打开后外圆磨削由在线量仪测量外径，达到目标尺寸自动结束

        '
- h3: 加工选择
  body:
  - params:
    - id: S28D1
      name: 工艺参数（内螺纹）
      rec: 点击后跳转到内螺纹工艺界面
      range: 按钮
      text: '点击内螺纹工序一栏的 **工艺参数** 按钮，跳转到内螺纹工艺界面

        '
    - id: S28D2
      var: TOOL_SET[60]
      name: 变螺距使能
      rec: 是否磨削变螺距工件
      range: 不变螺距/变螺距
      text: '磨削普通等螺距工件时选 **不变螺距**

        需要加工变导程工件时选 **变螺距**，并在屏幕下方 **磨削参数** → 右侧 **螺距变换** 界面设置各段螺距

        需在机床配置中把 **螺距变换** 设为 单 或 多 后显示

        '
    - id: S28D3
      name: 工艺参数（外圆）
      rec: 点击后跳转到外圆工艺界面
      range: 按钮
      text: '点击外圆工序一栏的 **工艺参数** 按钮，跳转到外圆工艺界面

        '
    - id: S28D4
      name: 工艺参数（端面）
      rec: 点击后跳转到端面工艺界面
      range: 按钮
      text: '点击端面工序一栏的 **工艺参数** 按钮，跳转到端面工艺界面

        '
refs: '具体操作步骤请参考[外圆端面磨削](section_24.html)

  '
