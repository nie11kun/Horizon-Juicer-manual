title: 外圆端面磨削
head1: 机床功能介绍
refs: |
  具体参数设置请参考[外圆参数](section_26.html)、[端面参数](section_27.html)、[加工选择](section_28.html)
blocks:
  - h3: 加工选择
    body:
      - img: {src: center_select.png, h: 300}
      - p: |
          在 **加工选择** 界面右侧点亮本次需要加工的工序（外圆、左端面、右端面、外圆台阶、内螺纹），按循环启动后依次完成
  - h3: 外圆磨削
    body:
      - steps:
          - 加工选择界面点亮 **外圆**
          - 在外圆参数界面，通过手动对刀设置好初始磨削接触
          - 在端面参数界面，通过手动对刀设置好左右端面接触（外圆磨削范围由它们自动计算）
          - t: 在外圆工艺界面设置磨削工艺
            img: {src: center_od_process.png, h: 300}
          - 磨削方式：**来回** 表示进刀后左右往复磨削；**保持** 表示进刀后不往复（切入磨）
          - 保持模式下，外圆长度大于砂轮宽度时可分段切入磨削
      - note: |
          磨削前先设置好安全位置：外圆退刀位和台面磨削起始位
          头架转速建议大于 120 r/min
          粗磨可设为保持分段磨削，快速去除表面余量
          外圆磨削起点 = 左端面初始接触 + 0.1mm，终点 = 右端面初始接触 + 0.1mm
  - h3: 端面磨削
    body:
      - steps:
          - 加工选择界面点亮 **左端面 / 右端面**
          - 在端面参数界面和外圆参数界面通过手动对刀设置好磨削位置
          - t: 在端面工艺界面设置磨削工艺，磨削方式同外圆
            img: {src: center_face_process.png, h: 300}
      - note: |
          ?ifIsHasU: 左端面：磨削起点 = 外圆当前接触 + 0.1mm，终点 = 外圆当前接触 + 耳高 + 1mm；右端面：起点 = 外圆当前接触 - 壁厚，终点 = 外圆当前接触 + 1mm
          ?ifIsNotHasUBack: 左端面：磨削起点 = 外圆当前接触 - 0.1mm，终点 = 外圆当前接触 - 耳高 - 1mm；右端面：起点 = 外圆当前接触 + 壁厚，终点 = 外圆当前接触 - 1mm
          ?ifIsNotHasUFront: 左端面：磨削起点 = 外圆当前接触 + 0.1mm，终点 = 外圆当前接触 - 耳高 + 1mm；右端面：起点 = 外圆当前接触 - 壁厚，终点 = 外圆当前接触 + 1mm
  - h3: 台阶磨削
    body:
      - steps:
          - 加工选择界面点亮 **外圆台阶**
          - t: 在外圆参数界面右侧进入 **台阶一 / 台阶二**，打开使能，设置距左端面距离、台阶长度和工艺
            img: {src: center_step.png, h: 300}
          - 台阶的初始磨削位置取自外圆当前接触（或初始接触），因此先完成外圆加工
