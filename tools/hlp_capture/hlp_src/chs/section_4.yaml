title: 滚轮界面
head1: HMI界面参数定义
refs: '具体操作步骤请参考[砂轮修整](section_10.html)

  在修整界面点击右侧 **单滚轮 / 方滚轮 / 双滚轮 / 滚压轮 / 摆缸** 软键进入对应修整轮的参数页面（只显示本机配置的修整轮）

  '
blocks:
- h3: 修整轮位置标定（通用）
  body:
  - note: '修整前必须让程序知道修整轮与砂轮的相对位置，涉及两个参数：

      **修整中心距**（前后方向）：砂轮中心与修整轮中心之间的距离，决定修整从哪里开始进给

      **修整中心**（左右方向）：修整轮对准砂轮宽度中心时修整轴的坐标，决定修出的齿形是否居中

      两个参数旁边的锁形图标默认锁定，需先点击解锁才能修改，防止误改

      '
  - params:
    - id: S4D12
      marks:
      - ifIsInternal
      name: 修整中心距
      rec: 按测量计算
      range: -800~800
      unit: mm
      var: DRESSER[3]
      ac: 4
      text: '砂轮中心与修整轮中心重合方向上的距离，影响修整的前后起始位置

        计算方法：

        1. 安装新砂轮，测量砂轮直径 D1，输入到修整界面 **新砂轮直径**

        2. 按滚轮图纸输入 **修整轮直径** D2

        3. 移动机床使砂轮外圆刚好接触修整轮外沿，记录当前 X 坐标 X1，输入到 **当前接触.X**

        ?ifIsFrontDress: 4. 修整中心距 = |X1 + D1/2 + D2/2|

        ?ifIsBackDress: 4. 修整中心距 = |X1 - D1/2 - D2/2|

        设置后查看 **初始接触.X** 是否等于刚才输入的当前接触.X，相等即说明设置正确

        '
    - id: S4D6
      marks:
      - ifIsDressWare1
      name: 修整中心.W
      rec: 按测量计算
      range: -2000~2000
      unit: mm
      var: DRESSER[22]
      ac: 4
      text: '修整轮对准砂轮宽度中心时 W 轴（修整器水平轴）的坐标，影响修出齿形的左右位置

        测量方法：移动 W 轴，用修整轮左右侧面分别轻触砂轮左右端面，记录 W1、W2，修整中心 = (W1 + W2) / 2

        双滚轮时为两滚轮间距中心对准砂轮中心时的坐标

        '
    - id: S4D6
      marks:
      - ifIsDressWare2
      name: 修整中心.W
      rec: 按测量计算
      range: -2000~2000
      unit: mm
      var: DRESSER[22]
      ac: 4
      text: '修整轮对准砂轮宽度中心时 W 轴（修整器水平轴）的坐标，影响修出齿形的左右位置

        测量方法：移动 W 轴，用修整轮左右侧面分别轻触砂轮左右端面，记录 W1、W2，修整中心 = (W1 + W2) / 2

        双滚轮时为两滚轮间距中心对准砂轮中心时的坐标

        '
      dup: true
    - id: S4D13
      marks:
      - ifIsDressWare3
      name: 修整中心.W
      rec: 按测量计算
      range: -2000~2000
      unit: mm
      var: DRESSER[22]
      ac: 4
      text: '修整轮（单滚轮为圆弧圆心）对准砂轮宽度中心时修整器水平轴的坐标，影响修出齿形的左右位置

        测量方法：用修整轮左右侧面分别轻触砂轮左右端面，记录两个坐标 Z1、Z2，修整中心 = (Z1 + Z2) / 2

        双滚轮时为两滚轮间距中心对准砂轮中心时的坐标

        '
    - id: S4D13
      marks:
      - ifIsDressWare4
      name: 修整中心.W
      rec: 按测量计算
      range: -2000~2000
      unit: mm
      var: DRESSER[22]
      ac: 4
      text: '修整轮（单滚轮为圆弧圆心）对准砂轮宽度中心时修整器水平轴的坐标，影响修出齿形的左右位置

        测量方法：用修整轮左右侧面分别轻触砂轮左右端面，记录两个坐标 Z1、Z2，修整中心 = (Z1 + Z2) / 2

        双滚轮时为两滚轮间距中心对准砂轮中心时的坐标

        '
      dup: true
    - id: S4D17
      name: 参数锁定开关
      range: 打开/闭合
      ac: 4
      text: '修整中心距、修整中心旁的锁形图标。默认闭合（只读），点击打开后才能修改

        '
    - id: S4D18
      marks:
      - ifIsUW
      name: UW-修整位.X
      range: 无
      unit: mm
      var: DRESSER[141]
      ac: 4
      text: 'UW 修整器修整时 X 轴移动到的位置，砂轮在此处由 U、W 轴驱动修整轮完成修整

        '
- h3: 单滚轮 / 方滚轮 / 双滚轮（插补修整）
  marks:
  - ifIsDressWare1
  body:
  - img:
      src: roller_single_ext.png
      h: 300
    marks:
    - ifIsSingleAndRound
  - img:
      src: roller_double_ext.png
      h: 300
    marks:
    - ifIsSide
- h3: 单滚轮 / 方滚轮 / 双滚轮（插补修整）
  marks:
  - ifIsDressWare3
  body:
  - img:
      src: roller_single_int.png
      h: 300
    marks:
    - ifIsInternal
    - ifIsSingleAndRound
  - img:
      src: roller_square_int.png
      h: 300
    marks:
    - ifIsInternal
    - ifIsSingleAndRound
  - img:
      src: roller_double_ext.png
      h: 300
    marks:
    - ifIsExternal
    - ifIsSide
- h3: 插补修整轮参数
  body:
  - note: '插补修整时修整轮沿齿形轮廓运动，需要准确输入修整轮的几何尺寸

      '
  - params:
    - id: S4D1
      name: 圆弧半径 / 左圆弧 / 右圆弧
      rec: 按滚轮图纸
      range: 0~10
      unit: mm
      var: WHEEL[5]~WHEEL[10]
      ac: 4
      text: '修整轮刃口的圆弧半径，单滚轮输入一个半径，方滚轮和双滚轮分别输入左、右刃口圆弧

        此值直接影响修出的齿形，须按滚轮图纸或实测输入

        '
    - id: S4D7
      marks:
      - ifIsSingleAndRound
      name: 方滚轮厚度
      rec: 按滚轮图纸
      range: 0~100
      unit: mm
      var: WHEEL[4]
      ac: 4
      text: '方滚轮刃口的宽度，影响修出齿形的宽度

        '
    - id: S4D8
      marks:
      - ifIsSide
      name: 修整轮间距
      rec: 按滚轮图纸
      range: 0~300
      unit: mm
      var: WHEEL[3]
      ac: 4
      text: '双滚轮两个修整轮之间的距离，影响修出齿形的宽度

        '
    - id: S4D9
      marks:
      - ifIsSide
      name: 左右高度差
      rec: 按测量结果
      range: -5~5
      unit: mm
      var: WHEEL[16]
      ac: 4
      text: '补偿双滚轮左右两轮的高低差：左高右低输入正值，左低右高输入负值

        '
    - id: S4D2
      marks:
      - ifIsDressWare1
      name: 初始接触.U（初始左端/右端接触）
      rec: 手动测量
      range: -500~500
      unit: mm
      var: WHEEL[13] / WHEEL[14]
      ac: 4
      text: '安装新砂轮后，移动 U 轴使修整轮刚好接触砂轮外圆最高点，记录此时 U 坐标

        新砂轮修整从此位置开始；双滚轮分别显示左、右轮的接触位置

        '
    - id: S4D2
      marks:
      - ifIsDressWare2
      name: 初始接触.U（初始左端/右端接触）
      rec: 手动测量
      range: -500~500
      unit: mm
      var: WHEEL[13] / WHEEL[14]
      ac: 4
      text: '安装新砂轮后，移动 U 轴使修整轮刚好接触砂轮外圆最高点，记录此时 U 坐标

        新砂轮修整从此位置开始；双滚轮分别显示左、右轮的接触位置

        '
      dup: true
    - id: S4D14
      marks:
      - ifIsDressWare3
      name: 初始接触.X（初始左端/右端接触）
      range: 自动计算
      unit: mm
      var: WHEEL[13] / WHEEL[14]
      ac: 4
      text: '新砂轮时修整轮接触砂轮外圆的 X 坐标，设置正确的修整中心距后自动计算

        可用于核对修整中心距是否正确

        '
    - id: S4D14
      marks:
      - ifIsDressWare4
      name: 初始接触.X（初始左端/右端接触）
      range: 自动计算
      unit: mm
      var: WHEEL[13] / WHEEL[14]
      ac: 4
      text: '新砂轮时修整轮接触砂轮外圆的 X 坐标，设置正确的修整中心距后自动计算

        可用于核对修整中心距是否正确

        '
      dup: true
    - id: S4D3
      marks:
      - ifIsDressWare1
      name: 当前接触.U（当前左端/右端接触）
      range: 自动更新
      unit: mm
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: '当前砂轮与修整轮接触时的 U 坐标，每次修整后自动更新

        修整界面砂轮状态为旧砂轮时，修整从此位置开始

        '
    - id: S4D3
      marks:
      - ifIsDressWare2
      name: 当前接触.U（当前左端/右端接触）
      range: 自动更新
      unit: mm
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: '当前砂轮与修整轮接触时的 U 坐标，每次修整后自动更新

        修整界面砂轮状态为旧砂轮时，修整从此位置开始

        '
      dup: true
    - id: S4D15
      marks:
      - ifIsDressWare3
      name: 当前接触.X（当前左端/右端接触）
      range: 自动更新
      unit: mm
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: '当前砂轮与修整轮接触时的 X 坐标，每次修整后自动更新；旧砂轮修整从此位置开始

        标定修整中心距时，把实测接触坐标输入到这里

        '
    - id: S4D15
      marks:
      - ifIsDressWare4
      name: 当前接触.X（当前左端/右端接触）
      range: 自动更新
      unit: mm
      var: WHEEL[11] / WHEEL[12]
      ac: 4
      text: '当前砂轮与修整轮接触时的 X 坐标，每次修整后自动更新；旧砂轮修整从此位置开始

        标定修整中心距时，把实测接触坐标输入到这里

        '
      dup: true
- h3: 滚压轮（成型修整）
  body:
  - img:
      src: roller_form_ext.png
      h: 300
    marks:
    - ifIsExternal
  - img:
      src: roller_form_int.png
      h: 300
    marks:
    - ifIsInternal
  - note: '成型修整时滚压轮直线进给到砂轮上，把滚轮齿形复制到砂轮，不需要设置齿形参数

      '
  - params:
    - id: S4D11
      name: 齿高
      rec: 按滚轮图纸
      range: 0~50
      unit: mm
      var: DRESSER[2]
      ac: 4
      text: '滚压轮的齿高，新砂轮修整时程序按此判断砂轮外形是否已全部修出

        '
    - id: S4D10
      name: 粗修停留时间 / 精修停留时间
      rec: 1s 左右
      range: 0~80
      unit: s
      var: DRESSER[48] / WHEEL[19]
      ac: 4
      text: '滚压轮每次进给到位后在砂轮上保持接触的时间，使齿形充分成型；精修可适当延长

        '
    - id: S4D16
      name: 修整反向距离
      rec: '0'
      range: 0~1
      unit: mm
      var: INI[12]
      ac: 4
      text: '每次修整完成后砂轮后退脱离滚轮的距离，等待下一次修整进给

        需要连续不间断进给修整时设为 0

        '
    - id: S4D19
      name: 轮廓成型接触
      range: 只读
      unit: mm
      var: WHEEL[13]
      readonly: true
      text: '新砂轮外轮廓完全修出成型时滚压轮的接触坐标，由程序记录

        '
    - id: S4D23
      name: 初始接触 / 当前接触
      range: 无
      unit: mm
      var: WHEEL[15] / WHEEL[11]
      ac: 4
      text: '**初始接触**：新砂轮时滚压轮开始接触砂轮的坐标（新砂轮修整的起点）

        **当前接触**：当前砂轮与滚压轮的接触坐标，每次修整后自动更新，旧砂轮修整从此开始

        '
    - id: S4D20
      name: 靠磨-后退距离 / 靠磨-侧进距离
      range: 0~1
      unit: mm
      var: TECHNOLOGY[351] / TECHNOLOGY[352]
      ac: 4
      text: '机床配置开启"成型轮修整完成进行左右靠磨"后显示：成型修整结束后，修整轮先后退一段距离，再向左右侧移靠磨齿面，修光两侧

        '
- h3: 摆缸（液压修整器）
  marks:
  - ifIsVH
  body:
  - img:
      src: roller_hyd.png
      h: 300
  - params:
    - id: S4D22
      name: 液压左接触 / 液压右接触
      range: 只读指示
      var: WHEEL[17] / WHEEL[18]
      readonly: true
      text: '液压摆缸修整器左、右侧到位信号的状态指示，点亮表示对应侧已接触到位

        '
- h3: 修整轮转速
  body:
  - params:
    - id: S4D4
      name: 修整轮直径
      rec: 按滚轮图纸
      range: 0~500
      unit: mm
      var: WHEEL[1]
      ac: 4
      text: '修整轮外径。用于计算修整轮转速和修整中心距，务必输入准确

        '
    - id: S4D5
      name: 修整轮线速度
      rec: 15m/s 左右
      range: 0~60，且不超过滚轮最大额定转速
      unit: m/s
      var: WHEEL[2]
      ac: 4
      text: '修整时修整轮外圆的线速度。砂轮与修整轮的线速度配合对修整质量影响很大

        '
    - id: S4D21
      name: 修整轮转速
      range: 只读
      unit: rpm
      var: WHEEL[20]
      readonly: true
      text: '按修整轮线速度和直径自动换算：转速 = 线速度 × 60000 / (π × 修整轮直径)

        '
