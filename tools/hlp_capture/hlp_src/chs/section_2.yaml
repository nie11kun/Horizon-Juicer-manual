title: 工艺界面
head1: HMI界面参数定义
refs: '具体操作步骤请参考[磨削](section_12.html)

  在用户界面中点击屏幕下方 **工艺参数** 软键进入本页

  '
blocks:
- h3: 工艺参数表
  body:
  - img:
      src: process_batch.png
      h: 300
  - note: '工艺表按列分为 **粗磨 / 半精磨 / 精磨 / 终磨** 四道工序，程序按此顺序依次执行，每道工序按循环次数重复磨削

      右侧 **批量**/**单件**软键切换两套独立的工艺表，分别对应磨削界面加工模式的批量生产与单件调整

      机床配置为扩展工艺时，表中增加每道工序的修整参数（见下方扩展工艺参数）

      工艺模式选择 DIY 时，磨削按用户 DIY 程序执行，工艺表全部只读；程序运行中工艺表同样只读

      '
  - params:
    - id: S2D3
      name: 单双磨
      rec: 无
      range: 单向/双向
      var: TECHNOLOGY[111]~TECHNOLOGY[114]（批量）/ TECHNOLOGY[171]~TECHNOLOGY[174]（单件）
      ac: 4
      text: '**单向**：只在一个方向磨削，返回时不进刀、不磨削

        **双向**：往返两个方向都磨削，在两端各进刀一次，效率更高

        '
    - id: S2D4
      name: 循环次数
      range: ≥ 0
      var: TECHNOLOGY[121]~TECHNOLOGY[124]（批量）/ TECHNOLOGY[181]~TECHNOLOGY[184]（单件）
      ac: 4
      text: '每道工序的磨削次数，按工艺要求设置；某道工序不需要时设为 0

        '
    - id: S2D5
      name: 进给深度
      rec: 0.005~0.05
      range: 粗磨不限，其余工序默认 ±0.1（限制值可在机床配置中修改）
      unit: mm
      var: TECHNOLOGY[131]~TECHNOLOGY[134] 或 TECHNOLOGY[371]~TECHNOLOGY[374]（批量）/ TECHNOLOGY[191]~TECHNOLOGY[194] 或 TECHNOLOGY[375]~TECHNOLOGY[378]（单件）
      ac: 4
      text: '每次循环的 X 向（直径方向半值）进刀量。通常粗磨进刀量最大、逐道工序递减，终磨可设小值或 0 用于光磨

        双向磨削时进刀量的含义由机床配置决定：

        **双向总和**模式：输入值为一个往返的总进刀量

        **单次进刀**模式：输入值为每个方向的进刀量，一个往返实际进刀为输入值的 2 倍

        机床配置开启粗磨自动计算时，粗磨进给深度只读，由设定磨削总量反算

        '
    - id: S2D59
      name: 磨削速度
      range: 只读
      unit: mm/min
      var: TECHNOLOGY[141]~TECHNOLOGY[144]（批量）/ TECHNOLOGY[201]~TECHNOLOGY[204]（单件）
      readonly: true
      text: 'Z 轴磨削进给速度，由头架转速自动计算：磨削速度 = 头架转速 × 螺距 × 头数

        '
    - id: S2D6
      name: 磨几次修整（修整设定）
      range: ≥ 0
      var: TECHNOLOGY[151]~TECHNOLOGY[154]（批量）/ TECHNOLOGY[211]~TECHNOLOGY[214]（单件）
      ac: 4
      text: '该工序中每磨削几次循环后自动修整一次砂轮，0 表示该工序中不修整

        例：粗磨循环 5 次、设定为 2，则在第 2、4 次循环后修整

        磨削中修整使用修整界面的精修参数（次数/进给量/速度）

        '
    - id: S2D7
      name: 砂轮线速度
      rec: 25m/s
      range: 15~50
      unit: m/s
      var: TECHNOLOGY[161]~TECHNOLOGY[164]（批量）/ TECHNOLOGY[221]~TECHNOLOGY[224]（单件）
      ac: 4
      text: '磨削时砂轮外圆线速度。不同砂轮材质最佳线速度差异较大，CBN 砂轮一般需要较高线速度

        非恒转速模式下输入线速度，界面按当前砂轮直径自动换算砂轮转速：转速 = 线速度 × 60000 / (π × 砂轮直径)

        机床配置开启 **恒转速模式** 后此值只读，由输入的砂轮转速反算

        '
    - id: S2D8
      name: 头架转速
      range: 默认不超过 60（限制值可在机床配置中修改）
      unit: r/min
      var: TECHNOLOGY[61]~TECHNOLOGY[64]（批量）/ TECHNOLOGY[268]~TECHNOLOGY[271]（单件）
      ac: 4
      text: '磨削时头架（C 轴）转速，决定磨削速度。转速越高效率越高，但表面质量下降

        一般粗磨用较高转速，精磨、终磨用较低转速

        '
    - id: S2D10
      name: 磨削砂轮转速
      range: 由线速度换算
      unit: r/min
      var: TECHNOLOGY[71]~TECHNOLOGY[74]（批量）/ TECHNOLOGY[17]~TECHNOLOGY[20]（单件）
      ac: 4
      text: '非恒转速模式下由线速度和当前砂轮直径自动计算，只读

        机床配置为砂轮恒转速时可直接输入转速，线速度随砂轮直径变化

        '
- h3: 磨削总量与修整计数
  body:
  - params:
    - id: S2D9
      name: 设定磨削总量 / 累计磨削总量
      rec: 按工件余量
      range: 无
      unit: mm
      var: PROCESS[13]、PROCESS[15]、PROCESS[114]
      ac: 4
      text: '**设定磨削总量**：一个工件从初始接触.X 起需要磨去的总量，默认按 各工序循环次数 × 进给深度 自动累加计算

        机床配置开启粗磨自动计算时可直接输入总量，粗磨进给深度按 (总量 - 其余工序进刀量) / 粗磨次数 反算

        **累计磨削总量**：当前工件已经实际进刀的总量，只读

        工艺模式为 DIY 时需根据 DIY 程序自行计算

        '
    - id: S2D1
      name: 已加工
      rec: '0'
      range: 自动累计
      unit: 件
      var: INI[74]
      ac: 4
      text: '磨削工件计数，批量模式下每完成一个工件自动加 1，用于按件数自动修整

        可手动清零重新计数

        '
    - id: S2D2
      name: 修整设定-大砂轮
      rec: 按工艺要求
      range: ≥ 0
      unit: 件
      var: PROCESS[126]
      ac: 4
      text: '砂轮直径大于临界直径时，每加工几件后在下一件开始前自动修整一次砂轮，0 表示不按件数修整

        临界直径由机床配置设定；修整使用修整界面的精修参数

        '
    - id: S2D11
      name: 修整设定-小砂轮
      rec: 按工艺要求
      range: ≥ 0
      unit: 件
      var: PROCESS[127]
      ac: 4
      text: '砂轮直径小于等于临界直径时的按件数修整间隔。小砂轮磨损快，通常设置比大砂轮更小的间隔

        '
    - id: S2D12
      name: 修整模式
      range: 次数/头数
      var: WORK[6]
      ac: 4
      text: '多头螺纹磨削中修整的计数方式（需在机床配置中开启）

        **次数**：所有头磨完算一次循环计数

        **头数**：每磨完一个头计数一次，修整更频繁

        '
    - id: S2D13
      name: 修整后空刀一次
      range: 开/关（右侧软键点亮为开）
      var: PROCESS[18]
      ac: 7
      text: '右侧 **修整后空刀一次** 软键点亮时，磨削中每次修整砂轮后，下一次循环不进刀先磨一刀，消除修整误差；按头数修整时无效

        '
    - id: S2D14
      name: 起始工序选择 / 起始循环选择
      range: 粗磨/半精磨/精磨/终磨；循环号
      var: SHAPE_MODEL[61]、SHAPE_MODEL[62]、STRING_ADDON[2]
      ac: 7
      text: '批量磨削时从指定工序的指定循环开始加工（需在机床配置中开启），之前工序的进刀量自动累加到当前接触位置

        用于加工中断后从断点继续，起始循环大于本工序循环次数时直接进入下一工序

        右上角同时显示当前正在加工的工序

        '
    - id: S2D34
      name: 工艺模式
      range: 界面工艺/DIY
      ac: 4
      var: PROCESS[1]
      text: '**界面工艺**：按本页工艺表磨削

        **DIY**：按用户编写的 DIY 加工程序磨削，工艺表只读；DIY 时设定磨削总量需根据程序自行计算

        '
    - id: S2D35
      name: 工艺类型
      range: 标准工艺/扩展工艺
      ac: 4
      var: PROCESS[16]
      text: '显示当前为标准工艺表还是扩展工艺表（带各工序修整参数），由机床配置决定

        '
- h3: 扩展工艺参数
  body:
  - img:
      src: process_ext.png
      h: 300
  - note: '机床配置为扩展工艺时，工艺表中每道工序增加独立的修整参数，磨削中修整按当前工序参数执行，不再统一使用修整界面精修参数

      '
  - params:
    - id: S2D15
      name: 修整次数
      range: ≥ 0
      var: TECH_DRESS_TIME[21]~TECH_DRESS_TIME[24]（批量）/ TECH_DRESS_TIME[31]~TECH_DRESS_TIME[34]（单件）
      ac: 4
      text: '该工序中每次修整时修整器往复修整的次数

        '
    - id: S2D16
      name: 修整进给深度
      range: ≥ 0
      unit: mm
      var: TECH_DRESS_DEEP[22]~TECH_DRESS_DEEP[25]（批量）/ TECH_DRESS_DEEP[32]~TECH_DRESS_DEEP[35]（单件）
      ac: 4
      text: '该工序中每次修整的进给量（直径方向半值），砂轮直径与磨削位置按此自动补偿

        '
    - id: S2D17
      name: 修整速度
      range: 大于 0
      unit: mm/min
      var: TECH_DRESS_FEED[22]~TECH_DRESS_FEED[25]（批量）/ TECH_DRESS_FEED[32]~TECH_DRESS_FEED[35]（单件）
      ac: 4
      text: '该工序修整时修整轴沿齿形运动的速度

        '
    - id: S2D18
      name: 修整砂轮线速度 / 修整砂轮转速
      range: 线速度 ≥ 0
      var: WHEEL_LINESPEED_DRESS[24]~WHEEL_LINESPEED_DRESS[27]（批量）/ WHEEL_LINESPEED_DRESS[34]~WHEEL_LINESPEED_DRESS[37]（单件）；转速 TECHNOLOGY[75]~TECHNOLOGY[78] / TECHNOLOGY[25]~TECHNOLOGY[28]
      ac: 4
      text: '该工序修整时砂轮线速度（m/s），修整砂轮转速按当前砂轮直径自动换算并只读显示

        机床配置开启 **恒转速模式** 后改为直接输入修整砂轮转速，线速度只读显示

        '
- h3: 三线测量与压力显示
  body:
  - params:
    - id: S2D19
      name: 工件外径 / 三线测量 / 钢球直径 / 终尺寸H
      range: 无
      unit: mm
      var: INI[121] / INI[122] / INI[123] / INI[124]
      ac: 7
      text: '机床配置开启三线测量显示后出现，用于现场换算测量结果

        输入工件外径、三线（量棒）测量值和钢球直径，界面自动计算 终尺寸H = (工件外径 - 三线测量) / 2 + 钢球直径

        ?ifIsCenter: 磨削中心的主界面上修改这些值需要钥匙开关 3 档及以上

        '
    - id: S2D20
      name: 头架压力 / 系统压力
      range: 只读
      readonly: true
      text: '机床配置开启压力检测显示后出现，实时显示头架和液压系统压力，用于监控夹紧状态

        '
- h3: 附加配置界面
  body:
  - img:
      src: process_addon.png
      h: 300
  - note: '在机床配置中开启后，工艺界面右侧出现 **附加配置** 软键

      '
  - params:
    - id: S2D21
      name: 粗磨/半精磨进刀量梯度变化
      range: 关/开
      var: TECHNOLOGY[119] / TECHNOLOGY[125]
      ac: 4
      text: '打开后粗磨（或半精磨）每次进刀量不再相同，而是从大到小线性递减，总进刀量不变，减小后期磨削力

        '
    - id: S2D22
      name: 粗磨/半精磨进刀量总变化量
      range: -1~1
      unit: mm
      var: TECHNOLOGY[120]
      ac: 4
      text: '梯度变化时第一刀与最后一刀进刀量的差值；总变化量大于设定进刀量的两倍时不执行梯度进刀

        '
    - id: S2D23
      name: 单头位置补偿
      range: 关/开
      var: TECHNOLOGY[126]
      ac: 4
      text: '多头螺纹各头之间存在尺寸或位置差异时打开，按下方表格对第 1~6 头分别补偿

        '
    - id: S2D24
      name: 第1头~第6头补偿（进刀.X / 角度.C / 锥度.X）
      range: -1~1
      var: 进刀 TECHNOLOGY[145]~TECHNOLOGY[150]；角度 TECHNOLOGY[343]~TECHNOLOGY[348]；锥度 TECHNOLOGY[381]~TECHNOLOGY[386]
      ac: 4
      text: '**进刀.X**：该头磨削起始 X 位置补偿（mm），用于修正各头中径差

        **角度.C**：该头分度角补偿（°），用于修正各头等分误差

        **锥度.X**：该头全长锥度补偿（mm），用于修正各头锥度差异

        '
- h3: Y轴设置界面
  body:
  - img:
      src: process_yaxis.png
      h: 300
  - note: '用于带 Y 轴的机床（砂轮架可沿 Y 向移动），在机床配置中开启后工艺界面右侧出现 **Y轴设置** 软键

      A 轴摆动螺旋升角后砂轮中心会偏离，程序按中心距自动计算 Y 轴补偿位置，使磨削点与修整点保持在中心

      '
  - params:
    - id: S2D25
      name: 有Y轴
      range: 关/开
      var: TECHNOLOGY[353]
      ac: 4
      text: '打开后磨削和修整时 Y 轴自动移动到计算位置

        '
    - id: S2D26
      name: 自动计算
      range: 关/开
      var: TECHNOLOGY[357]
      ac: 4
      text: '**开**：按砂轮/A轴中心距和 A0 基准位置自动计算磨削实际.Y、修整实际.Y

        **关**：磨削实际.Y 与修整实际.Y 手动输入

        '
    - id: S2D27
      name: 砂轮/A轴中心距
      range: 无
      unit: mm
      var: TECHNOLOGY[354] / TECHNOLOGY[361] / TECHNOLOGY[366]
      ac: 4
      text: '依次为电主轴端面到 A 轴回转中心距离（砂轮在 A 左侧为正）、磨杆长度、砂轮修整中心到磨杆端面距离，用于自动计算

        '
    - id: S2D28
      name: A0磨削基准.Y / A0修整基准.Y
      range: 无
      unit: mm
      var: TECHNOLOGY[355] / TECHNOLOGY[356]
      ac: 4
      text: 'A 轴为 0° 时砂轮对准工件中心和修整器中心的 Y 坐标

        '
    - id: S2D29
      name: 磨削实际.Y（当前实际.Y） / 修整实际.Y
      range: 无
      unit: mm
      var: TECHNOLOGY[358] / TECHNOLOGY[359]
      ac: 4
      text: '磨削和修整时 Y 轴实际运动到的位置；自动计算开启时只读显示计算结果

        '
- h3: 挡块设置界面
  marks:
  - ifIsUW
  body:
  - img:
      src: process_stop.png
      h: 300
  - note: '用于 UW 修整器的力矩夹紧轴：修整时用电机力矩夹紧代替机械锁紧。在机床配置中开启后工艺界面右侧出现 **挡块设置** 软键

      '
  - params:
    - id: S2D30
      name: 力矩夹紧轴控制
      range: 关/开
      var: TECHNOLOGY[365]
      ac: 4
      text: '打开后 UW 轴修整时执行力矩夹紧/松开动作

        '
    - id: S2D31
      name: 夹紧位置 / 松开位置
      range: 无
      unit: mm
      var: TECHNOLOGY[362] / TECHNOLOGY[363]
      ac: 4
      text: '力矩夹紧轴夹紧和松开时运动到的坐标

        '
    - id: S2D32
      name: 夹紧力矩
      range: 0~100
      unit: '%'
      var: TECHNOLOGY[364]
      ac: 4
      text: '夹紧时电机输出力矩占额定力矩的百分比

        '
    - id: S2D33
      name: 监控范围
      range: 0~20
      unit: mm
      var: TECHNOLOGY[367]
      ac: 4
      text: '夹紧位置允许的偏差范围，超出范围判定夹紧失败并报警

        '
