title: 磨削界面
head1: HMI界面参数定义
refs: |
  具体操作步骤请参考[磨削](section_12.html)，扩展功能操作请参考[磨削扩展功能](section_13.html)
  在用户界面中点击屏幕下方 **磨削参数** 软键进入本页
blocks:
  - h3: 磨削主界面
    body:
      - img: {src: grind_main_ext.png, h: 300}
        marks: [ifIsExternal]
      - img: {src: grind_main_int.png, h: 300}
        marks: [ifIsInternal]
      - note: |
          界面左上角实时显示 X/Z 轴机床坐标及 DRF（手轮偏移）值，用于手动测量记录各位置坐标
          程序运行中（循环启动指示有效）时，工件与位置类参数自动变为只读，停止后恢复可编辑
          底部绿色区域（加工起始角.C/当前接触.X/初始接触.X）为对刀结果，默认锁定只读
      - params:
          - id: S1D1
            name: 加工模式
            range: 单件调整/批量生产
            var: INI[27]
            ac: 4
            text: |
              决定每次启动程序时砂轮从哪个 X 位置开始进刀
              **单件调整**：从上一次加工结束时的当前磨削位（当前接触.X）继续进刀，适合首件试磨、反复补磨同一工件
              **批量生产**：每次启动先把当前接触.X 复位为初始接触.X，并清零工艺累计进刀量，每个新工件都从对刀位开始完整加工
              首件试磨合格后再切换为批量生产
          - id: S1D8
            name: 螺纹旋向
            range: 右旋/左旋
            var: INI[1]
            ac: 4
            text: |
              按工件图纸设置。旋向决定 C 轴与 Z 轴联动方向，并自动决定磨削起点在工件左端还是右端
          - id: S1D9
            name: 工件头数
            range: 1~100
            var: WORK[1]
            ac: 4
            text: |
              按工件图纸设置螺纹线数。程序以 导程 = 头数 × 螺距 计算 C 轴转角，多头螺纹按头数依次分度磨削
          - id: S1D4
            name: 螺纹螺距
            range: 0~100
            unit: mm
            var: INI[5]
            ac: 4
            text: |
              按工件图纸设置螺距（相邻两牙距离，不是导程）
              ?ifIsHasWorm: 蜗杆模式下此值由 蜗杆模数 × π 自动计算并显示，不可手动修改
          - id: S1D53
            marks: [ifIsExternal, ifIsHasWorm]
            name: 蜗杆使能
            range: 螺纹/蜗杆
            var: INI[87]
            ac: 4
            text: |
              **螺纹**：输入螺距，修整调用内置螺纹齿形
              **蜗杆**：输入模数，螺距按 π × 模数 自动换算，修整调用蜗杆齿形，螺旋升角按分度圆直径计算
          - id: S1D54
            marks: [ifIsExternal, ifIsHasWorm]
            name: 蜗杆模数
            range: 0~50
            unit: mm
            var: INI[77]
            ac: 4
            text: |
              蜗杆使能选择为蜗杆时输入。按图纸法向/轴向模数输入，界面自动计算螺距 = π × 模数
          - id: S1D55
            marks: [ifIsExternal, ifIsHasWorm]
            name: 分度圆直径
            range: 0~400
            unit: mm
            var: INI[40]
            ac: 4
            text: |
              蜗杆模式下打开螺旋升角自动计算时输入，用于计算升角：升角 = arctan(头数 × 螺距 / (π × 分度圆直径))
          - id: S1D16
            name: 锥度
            rec: 按工件图纸
            range: -10~10
            var: INI[15]
            ac: 4
            text: |
              锥螺纹磨削时输入，直螺纹输入 0
              输入值为工件单位长度上半径方向的变化量：锥度比 1:16 时输入 1/16/2 = 0.03125
              已知两端直径时：(大端直径 - 小端直径) / 长度 / 2
              ?ifIsExternal: 外螺纹按小头往大头方向磨削，小头往大头输入正值，反之为负
              ?ifIsInternal: 内螺纹按大头往小头方向磨削，大头往小头输入正值，反之为负
              全长 X 方向增量 = 磨削长度 × 锥度 + 全长锥度补偿
          - id: S1D19
            name: 螺旋升角（开关）
            range: 开/关
            var: INI[39]
            ac: 4
            text: |
              **开**：根据头数、螺距和工件中径自动计算螺旋升角，升角 = arctan(头数 × 螺距 / (π × 工件中径))
              **关**：螺旋升角手动输入
          - id: S1D20
            name: 螺旋升角
            range: -90~90
            unit: °
            var: INI[18]
            ac: 4
            text: |
              磨削和对刀前，带 A 轴的机床会将砂轮架摆动到此角度；同时用于修整时法向齿形换算
              ?ifIsHasA: 本机配置有 A 轴，启动对刀/磨削时会自动松开液压锁紧并摆到此角度
          - id: S1D23
            name: 工件中径
            range: 0~500
            unit: mm
            var: INI[40]
            ac: 4
            text: |
              仅用于螺旋升角自动计算，打开螺旋升角开关后输入，关闭时此项不可编辑
          - id: S1D10
            name: 工件左端.Z
            range: -2000~2000
            unit: mm
            var: INI[2]
            ac: 4
            text: |
              手动将砂轮中心移到工件螺纹左端需磨削的位置，记录此时 Z 轴机床坐标
              左右端之差即磨削长度，需保证砂轮能完整磨出整段螺纹
          - id: S1D11
            name: 工件右端.Z
            range: -2000~2000
            unit: mm
            var: INI[3]
            ac: 4
            text: |
              手动将砂轮中心移到工件螺纹右端需磨削的位置，记录此时 Z 轴机床坐标
              程序根据旋向自动决定从左端还是右端开始磨削
          - id: S1D12
            marks: [ifIsExternal]
            name: 工件中心.X（对刀起始位）
            rec: 接近工件外圆处
            range: 砂轮在工件外的安全位置
            unit: mm
            var: INI[11]
            ac: 4
            text: |
              外螺纹时表示对刀起始位置：对刀时 X 轴先快速移动到此位置，再进入手轮对刀
              在保证安全的前提下尽量接近工件外圆，记录当前 X 轴坐标
          - id: S1D28
            marks: [ifIsInternal]
            name: 工件中心.X
            rec: 砂轮中心与头架中心重合时的 X 坐标
            range: 无
            unit: mm
            var: INI[11]
            ac: 4
            text: |
              内螺纹时砂轮在此 X 位置沿 Z 向进出工件内孔，必须设置准确
              测量方法：X 轴移动使砂轮接触工件内孔壁记录 X1，测量内孔直径 D1 和砂轮直径 D2
              工件中心 = X1 ± (D1 - D2) / 2（向孔中心方向取值）
          - id: S1D52
            marks: [ifIsExternal, ifIsHasLoadingArm]
            name: 上料位置.Z
            rec: 方便机械手上下料的 Z 位置
            range: 无
            unit: mm
            var: INI[29]
            ac: 4
            text: |
              机械手上下料前，Z 轴先移动到此位置等待机械手取放工件
          - id: S1D30
            marks: [ifIsInternal]
            name: 安全位置.Z
            rec: 砂轮完全退出工件外
            range: -2000~2000
            unit: mm
            var: INI[29]
            ac: 4
            text: |
              内螺纹磨削开始、修整和退出时，Z 轴先运动到此位置，砂轮在此处离开工件内孔
              至少比工件右端多出 30mm，保证砂轮在此位置可以安全进行 X 向移动
          - id: S1D14
            name: 安全位置.X
            rec: X 轴远离工件位置
            range: 无
            unit: mm
            var: INI[24]
            ac: 4
            text: |
              程序启动、加工结束和异常退出时 X 轴退到的安全位置
              推荐设置到相对靠后的位置，保证 Z 轴、C 轴及上下料运动不会与工件干涉
          - id: S1D29
            name: 安全位置.C（工件装夹角度）
            rec: 方便上下工件的角度
            range: 0~360
            unit: °
            var: INI[28]
            ac: 4
            text: |
              程序执行结束后头架（C 轴）转到此角度，便于拆装工件或机械手抓取
          - id: S1D18
            marks: [ifIsExternal]
            name: 磨削安全退.X
            rec: 保证砂轮完全脱离工件
            range: ≥ 10
            unit: mm
            var: TECHNOLOGY[130]
            ac: 4
            text: |
              外螺纹每次磨到终点后，X 轴相对初始接触.X 向后退出的距离，退出后 Z 轴返回起点
              磨削安全位置 = 初始接触.X + 此距离，须保证 Z 轴回程不碰工件
          - id: S1D15
            name: 全长导程补偿
            rec: 按检测报告
            range: -500~500
            unit: mm
            var: INI[25]
            ac: 7
            text: |
              用于修正全长范围内的螺距累积误差，输入检测报告中全长导程误差值
              程序以 C 轴总转角 = 360 × (磨削长度 - 补偿值) / 导程 计算，正值使相同长度内 C 轴转角减小、实际导程变大，负值反之
          - id: S1D17
            name: 全长锥度补偿
            rec: 按测量情况
            range: -9~9
            unit: mm
            var: INI[142]
            ac: 7
            text: |
              加工后测量两端中径存在差值时使用，输入值为全长范围内半径方向的补偿量
              与锥度叠加：X 方向总增量 = 磨削长度 × 锥度 + 全长锥度补偿
          - id: S1D51
            marks: [ifIsInternal]
            name: 退出方式
            rec: 按砂轮与内孔大小
            range: 直接退出/螺旋退出
            var: INI[85]
            ac: 4
            text: |
              控制砂轮磨到螺纹终点后如何退出工件内孔
              **直接退出**：X 回到工件中心后 Z 直线退出，砂轮直径小于工件内孔时使用
              **螺旋退出**：沿螺纹螺旋线退出，砂轮直径大于内孔或退出路径有台阶时使用
  - h3: 补偿与对刀结果
    body:
      - params:
          - id: S1D2
            name: 中径补偿
            range: 默认 ±1（限制值可在机床配置中修改）
            unit: mm
            var: GRIND[5]
            ac: 7
            text: |
              加工后测量工件中径与目标值不符时，无需修改工艺进刀量，直接在此输入直径方向的差值
              正值使工件中径变大（外螺纹少磨、内螺纹多磨），负值使中径变小
              例：外螺纹实测中径比目标大 0.02mm，输入 -0.02
              为单次补偿：下次启动程序时把补偿量的一半累加到当前接触.X 和初始接触.X 后自动清零
              需先点击右侧锁形图标解锁才能输入
          - id: S1D3
            name: 偏刀补偿
            range: -100~100
            unit: mm
            var: TOOL_SET[43]
            ac: 7
            text: |
              加工后测量发现螺纹牙两侧磨削不均（偏刀）时输入 Z 向偏移量
              程序把 Z 偏移按 角度 = 偏移 / 导程 × 360 换算并累加到加工起始角.C，使砂轮相对螺旋槽轴向偏移
              为单次补偿：下次启动程序后自动清零；需先点击右侧锁形图标解锁才能输入
          - id: S1D56
            name: 参数锁定开关
            range: 打开/闭合
            ac: 7
            text: |
              锁形图标位于中径补偿、偏刀补偿和对刀结果区域旁，防止误改关键数值
              闭合（默认）：对应参数只读；点击打开后可修改，离开界面重新进入后自动恢复锁定
          - id: S1D24
            name: 加工起始角.C
            range: 0~360
            unit: °
            var: TOOL_SET[5]
            ac: 4
            text: |
              对刀完成后自动计算的 C 轴磨削起始角，保证砂轮准确进入螺旋槽
              一般无需手动修改；偏刀补偿会自动修正此值
          - id: S1D25
            name: 当前接触.X
            range: 无
            unit: mm
            var: PROCESS[5]
            ac: 4
            text: |
              当前砂轮进入工件的磨削位置，每次进刀后自动更新
              单件调整模式下，启动程序从此位置继续加工
          - id: S1D26
            name: 初始接触.X
            range: 无
            unit: mm
            var: PROCESS[14]
            ac: 4
            text: |
              对刀完成时记录的砂轮与工件初始接触位置
              批量生产模式下，每次启动程序从此位置开始；修整砂轮后程序按修整量自动补偿此值
          - id: S1D27
            name: 是否是批量中的首件工件
            range: 首件工件/不是首件
            var: TOOL_SET[58]
            ac: 4
            text: |
              用于批量生产中每件都需手动对刀、又要保持尺寸一致的情况
              **首件工件**：对刀后重新计算初始接触.X 和加工起始角.C
              **不是首件**：对刀只重新计算起始角，初始接触.X 保留首件的值，保证批量尺寸一致
  - h3: 对刀设置
    marks: [ifIsExternal]
    body:
      - params:
          - id: S1D5
            marks: [ifIsHasReOperate]
            name: 对刀类型
            range: 首次对刀/二次对刀
            var: TOOL_SET[9]
            ac: 4
            text: |
              **首次对刀**：新工件或新砂轮，砂轮先到对刀起始位，再用手轮进入螺纹完成对刀
              **二次对刀**：工件已磨过一次（如粗磨后重新装夹），砂轮直接开进已有螺纹槽，只需手轮微调
              程序在首次对刀完成后自动切换为二次对刀
          - id: S1D6
            name: 对刀位置
            range: 起点对刀/中点对刀/任意点
            var: TOOL_SET[20]
            ac: 4
            text: |
              选择手动对刀时砂轮进入螺纹的 Z 向位置
              **起点对刀**：在磨削起始端对刀
              **中点对刀**：在工件左右端中点对刀，适合长工件减小累积误差
              **任意点**：在下方位置参数输入的 Z 坐标对刀，用于避开缺牙、台阶等位置
          - id: S1D7
            name: 位置（任意点对刀位）
            range: 工件左右端之间
            unit: mm
            var: INI[135]
            ac: 4
            text: |
              对刀位置选择任意点时才可输入。手动将砂轮移到希望对刀的位置，记录当前 Z 轴坐标
  - h3: 磨削类型选择
    body:
      - params:
          - id: S1D57
            marks: [ifIsInternal]
            name: 磨削类型（机型）
            range: 外螺纹/内螺纹/蜗杆/外圆/环形槽
            var: GRIND[1]
            ac: 4
            text: |
              显示当前程序的磨削类型，由机床配置生成，一般无需修改
          - id: S1D31
            name: 磨削类型
            range: 螺纹/环形槽
            var: RING[1]
            ac: 4
            text: |
              选择环形槽后自动跳转到环形槽参数界面，磨削时按环形槽方式逐槽加工
              此选项需在机床配置中开启环形槽功能后才可切换
          - id: S1D32
            marks: [ifIsScrewTap]
            name: 丝锥磨削
            range: 否/是
            var: SCREW_TAP[1]
            ac: 4
            text: |
              选择是后跳转到丝锥参数界面，按丝锥方式（含 B 轴铲背）磨削；磨普通螺纹选择否
  - h3: 环形槽参数界面
    body:
      - img: {src: grind_ring.png, h: 300}
      - note: |
          磨削类型选择环形槽后自动进入本界面。左侧为当前加工状态（只读）：环形槽数、需加工槽数、已加工槽数、当前槽起始 Z/X 及当前 X
          环形槽按最多 4 组设置，每组内为等距同参数的槽，程序由首槽位置及各组参数自动推算每个槽的 Z/X 位置
      - params:
          - id: S1D43
            name: 起始磨削槽
            rec: "1"
            range: ≥ 1
            var: RING[3]
            ac: 4
            text: |
              从第几个槽开始磨削（从磨削起始端数起）。新工件设为 1，只补磨部分槽时设为需补磨的第一个槽号
          - id: S1D44
            name: 终止磨削槽
            range: ≥ 起始磨削槽
            var: RING[4]
            ac: 4
            text: |
              磨削到第几个槽结束。需加工槽数 = 终止磨削槽 - 起始磨削槽 + 1
          - id: S1D45
            name: 首槽起始.Z
            range: 无
            unit: mm
            var: INI[3]
            ac: 4
            text: |
              第一个槽的 Z 向磨削位置，手动将砂轮对准第一个槽中心后记录 Z 坐标
          - id: S1D46
            name: 首槽起始.X
            range: 无
            unit: mm
            var: PROCESS[14]
            ac: 4
            text: |
              第一个槽的 X 向初始磨削接触位置，手动将砂轮接触第一个槽后记录 X 坐标；其余槽按垂直偏移与槽升量推算
          - id: S1D48
            name: 槽数（第一组~第四组）
            range: ≥ 0
            var: RING[12]、RING[22]、RING[32]、RING[42]
            ac: 4
            text: |
              每组内的槽个数，不用的组设为 0
          - id: S1D47
            name: 槽距 / 槽升量（第一组~第四组）
            range: 槽距大于 0
            unit: mm
            var: 槽距 RING[11]、RING[21]、RING[31]、RING[41]；槽升量 TECHNOLOGY[165]~TECHNOLOGY[168]
            ac: 4
            text: |
              **槽距**：该组相邻两槽的 Z 向间距
              **槽升量**：该组相邻两槽的 X 向（半径）递增量，用于槽底直径逐槽变化的工件，等径槽输入 0
          - id: S1D49
            name: 组水平偏移（第一组~第四组）
            range: 无
            unit: mm
            var: RING[13]、RING[23]、RING[33]、RING[43]
            ac: 4
            text: |
              该组第一个槽相对上一组最后一个槽额外的 Z 向偏移量，用于组与组之间的间距与组内螺距不同的情况
          - id: S1D50
            name: 组垂直偏移（第一组~第四组）
            range: 无
            unit: mm
            var: RING[14]、RING[24]、RING[34]、RING[44]
            ac: 4
            text: |
              该组第一个槽相对上一组最后一个槽额外的 X 向偏移量，用于不同组槽底直径不同的情况
  - h3: 丝锥参数界面
    marks: [ifIsScrewTap]
    body:
      - img: {src: grind_tap.png, h: 300}
      - note: |
          丝锥磨削选择是后进入本界面，右侧工件参数与磨削主界面相同；丝锥磨削时 B 轴（铲背轴）与 C 轴按槽数同步运动磨出铲背
      - params:
          - id: S1D33
            name: 槽数
            range: ≥ 1
            var: SCREW_TAP[2]
            ac: 4
            text: |
              丝锥容屑槽数量，常见 3 槽、4 槽，按图纸设置
          - id: S1D34
            name: 槽类型
            range: 直槽/螺旋槽
            var: SCREW_TAP[3]
            ac: 4
            text: |
              按图纸设置。螺旋槽时需继续设置螺旋槽旋向和螺旋槽升角，程序据此修正 B 轴铲背节奏
          - id: S1D35
            name: 螺旋槽旋向
            range: 右旋/左旋
            var: SCREW_TAP[4]
            ac: 4
            text: |
              容屑槽的螺旋方向，直槽无需设置。与螺纹旋向相同或相反时，铲背等效槽数计算方式不同
          - id: S1D36
            name: 螺旋槽升角
            range: 0~90
            unit: °
            var: SCREW_TAP[5]
            ac: 4
            text: |
              容屑槽螺旋角，按图纸设置，直槽无需设置
          - id: S1D39
            name: 跳齿
            range: 关/开
            var: SCREW_TAP[7]
            ac: 4
            text: |
              磨削跳齿丝锥（隔齿磨削）时打开，并设置下方两项跳齿调整参数
          - id: S1D40
            name: 跳齿C轴调整
            rec: 按磨削结果调整
            range: -360~360
            unit: °
            var: SCREW_TAP[8]
            ac: 4
            text: |
              跳齿磨削时 C 轴起始角的修正量，同时按比例修正 B 轴起始角；铲背位置或切削起点不对时调整
          - id: S1D41
            name: 跳齿角度调整
            rec: 按磨削结果调整
            range: -360~360
            unit: °
            var: SCREW_TAP[9]
            ac: 4
            text: |
              跳齿时每个槽的磨削角度修正量；需保留的齿被磨到时调整此值使保留齿完整
          - id: S1D42
            name: 加工起始角.B
            range: 0~360
            unit: °
            var: SCREW_TAP[6]
            ac: 4
            text: |
              开始磨削时 B 轴（铲背）起始角度，调整此值可改变铲背相对切削刃的位置
              偏刀补偿也会按比例自动修正此值
          - id: S1D58
            name: 粗磨设置
            range: 粗磨铲磨/粗磨不铲磨
            var: TECHNOLOGY[175]
            ac: 4
            text: |
              **粗磨铲磨**：粗磨工序也带 B 轴铲背运动
              **粗磨不铲磨**：不跳齿时粗磨按普通螺纹方式磨削，只在后续工序铲背，可提高粗磨效率
  - h3: 螺距变换界面
    body:
      - img: {src: grind_pitch.png, h: 300}
      - note: |
          用于中间有一段螺距与两端不同的工件。在机床配置中开启螺距变换后，磨削主界面右侧出现 **螺距变换** 软键
          磨削从起点到坐标变换位1 使用正常螺距，坐标变换位1 到 坐标变换位2 使用螺距变换值，坐标变换位2 到终点恢复正常螺距
      - params:
          - id: S1D60
            name: 变螺距
            range: 关/开
            var: TOOL_SET[60]
            ac: 4
            text: |
              打开后磨削按变螺距方式运行；变换位置设置不合理（不在磨削起终点之间或顺序颠倒）时程序报警停止
          - id: S1D61
            name: 平滑轨迹
            range: 关/开
            var: TECHNOLOGY[302]
            ac: 4
            text: |
              打开后各段螺距衔接处按平滑曲线过渡，避免螺距突变处冲击
              第一次对位置、确认变换位置时建议关闭，便于观察实际变换点
          - id: S1D62
            name: 螺距变换值
            range: 0~100
            unit: mm
            var: TOOL_SET[67]
            ac: 4
            text: |
              变换段（坐标变换位1 与 2 之间）的螺距
          - id: S1D63
            name: 变螺距模式
            range: 给定角度/终点变换
            var: TOOL_SET[61]
            ac: 4
            text: |
              **给定角度**：输入变换段对应的 C 轴旋转角度，坐标变换位2 由坐标变换位1、变换螺距和角度自动推算
              **终点变换**：从坐标变换位1 起一直到磨削终点都使用变换螺距
          - id: S1D64
            name: 变螺距角度
            range: ≥ 0
            unit: °
            var: TOOL_SET[68]
            ac: 4
            text: |
              给定角度模式下，变换段对应的 C 轴旋转角度
          - id: S1D65
            name: 坐标变换位1 / 坐标变换位2
            range: 在磨削起点与终点之间
            unit: mm
            var: TOOL_SET[65] / TOOL_SET[66]
            ac: 4
            text: |
              变换段起点和终点的 Z 坐标。坐标变换位1 手动输入（砂轮对准螺距开始变化处记录 Z 坐标）
              坐标变换位2 由变螺距模式自动计算，只读显示
  - h3: 多螺距变换界面
    body:
      - img: {src: grind_multipitch.png, h: 300}
      - note: |
          用于中间连续多段螺距不同的工件，在机床配置中将螺距变换设为多段模式后，点击右侧 **螺距变换** 软键进入本界面
          从位置1 开始依次为 5 段变换段，每段按该段螺距和该段 C 轴角度推算下一段起点：位置(n+1) = 位置n ∓ 螺距n × 角度n / 360
      - params:
          - id: S1D66
            name: 位置1~位置6
            range: 在磨削起点与终点之间
            unit: mm
            var: TOOL_SET[65]、TECHNOLOGY[418]~TECHNOLOGY[421]、TOOL_SET[66]
            ac: 4
            text: |
              位置1 为第一段变换起点 Z 坐标，手动输入；位置2~位置6 根据各段螺距与角度自动计算，只读显示
          - id: S1D67
            name: 各段角度
            range: ≥ 0
            unit: °
            var: TECHNOLOGY[422]~TECHNOLOGY[426]
            ac: 4
            text: |
              每段变换段对应的 C 轴旋转角度
          - id: S1D68
            name: 各段螺距
            range: 大于 0
            unit: mm
            var: TECHNOLOGY[427]~TECHNOLOGY[431]
            ac: 4
            text: |
              每段变换段的螺距；不需要的段可将角度设为 0
  - h3: 自磨夹具界面
    marks: [ifIsInternal]
    body:
      - img: {src: grind_fixture.png, h: 300}
      - note: |
          用于内螺纹机床用本机砂轮磨削（修正）夹具定位面。在机床配置中开启后，磨削主界面出现 **自磨夹具** 软键
          打开自磨夹具后启动程序，执行夹具磨削和夹具专用砂轮修整，不进行螺纹磨削；完成后务必关闭
      - params:
          - id: S1D70
            name: 自磨夹具
            range: 关/开
            var: INI[69]
            ac: 4
            text: |
              打开后启动程序执行夹具磨削流程
          - id: S1D71
            name: 安全起始位.Z
            range: 无
            unit: mm
            var: INI[90]
            ac: 4
            text: |
              夹具磨削和夹具修整开始前 Z 轴先运动到的安全位置，须保证 X 轴移动不干涉
          - id: S1D72
            name: 左端坐标.Z / 右端坐标.Z
            range: 无
            unit: mm
            var: DRESSER[61] / DRESSER[62]
            ac: 4
            text: |
              砂轮在夹具磨削面左、右两端的 Z 坐标，磨削时 Z 轴在两端之间往复
          - id: S1D73
            name: 当前接触.X（夹具磨削）
            range: 无
            unit: mm
            var: DRESSER[63]
            ac: 4
            text: |
              砂轮接触夹具磨削面的 X 坐标，每次进刀后自动累加
          - id: S1D74
            name: 磨削次数 / 进刀量
            range: 磨削次数 ≥ 1
            unit: 进刀量 mm
            var: DRESSER[54] / DRESSER[70]
            ac: 4
            text: |
              夹具磨削往复次数及每次 X 向进刀量
          - id: S1D75
            name: 磨削速度 / 头架转速 / 停留时间 / 砂轮转速
            range: 无
            var: PROCESS[40] / TECHNOLOGY[232] / DRESSER[53] / DRESSER[119]
            ac: 4
            text: |
              **磨削速度**：Z 轴往复速度（mm/min）
              **头架转速**：夹具磨削时头架旋转速度（r/min）
              **停留时间**：每次到达端点后的停留时间（s）
              **砂轮转速**：夹具磨削时砂轮转速（r/min）
          - id: S1D76
            name: 修整左端.W / 修整右端.W / 修整角度.C
            range: 无
            var: DRESSER[64] / DRESSER[65] / INI[68]
            ac: 4
            text: |
              夹具磨削前修整砂轮时，修整器水平轴往复的左、右端坐标及头架修整器所在的 C 轴角度
          - id: S1D77
            name: 当前接触.X（夹具修整）/ 修整次数 / 进刀量
            range: 无
            var: DRESSER[66] / DRESSER[67] / DRESSER[68]
            ac: 4
            text: |
              砂轮接触修整器的 X 坐标、修整次数及每次修整进刀量
          - id: S1D78
            name: 修整速度 / 砂轮转速 / 修整轮转速
            range: 无
            var: PROCESS[37] / DRESSER[117] / DRESSER[118]
            ac: 4
            text: |
              夹具修整时修整轴移动速度、砂轮转速和修整轮转速；修整轮转速为 0 时不启动修整轮
  - h3: 反向孔倒角界面
    body:
      - img: {src: grind_chamfer.png, h: 300}
      - note: |
          用于滚珠螺母类内螺纹：螺纹与反向器孔相交处磨削时按设定位置让刀，形成倒角，避免锐边。在机床配置中开启后磨削主界面出现 **反向孔倒角** 软键
          每个倒角：X 轴在倒入过渡角.C 范围内斜向退出到倒角深度.X，保持平移角度.C 后再斜向回到螺纹
      - params:
          - id: S1D80
            name: 倒角使能
            range: 关/开
            var: INI[83]
            ac: 4
            text: |
              打开后螺纹磨削按倒角位置自动让刀
          - id: S1D81
            name: 精磨不倒角
            range: 关/开
            var: INI[111]
            ac: 4
            text: |
              打开后精磨、终磨工序不再执行倒角让刀，仅粗磨及之前工序倒角
          - id: S1D82
            name: 补偿.X（倒角终点补偿模式）
            range: 直接/渐变
            var: TECHNOLOGY[293]
            ac: 4
            text: |
              倒角终点 X 向补偿的作用方式
              **直接**：倒角结束后立即叠加补偿量
              **渐变**：从本倒角结束到下一倒角开始之间逐渐过渡到补偿量
          - id: S1D83
            name: 平滑轨迹
            range: 关/开
            var: TOOL_SET[18]
            ac: 4
            text: |
              打开后倒角让刀路径按平滑曲线过渡；第一次确认倒角位置时建议关闭
          - id: S1D84
            name: 倒入过渡角.C / 倒角深度.X / 平移角度.C
            range: 倒入过渡角 ≥ 0，平移角度 ≥ 2
            var: R241 / R242 / R243
            ac: 4
            text: |
              **倒入过渡角.C**：倒角斜面对应的 C 轴转角，角度越大倒角斜面越缓
              **倒角深度.X**：倒角处 X 向让刀深度
              **平移角度.C**：保持倒角深度不变的 C 轴转角（倒角底部平台长度）
          - id: S1D85
            name: 预倒角角度 / 预倒角深度
            range: 预倒角角度 ≥ 0
            var: TECHNOLOGY[238] / TECHNOLOGY[239]
            ac: 4
            text: |
              倒角两端额外预倒角的 C 轴角度和 X 深度，用于倒角入口和出口的过渡
          - id: S1D86
            name: 模式设置
            range: 手动输入/自动计算/自动探测
            var: INI[23]
            ac: 4
            text: |
              **手动输入**：每个倒角的 Z 坐标在左侧 1.Z~20.Z 中逐一输入
              **自动计算**：只输入第 1 个倒角位置，后续位置按反向孔个数、孔间距和第二滚道补偿自动计算
              ?ifIsAuto: **自动探测**：由自动对刀测头探测基准孔位置后自动计算全部倒角位置
          - id: S1D87
            name: 反向孔类型
            range: 双滚道/单滚道
            var: TECHNOLOGY[387]
            ac: 4
            text: |
              **双滚道**：每个反向孔对应两条相邻滚道（相差一圈）各一个倒角，孔间距相等
              **单滚道**：每孔一个倒角，各孔间距在下方倒角间距.Z 中逐个输入（最多 24 个）
          - id: S1D88
            name: 反向孔个数 / 反向孔间距.Z
            range: 个数 1~12
            unit: 间距 mm
            var: INI[45] / INI[46]
            ac: 4
            text: |
              自动计算时使用：反向孔数量及相邻两孔 Z 向中心距
          - id: S1D89
            name: 当前第二滚道补偿.Z
            range: 无
            unit: mm
            var: TOOL_SET[8]
            readonly: true
            text: |
              双滚道时第二个倒角相对第一个倒角（相差一圈）的 Z 向补偿量，按当前砂轮直径自动计算：
              补偿 = 补偿基准值.Z + (当前砂轮直径 - 补偿最小基准直径) × 补偿每毫米偏移.Z（砂轮直径不大于基准直径时取基准值）
          - id: S1D90
            name: 补偿最小基准直径 / 补偿基准值.Z / 补偿每毫米偏移.Z
            range: 每毫米偏移 -0.5~0.5
            var: TECHNOLOGY[68] / TECHNOLOGY[69] / TECHNOLOGY[70]
            ac: 4
            text: |
              用于计算第二滚道补偿：砂轮直径变化会改变砂轮与倒角的接触位置，按每毫米直径偏移量线性修正
          - id: S1D91
            name: 测量基准孔-右侧 / 位置补偿.Z
            range: 基准孔 1~10
            var: INI[84] / INI[47]
            ac: 4
            text: |
              **测量基准孔-右侧**：自动探测时测量的是从右侧数第几个反向孔
              **位置补偿.Z**：第一个倒角位置的 Z 向微调量
          - id: S1D92
            name: 倒角个数 / 1.Z~20.Z
            range: 倒角个数 1~24
            unit: mm
            var: R240 / R244~R263
            ac: 4
            text: |
              倒角数量及每个倒角起点的 Z 坐标；手动输入模式下逐一输入，自动模式下由程序计算填写
          - id: S1D93
            name: 倒角间距.Z（单滚道）
            range: 0~100
            unit: mm
            var: TECHNOLOGY[393]~TECHNOLOGY[411]
            ac: 4
            text: |
              单滚道不等距时相邻两个倒角之间的 Z 向距离
          - id: S1D94
            name: 倒角终点补偿.X
            range: -0.1~0.1
            unit: mm
            var: TECHNOLOGY[272]~TECHNOLOGY[291]
            ac: 4
            text: |
              第 1~20 个倒角结束后 X 向补偿量，用于修正倒角两侧螺纹尺寸差异，作用方式由补偿.X 选择
  - h3: 空运行界面
    body:
      - img: {src: grind_dryrun.png, h: 300}
      - note: |
          用于开机热机：机床按设定范围空载往复运行，使主轴、导轨温度稳定。在机床配置中开启后磨削主界面出现 **空运行** 软键
      - params:
          - id: S1D100
            name: 空运行使能
            range: 关/开
            var: GRIND[10]
            ac: 7
            text: |
              打开后启动程序执行空运行热机，不进行磨削；热机结束务必关闭
          - id: S1D101
            marks: [ifIsInternal]
            name: 自动卡爪
            range: 关/开
            var: TECHNOLOGY[35]
            ac: 4
            text: |
              空运行期间卡盘是否自动松开/夹紧动作，用于同时预热液压卡盘
          - id: S1D102
            name: 自动开冷却
            range: 关/开
            var: TECHNOLOGY[67]
            ac: 4
            text: |
              空运行期间是否自动打开冷却液
          - id: S1D103
            name: 正向初始.Z / 负向终止.Z
            range: 无
            unit: mm
            var: TECHNOLOGY[36] / TECHNOLOGY[39]
            ac: 4
            text: |
              空运行时 Z 轴往复的起点与终点，Z 轴运动时 C 轴同步旋转
          - id: S1D104
            name: 负向初始.X / 正向终止.X
            range: 无
            unit: mm
            var: TECHNOLOGY[40] / TECHNOLOGY[49]
            ac: 4
            text: |
              空运行时 X 轴往复的后方起点与前方终点，须保证不碰工件和夹具
          - id: S1D105
            name: 砂轮转速 / 运行速度
            range: ≥ 0
            var: TECHNOLOGY[50] / TECHNOLOGY[55]
            ac: 4
            text: |
              空运行时砂轮转速（r/min）及各轴往复速度（mm/min）
  - h3: 变径磨削界面
    body:
      - img: {src: grind_diachange.png, h: 300}
      - note: |
          用于螺纹两端需要逐渐减小牙深（收尾）的工件：两端按设定角度范围让刀，形成过渡。在机床配置中开启后磨削主界面出现 **变径磨削** 软键
          每端依次为 无效牙段 → 过渡段（逐渐进刀到正常深度）→ 正常螺纹段
      - params:
          - id: S1D110
            name: 变径磨削使能
            range: 关/开
            var: TECHNOLOGY[110]
            ac: 7
            text: |
              打开后螺纹两端按下方参数变径磨削
          - id: S1D111
            name: 平滑轨迹
            range: 关/开
            var: TECHNOLOGY[301]
            ac: 4
            text: |
              打开后变径段按平滑曲线过渡；第一次确认变径位置时建议关闭
          - id: S1D112
            name: 无效牙位置
            range: 平顺加工/等大加工
            var: TECHNOLOGY[155]
            ac: 7
            text: |
              端部无效牙段的处理方式
              **平顺加工**：无效牙段保持变径后的退让量
              **等大加工**：无效牙段按正常螺纹深度磨削
          - id: S1D113
            name: 右侧/左侧无效牙角度
            range: ≥ 0
            unit: °
            var: TECHNOLOGY[139] / TECHNOLOGY[140]
            ac: 4
            text: |
              螺纹右端、左端无效牙段对应的 C 轴转角，Z 向长度 = 角度 / 360 × 导程
          - id: S1D114
            name: 右侧/左侧变径量
            range: -2~2
            unit: mm
            var: TECHNOLOGY[115] / TECHNOLOGY[117]
            ac: 4
            text: |
              端部相对正常螺纹的 X 向让刀量，正值表示向后退刀（牙变浅）
          - id: S1D115
            name: 右侧/左侧过渡角度
            range: ≥ 0
            unit: °
            var: TECHNOLOGY[116] / TECHNOLOGY[118]
            ac: 4
            text: |
              从变径量过渡到正常深度所对应的 C 轴转角，角度越大过渡越平缓
          - id: S1D116
            name: 磨削模式
            range: 螺纹+变径/单独变径
            var: TECHNOLOGY[379]
            ac: 4
            text: |
              **螺纹+变径**：每刀都按变径轨迹磨削整条螺纹
              **单独变径**：先完成正常螺纹磨削，再单独磨削两端变径段
          - id: S1D117
            name: 变径磨削次数
            range: 1~100
            var: TECHNOLOGY[380]
            ac: 4
            text: |
              单独变径模式下变径段的磨削次数
  - h3: 分段补偿界面
    body:
      - img: {src: grind_segcomp.png, h: 300}
      - note: |
          用于长螺纹按检测结果对不同区段分别补偿中径和导程。在机床配置中开启后磨削主界面出现 **分段补偿** 软键
          工件从右端到左端最多分为 10 段，界面中工件右端.Z/左端.Z 只读显示磨削范围
      - params:
          - id: S1D120
            name: 分段补偿使能
            range: 关/开
            var: TECHNOLOGY[311]
            ac: 7
            text: |
              打开后磨削按分段补偿轨迹运行（手动对刀时不生效）
          - id: S1D121
            name: 补偿分段数
            range: 0~10
            var: TECHNOLOGY[312]
            ac: 7
            text: |
              整个磨削长度分为几段
          - id: S1D122
            name: 补偿段.Z
            range: 在工件左右端之间
            unit: mm
            var: TECHNOLOGY[333]~TECHNOLOGY[341]
            ac: 4
            text: |
              第 n 段与第 n+1 段分界处的 Z 坐标（从右端起），最后一段终点为工件左端，因此只需输入 分段数 - 1 个分界
          - id: S1D123
            name: 补偿段中径补偿量
            range: 无
            unit: mm
            var: TECHNOLOGY[313]~TECHNOLOGY[322]
            ac: 4
            text: |
              第 n 段终点相对磨削起点的 X 向（半径）累计补偿量，段内线性过渡
          - id: S1D124
            name: 补偿段导程补偿量
            range: 无
            unit: mm
            var: TECHNOLOGY[323]~TECHNOLOGY[332]
            ac: 4
            text: |
              第 n 段的导程修正量，正值使该段实际导程增大，负值减小
