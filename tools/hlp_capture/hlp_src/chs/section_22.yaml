title: 外圆端面对刀
head1: 机床功能介绍
refs: |
  具体参数设置请参考[外圆参数](section_26.html)、[端面参数](section_27.html)、[自动对刀界面](section_5.html)
blocks:
  - h3: 外圆手动对刀
    body:
      - steps:
          - 装夹工件，确认工件跳动在允许范围内
          - 手动移动机床，使外圆砂轮接近工件外径（留约 0.05mm 间隙）
          - "?ifIsHasU: 记录当前 U 坐标到外圆参数界面的 **初始磨削接触**"
          - "?ifIsNotHasU: 记录当前 X 坐标到外圆参数界面的 **初始磨削接触**"
      - note: |
          尽量让初始磨削接触与实际接触点留 0.05mm 左右间隙
  - h3: 端面手动对刀
    body:
      - steps:
          - 装夹工件，确认工件跳动在允许范围内
          - 手动移动机床，使砂轮接近工件左端面（或右端面），留约 0.05mm 间隙
          - 记录当前 Z 坐标到端面参数界面的 **左端面 / 右端面初始磨削接触**
  - h3: 自动对刀（工件测量）
    marks: [ifIsAuto]
    body:
      - steps:
          - t: 进入自动对刀界面，标定 **测量水平距** 和 **测头中心位**
            img: {src: auto_center.png, h: 300}
          - 按工件尺寸设置工件位置及测头半径
          - 伸出测头，手动使测头接触工件右端面，把接触坐标和合适角度输入界面
          - 设置测量阈值：测得的右端面位置与设置值之差超过阈值时报警
          - 需要测量外圆跳动或左端面时，在自动对刀界面右侧点亮 **外圆跳动** / **左端测量**（同时会点亮右端测量），并设置跳动阈值、左端测量角、左端面耳高和左端测量设置
          - 点亮自动对刀键启动，按所选项目测量：内滚道方式先测螺纹槽，再测右端面、外圆跳动、左端面；测头方式依次测右端面、外圆跳动、反向孔、左端面（外圆跳动和左端测量只在测量反向孔模式下执行）；完成后自动进入加工，加工内容为加工选择界面选中的工序
      - note: |
          自动测量外圆和端面后，外圆和端面的实际磨削位置仍以各自界面的初始磨削接触为准
