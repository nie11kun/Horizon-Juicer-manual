title: 欢迎页与界面导航
head1: HMI界面参数定义
refs: '按操作面板上的 **CUSTOM** 键进入机床专用界面，首先显示欢迎页

  '
blocks:
- h3: 欢迎页
  body:
  - img:
      src: welcome_main.png
      h: 300
  - note: '欢迎页显示机床型号与名称。右侧软键：

      **出厂信息**：查看机床型号、出厂编号和服务联系方式

      **备份恢复**：参数备份与恢复（需用户口令，机床配置中开启后显示）

      **配件寿命**：配件使用次数管理（机床配置中开启后显示）

      **加工统计**：砂轮加工数量统计（钥匙开关 3 档，机床配置中开启后显示）

      最下方 ▷ 软键切换到扩展菜单（**机床配置**，需用户口令），再按一次返回

      屏幕下方 **用户界面** 软键进入磨削参数等加工界面

      '
- h3: 用户界面导航
  body:
  - img:
      src: grind_main_int.png
      h: 300
  - note: '用户界面底部的水平软键切换各参数页面：

      **磨削参数**：工件与位置参数、补偿，及空运行/分段补偿/螺距变换等扩展功能

      **工艺参数**：粗磨、半精磨、精磨、终磨工艺表

      **修整参数**：砂轮修整参数，及齿形、修整轮参数

      ?ifIsAuto: **自动对刀**：自动对刀测量参数

      ?ifIsCenter: **外圆参数 / 端面参数 / 加工选择**：磨削中心的外圆、端面磨削和工序选择

      **返回**：回到欢迎页

      各页面中选中参数后按操作面板上的 **HELP** 键，可直接打开该参数的帮助说明

      '
- h3: 操作权限
  body:
  - note: '参数修改受系统访问权限控制，权限不足时参数只能查看不能修改：

      **钥匙开关 0 档**：中径补偿、偏刀补偿、全长补偿等日常调整参数

      **钥匙开关 3 档**：工件、工艺、修整、对刀等大部分加工参数，以及加工统计

      **用户口令**：备份恢复、机床配置入口

      **制造商口令**：机床配置中的全部项目

      每个参数的修改权限见其帮助说明中的"修改权限"

      '
- h3: 出厂信息
  body:
  - img:
      src: info.png
      h: 300
  - params:
    - id: S9D1
      name: 出厂编号
      range: 由制造商设置
      ac: 3
      text: '机床的出厂编号，与铭牌一致，报修或咨询时请提供此编号与机床型号

        '
      var: INI[131]
