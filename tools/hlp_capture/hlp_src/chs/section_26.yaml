title: 外圆参数
head1: HMI界面参数定义
blocks:
- h3: 磨削参数
  body:
  - img:
      src: center_od_grind.png
      h: 300
  - params:
    - id: S26D1
      name: 安全位置.X（外圆退刀位）
      rec: 外圆轴向后极限位
      range: 无
      text: '此参数影响加工内磨时外圆砂轮停留安全位置

        推荐将此参数设置到向后极限位置，保证机床安全运行

        '
    - id: S26D2
      name: 安全位置.Z（台面磨削起始位）
      rec: 工件离开外圆砂轮后Z坐标
      range: 无
      text: '此参数影响加工完成后台面停留位置

        推荐将此参数设置到保证工件离开外圆砂轮

        '
    - id: S26D3
      name: 加工模式
      rec: 根据需要
      range: 单件调整/批量生产
      text: '此参数影响磨削时起刀位置

        **单件调整**：启动程序后从**当前**磨削位置开始加工，适合调试或单件修磨

        **批量生产**：启动程序后从**初始**磨削位置开始加工，适合连续加工同一批工件

        '
    - id: S26D4
      name: 磨削起点
      rec: 自动计算
      range: 无
      text: '根据端面参数界面的左端面初始接触自动计算，只读

        磨削起点 = 左端面初始接触 + 0.1mm + 退刀槽长度

        外圆每次在此位置进刀，来回拉磨时也回到此位置

        '
    - id: S26D5
      name: 磨削终点
      rec: 自动计算
      range: 无
      text: '根据端面参数界面的右端面初始接触自动计算，只读

        磨削终点 = 右端面初始接触 + 0.1mm

        实际拉磨时终点再减去本页的 **终点补偿**

        '
    - id: S26D6
      name: 退刀槽长度
      rec: 根据工件
      range: 大于零
      text: '根据工件左端面与外圆根部退刀槽长度设置

        外圆磨削起点自动让开退刀槽长度，砂轮在退刀槽以外进刀，来回拉磨的范围不包含退刀槽

        这样可以避免砂轮尖角在退刀槽处进刀磨损，使加工出的外圆出现条纹

        '
    - id: S26D8
      var: PROCESS[47]
      name: 外圆初始磨削接触
      rec: 手动测量后输入
      range: 无
      ac: 4
      text: '外圆砂轮开始磨削工件外圆的位置。手动对刀时使砂轮接近工件外圆，留约 0.05mm 间隙，记录此时坐标输入

        批量生产模式下每个工件从此位置开始进刀；外圆砂轮修整后程序按修整量自动补偿此值

        '
    - id: S26D9
      var: PROCESS[21]
      name: 外圆当前磨削接触
      rec: 自动累计
      range: 无
      ac: 4
      text: '外圆砂轮当前的磨削位置，每次进刀后自动更新

        单件调整模式下启动程序从此位置继续磨削；端面磨削起点、终点和台阶磨削位置都以它为基准计算

        '
    - id: S26D50
      name: 磨削尺寸补偿
      rec: 根据测量结果微调
      range: -1.0~1.0
      unit: mm
      ac: 7
      text: '加工后测量尺寸与目标不符时，直接输入差值修正，无需修改工艺进给

        **外圆**：输入直径方向差值，下次外圆磨削开始时把一半叠加到外圆初始和当前磨削接触上；正值少磨、外径变大，负值多磨

        **左端面 / 右端面**：输入 Z 向差值，下次端面磨削开始时叠加到对应端面的初始和当前磨削接触上

        为单次补偿，叠加后自动清零

        '
    - id: S26D51
      name: 在线测量
      range: 关/开
      ac: 4
      text: '机床配置开启外圆在线测量模块后显示。打开后外圆磨削过程中由在线量仪实时测量外径，到达目标尺寸后自动结束磨削

        '
      var: TECHNOLOGY[296]
- h3: 工艺参数
  body:
  - img:
      src: center_od_process.png
      h: 300
  - params:
    - id: S26D52
      name: 累计磨削总量 / 设定磨削总量
      range: 只读
      unit: mm
      readonly: true
      text: '**设定磨削总量**：按外圆工艺表各工序 循环次数 × 进给深度 累加得到的总磨削量

        **累计磨削总量**：当前工件已实际磨去的量

        机床配置开启 **粗磨量自动计算** 后，输入设定磨削总量，粗磨进给深度按总量自动反算

        '
      var: PROCESS[59]、PROCESS[115]
    - id: S26D10
      name: 已加工
      rec: '0'
      range: 大于零
      text: '此参数为自动累计值

        每在批量加工模式下完成一次磨削程序，此参数自动累加一次

        '
    - id: S26D11
      name: 修整设定
      rec: '0'
      range: 根据工艺要求
      text: '此参数设定为每磨削几件修整一次砂轮

        通过设定此参数可以实现加工多件工件后自动修整一次砂轮的功能

        注意：修整时调用修整界面精修参数(次数/修整量/速度)

        '
    - id: S26D12
      name: 循环次数
      rec: 无
      range: 大于零
      text: '根据工件磨削余量控制

        '
    - id: S26D13
      name: 进给深度
      rec: 0.005~0.05
      range: 大于零
      text: '根据磨削工艺要求，合理分配粗磨精磨进刀量，一般粗磨大进刀量去余量，精磨小进刀量光刀

        '
    - id: S26D14
      name: 磨削速度
      rec: '100'
      range: 大于零
      text: '砂轮从磨削起点到终点移动时的速度

        '
    - id: S26D15
      name: 修整设定
      rec: 无
      range: 大于零
      text: '当前工艺磨削循环次数到达修整设定次数后进行一次修整

        注意：修整时调用修整界面精修参数(次数/修整量/速度)

        '
    - id: S26D16
      name: 砂轮线速度
      rec: 30m/s
      range: 15~50
      text: '砂轮磨削线速度根据砂轮材质及工件材质不同变化较大

        具体设置方案请进行测试后设置

        机床配置开启 **恒转速模式** 后此值只读，改为直接输入砂轮转速

        '
    - id: S26D17
      name: 头架转速
      rec: '120'
      range: 按工艺设置
      unit: r/min
      text: '外圆、台阶磨削时的头架转速，影响表面粗糙度和磨削效率，一般 120 r/min 左右，按实际加工效果调整

        '
    - id: S26D39
      var: INI[31]
      name: 外圆长度
      rec: 根据工件实际设置
      range: 大于零
      text: '测量工件外圆部分长度，磨削方式为保持时此参数影响分段磨削每段长度

        '
    - id: S26D40
      name: 保持分段
      rec: 无
      range: 1~10
      text: '外圆保持磨削时，如果砂轮宽度小于工件外圆长度，需要进行分段磨削

        推荐分段磨削时，保证每段的宽度小于砂轮宽度

        当不需要分段时设为：1

        '
- h3: 修整参数
  body:
  - img:
      src: center_od_dress.png
      h: 300
  - params:
    - id: S26D18
      name: 累计修整量
      rec: 无
      range: 无
      text: '记录当前砂轮半径方向已修整掉多少

        '
    - id: S26D19
      name: 锥度微调
      rec: '0'
      range: 0~0.02
      text: '加工的工件经过测量后，如果外圆有轻微锥度的话，可以通过此参数将砂轮稍微修出斜面来调整

        注意此参数只能作为微调使用，不可过大调整，以免加工出的工件表面有条纹

        '
    - id: S26D20
      name: 砂轮状态
      rec: 无
      range: 新砂轮/旧砂轮
      text: '当更换新砂轮时，切换到新砂轮。还需设置正确新砂轮直径及初始修整位置

        '
    - id: S26D21
      name: 粗修次数
      rec: 无
      range: 大于零
      text: '点击修整键进行修整的时候，执行粗修的次数

        '
    - id: S26D22
      name: 粗修进给量
      rec: 无
      range: 大于零
      text: '粗修时每次修整进给量

        '
    - id: S26D23
      name: 粗修速度
      rec: 无
      range: 大于零
      text: '粗修时修整速度

        '
    - id: S26D24
      name: 精修次数
      rec: 无
      range: 大于零
      text: '点击修整键进行修整的时候，执行精修的次数

        磨削中修整的时候，调用此精修次数进行修整

        '
    - id: S26D25
      name: 精修进给量
      rec: 无
      range: 大于零
      text: '精修时每次修整进给量

        '
    - id: S26D26
      name: 精修速度
      rec: 无
      range: 大于零
      text: '精修时修整速度

        '
    - id: S26D27
      name: 修整起点
      rec: 金刚笔在砂轮左侧外5mm处Z轴坐标
      range: 无
      text: '手动将金刚笔开到砂轮左侧合适位置，记录Z轴坐标定位修整起点

        '
    - id: S26D28
      name: 修整终点
      rec: 金刚笔在砂轮右侧外5mm处Z轴坐标
      range: 无
      text: '手动将金刚笔开到砂轮右侧合适位置，记录Z轴坐标作为修整终点

        '
    - id: S26D29
      name: 新砂轮直径
      rec: 测量设置
      range: 大于零
      text: '新砂轮直径，此参数为更换新砂轮后修整时使用的参数，需正确测量后设置

        '
    - id: S26D30
      name: 当前砂轮直径
      rec: 自动累积
      range: 大于零
      text: '新砂轮修整后，每次修整自动累积

        '
    - id: S26D31
      name: 砂轮线速度
      rec: 无
      range: 大于零
      text: '修整时，砂轮的线速度。为保证修整质量，请设置合适数值

        机床配置开启 **恒转速模式** 后此值只读，改为直接输入砂轮转速

        '
    - id: S26D32
      name: 当前接触
      rec: 自动累积
      range: 无
      text: '?ifIsHasU: 此参数输入金刚笔和砂轮前后位置上U轴的坐标

        ?ifIsNotHasU: 此参数输入金刚笔和砂轮前后位置上X轴的坐标

        当前砂轮和金刚笔接触时候的坐标，砂轮状态为旧砂轮时使用此修整位置开始修整。此参数每次修整后会自动计算累计

        '
    - id: S26D33
      name: 初始接触
      rec: 手动测量后输入
      range: 无
      text: '?ifIsHasU: 此参数输入金刚笔和砂轮前后位置上U轴的坐标

        ?ifIsNotHasU: 此参数输入金刚笔和砂轮前后位置上X轴的坐标

        新砂轮时砂轮和金刚笔修整位置，此参数需保证第一次修整时金刚笔从起点到终点修整过程中金刚笔不要接触砂轮

        '
    - id: S26D34
      name: 最小磨削直径
      rec: 计算砂轮最小可用直径
      range: 大于零
      text: '根据砂轮法兰或磨杆尺寸，计算砂轮最小可用到的直径，当砂轮小于此直径时机床将报警

        '
    - id: S26D35
      name: 台阶距左端面 / 距台阶一
      rec: 根据工件图纸
      range: 大于零
      text: '此参数为加工台阶时使用，根据工件需要设置合适数值

        注意：

        磨削台阶需要在外圆磨削后进行，台阶磨削起始位置为外圆当前磨削位置

        '
    - id: S26D36
      name: 磨削方式
      rec: 根据工件长短
      range: 来回/保持
      text: '此参数为磨削时的动作

        来回：进刀后，砂轮水平从磨削起点移动到磨削终点，再反向回来

        保持：砂轮持续进刀，不进行水平移动磨削

        '
    - id: S26D37
      name: 磨削砂轮转速
      rec: 根据需要选择
      range: 大于零
      text: '此参数为磨削砂轮转速

        机床配置开启 **恒转速模式** 后可直接输入；未开启时按砂轮线速度自动换算并只读显示

        '
    - id: S26D38
      name: 修整砂轮转速
      rec: 根据需要选择
      range: 大于零
      text: '此参数为修整时砂轮转速

        机床配置开启 **恒转速模式** 后可直接输入；未开启时按砂轮线速度自动换算并只读显示

        '
    - id: S26D41
      name: 加工中修整补偿
      rec: 无
      range: -0.5~0.5
      text: '此参数为磨削中修整时，对磨削位置的补偿量

        补偿量输入正值为坐标轴正向补偿

        设定值为每次修整的补偿量，推荐在加工中工件尺寸一直往一个方向发展的情况下，对磨削接触点进行调整

        需在机床配置中开启 **修整后磨削位补偿参数显示** 后显示

        '
    - id: S26D42
      name: 初始接触模式
      rec: 无
      range: 台阶一：外圆当前/外圆初始；台阶二：台阶1当前/台阶1初始
      text: '此参数决定磨削台阶时，台阶面初始接触位置的来源

        台阶一页面：**外圆当前**（默认）以外圆面加工后的当前接触位置作为台阶一的初始接触位置；外圆面没有完全磨到尺寸时可选 **外圆初始**，从外圆面的初始接触位置开始加工

        台阶二页面：**台阶1当前**（默认）以台阶一加工后的当前接触位置作为台阶二的初始接触位置；台阶一没有完全磨到尺寸时可选 **台阶1初始**

        '
    - id: S26D43
      name: 台阶终点补偿
      rec: 无
      range: 大于零，小于台阶面长度
      text: '此参数为磨削台阶时，来回拉磨时水平终点位置补偿值

        默认为加工终点为右端面接触位置，如果需要砂轮不完全移动出工件外圆面，可以设置此补偿值

        例如输入5mm，表示来回拉磨时终点再距离右端面5mm处结束

        需要注意，此参数不能设置过大，导致终点位置比起点位置还靠近左端面

        '
    - id: S26D44
      name: 直接靠磨左端
      rec: 无
      range: 否/是
      text: '此参数设置加工完外圆面后，是否直接向左靠磨左端面

        如果需要直接靠磨，磨削进刀量和速度调用左端面的工艺参数进行加工

        注意左端面粗磨精磨都只会加工一个循环

        此模式可以达到清根效果，也可以适当提升加工效率

        '
    - id: S26D45
      name: 外圆终点补偿
      rec: 无
      range: 大于零，小于外圆面长度
      text: '此参数为磨削外圆时，来回拉磨时水平终点位置补偿值

        默认为加工终点为右端面接触位置，如果需要砂轮不完全移动出工件外圆面，可以设置此补偿值

        例如输入5mm，表示来回拉磨时终点再距离右端面5mm处结束

        需要注意，此参数不能设置过大，导致终点位置比起点位置还靠近左端面

        '
    - id: S26D46
      var: INI[28]
      name: 安全位置.C（工件装夹角度）
      rec: 合适上下工件的角度
      range: 0~360
      text: '程序执行结束后，头架会开到此位置

        '
    - id: S26D47
      name: 偏转补偿角
      rec: 砂轮端面外圆都修时设置为0
      range: 0~90
      text: '默认情况下，砂轮侧面每次修整会自动补偿左右端面磨削接触坐标，砂轮外圆面每次修整会自动补偿外圆磨削接触坐标

        正常使用中，外磨砂轮侧面和正面保持90度角，此补偿角设置为0即可

        当砂轮不修整侧面只修整正面，此时砂轮正面和侧面会有一个夹角，角度为砂轮安装时的偏转角

        此时在修整外圆面的时候就需要对左右端面磨削接触位置进行补偿，补偿值和此偏转角度有关

        '
    - id: S26D48
      name: 同修端面
      rec: 如果需要磨削中修整外圆时，同时修整端面部分则选择“是”
      range: 否/是
      text: '默认选择否，则外圆加工中修整时只修整外圆部分，如果需要同时修整端面，则选择是，端面修整次数为端面修整界面设置的精修次数

        '
    - id: S26D53
      name: 头架角度
      range: 0~360
      unit: °
      ac: 4
      text: '机床配置开启"修外磨时头架保持固定角度"后显示：修整外圆砂轮时头架转到并保持在此角度，避免工件或卡爪与修整器干涉

        '
      var: DRESSER[56]
- h3: 台阶一 / 台阶二
  body:
  - img:
      src: center_step.png
      h: 300
  - note: '用于外圆上有一段或两段不同直径台阶的工件。在外圆参数页右侧点击 **台阶一 / 台阶二** 进入，加工选择界面选中 **外圆台阶** 后执行

      每个台阶有独立的精磨、终磨工艺；磨削起点、终点按距左端面距离和台阶长度自动计算并只读显示

      '
  - params:
    - id: S26D54
      name: 使能
      range: 关/开
      ac: 4
      text: '打开后加工外圆台阶时磨削该台阶，关闭则跳过

        '
      var: PROCESS[25]、PROCESS[26]
    - id: S26D55
      name: 台阶长度
      range: 0~500
      unit: mm
      ac: 4
      text: '台阶在 Z 向的长度，与距左端面距离一起决定磨削起点和终点

        '
      var: INI[13]、TECHNOLOGY[186]
    - id: S26D56
      name: 保持分段
      range: 1~10
      ac: 4
