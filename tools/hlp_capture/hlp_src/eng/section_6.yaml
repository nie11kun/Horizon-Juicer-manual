title: Tooth Profile Screen
head1: HMI Screen Parameters
refs: 'For the operating steps see [Wheel Dressing](section_10.html)

  For interpolation dressing, click the **Triangle / Trapezoid / Arc / planet gear** softkey on the right of the dressing screen to open the page of that profile and set the profile to be dressed onto the wheel; the drawing on the left of each page shows where each dimension is

  After changing profile parameters the wheel must be dressed once before the new profile is on the wheel

  '
blocks:
- h3: Triangle profile
  marks:
  - ifIsAllShape
  body:
  - img:
      src: shape_tri_int.png
      h: 300
  - note: 'For ordinary V threads (metric, inch, etc.). After **Triangular - tooth profile dressing mode selection** is enabled in the machine configuration, **Nomal** or **Extended** can be selected in the upper left corner:

      **Nomal**: one flank angle per side + tooth height

      **Extended**: two flank sections per side with different angles (Clear- / Flank-); the section near the wheel tip (thread root) is the Clear- section, so a profile with a groove at the thread root can be dressed

      '
  - params:
    - id: S6D1
      name: Tooth base arc rad / bottom R
      range: 0~20
      unit: mm
      var: SHAPE_MODEL[101]
      ac: 4
      text: 'Radius at the wheel tip (corresponding to the thread root of the workpiece); set according to the root radius on the drawing

        '
    - id: S6D2
      name: 'left slash Ang / right slash Ang (Extended - Clear-Left angle / Clear-Right angle / Flank-Left angle / Flank-Right angle)'
      rec: according to the drawing, e.g. metric 30°/30°
      range: 0~90
      unit: °
      var: SHAPE_MODEL[102]、SHAPE_MODEL[103]、SHAPE_MODEL[106]、SHAPE_MODEL[107]
      ac: 4
      text: 'Angle between each flank and the vertical (half angle); equal on both sides for a symmetric profile

        In Extended mode **Clear-** is the section near the wheel tip and **Flank-** the section near the wheel root

        '
    - id: S6D3
      name: Height (Extended mode Clear-Tooth height / total-Tooth height)
      range: 0~50
      unit: mm
      var: SHAPE_MODEL[104]、SHAPE_MODEL[108]
      ac: 4
      text: 'Height of the profile dressed onto the wheel; slightly larger than the thread depth so that only the flanks are in contact when grinding

        In Extended mode **Clear-Tooth height** is the height of the Clear- section and **total-Tooth height** the whole tooth height

        '
    - id: S6D4
      name: Left tooth root rad / Right tooth root rad
      range: 0~20
      unit: mm
      var: SHAPE_MODEL[2] / SHAPE_MODEL[3]
      ac: 4
      text: 'Transition radii on both sides of the wheel root (corresponding to the chamfer at the thread crest); enter 0 if not needed

        '
    - id: S6D5
      name: Taper
      range: -90~90
      var: SHAPE_MODEL[6]
      ac: 4
      text: 'Dresses a tapered wheel shape (line through the tips inclined), for special wheels for taper threads; enter 0 for ordinary threads

        '
    - id: S6D6
      name: extension line angle (addon length)
      rec: '90'
      range: 0~90
      unit: °
      var: SHAPE_MODEL[105]
      ac: 4
      text: 'Angle of the extension beyond the tooth height (outer contour of the wheel); 90° extends straight outwards

        '
    - id: S6D34
      name: triangle mode (Nomal / Extended)
      range: Nomal / Extended
      ac: 4
      var: DRESSER[112]
      text: '**Nomal**: triangle profile with one flank section per side

        **Extended**: triangle profile with two flank sections of different angle per side

        Shown after **Triangular - tooth profile dressing mode selection** is enabled in the machine configuration; otherwise the triangle profile is always Nomal

        '
- h3: Trapezoid profile
  marks:
  - ifIsAllShape
  body:
  - img:
      src: shape_trap_int.png
      h: 300
  - note: 'For trapezoidal threads, worms and other flat-bottom profiles. After **Trapezoidal - tooth profile dressing mode selection** is enabled in the machine configuration, the upper left corner offers:

      **Nomal**: trapezoid with one flank section per side

      **Extended**: trapezoid with two flank sections of different angle per side, with flat or tapered top

      **Hat**: trapezoid defined by width and height at the pitch diameter (with a cap-shaped transition at the top)

      '
  - params:
    - id: S6D7
      name: Flat (tooth bottom length)
      range: 0~20
      unit: mm
      var: SHAPE_MODEL[91]
      ac: 4
      text: 'Width of the flat at the wheel tip (corresponding to the thread root of the workpiece); set according to the root width

        '
    - id: S6D8
      name: left Top R / right Top R
      range: 0~20
      unit: mm
      var: SHAPE_MODEL[92] / SHAPE_MODEL[93]
      ac: 4
      text: 'Transition radii at both ends of the flat

        '
    - id: S6D9
      name: 'left slash Ang / right slash Ang (Extended - Clear-Left angle / Clear-Right angle / Flank-Left angle / Flank-Right angle)'
      range: 0~90
      unit: °
      var: SHAPE_MODEL[94]、SHAPE_MODEL[95]、SHAPE_MODEL[98]、SHAPE_MODEL[99]
      ac: 4
      text: 'Angle between each flank of the trapezoid and the vertical (half angle); for a 30° trapezoidal thread enter 15° on each side

        '
    - id: S6D10
      name: Height (Extended mode Clear-Tooth height / total-Tooth height)
      range: 0~50
      unit: mm
      var: SHAPE_MODEL[96]、SHAPE_MODEL[100]
      ac: 4
      text: 'Height of the profile dressed onto the wheel; slightly larger than the thread depth

        '
    - id: S6D11
      name: Left tooth root rad / Right tooth root rad
      range: 0~20
      unit: mm
      var: SHAPE_MODEL[4] / SHAPE_MODEL[5]
      ac: 4
      text: 'Transition radii on both sides of the wheel root; enter 0 if not needed

        '
    - id: S6D12
      name: Taper / addon length (extension line angle)
      range: taper -90~90, angle 0~90
      var: SHAPE_MODEL[12] / SHAPE_MODEL[97]
      ac: 4
      text: 'Same meaning as for the triangle profile: the taper is for special taper wheels (enter 0 for ordinary threads); the extension line angle is the angle of the contour beyond the tooth height

        '
    - id: S6D13
      name: toolth Top (top mode)
      range: Horizon / Taper
      var: SHAPE_MODEL[25]
      ac: 4
      text: 'The wheel root (corresponding to the thread crest) is flat (Horizon) or tapered (Taper)

        '
    - id: S6D14
      name: Hat trapezoid parameters
      range: according to the drawing
      unit: mm / °
      var: SHAPE_MODEL[11]~SHAPE_MODEL[22]
      ac: 4
      text: 'Shown when the trapezoid mode is **Hat**; enter from the workpiece drawing:

        **Pitch**, **Taper**: pitch and taper of the profile

        **Mid-Dia Width / Mid-Dia Height**: tooth width at the pitch diameter and its height from the tooth bottom

        **Bottom-Height**: height of the flat tooth bottom

        **Lift Angle / Right Angle**: half angles of the two flanks

        **Lift Top-R / Right Top-R, Lift Bottom-R / Right Bottom-R**: transition radii at the tip and bottom

        **extend Angle**: angle of the contour outside the profile

        '
    - id: S6D35
      name: Mode Choice (trapezoid mode)
      range: Nomal / Extended / Hat
      ac: 4
      var: SHAPE_MODEL[26]
      text: '**Nomal**: trapezoid with one flank section per side

        **Extended**: trapezoid with two flank sections per side

        **Hat**: trapezoid defined by width and height at the pitch diameter

        Shown after **Trapezoidal - tooth profile dressing mode selection** is enabled in the machine configuration; otherwise the trapezoid profile is always Nomal

        '
- h3: Arc profile (ball screw / ball nut)
  body:
  - img:
      src: shape_arc_int.png
      h: 300
  - note: 'For gothic-arch (double arc) raceways of ball screws and ball nuts. Each item of the table has three columns **init / fix / curt**:

      **init**: standard value (from the drawing or calculated from the ball diameter)

      **fix**: correction entered from the measurement report after machining

      **curt**: init + fix, the value actually used for dressing (read-only)

      '
  - params:
    - id: S6D52
      name: Ang of Arc (arc angle)
      rec: according to the arc range to be dressed
      range: 20~90
      unit: °
      var: SHAPE_MODEL[89]
      ac: 4
      text: 'Angle covered by the dressed raceway arc (measured from the vertical); 90° dresses a complete semicircle

        '
    - id: S6D55
      name: Auto calculate
      range: OFF / ON
      var: DRESSER[40]
      ac: 4
      text: 'When switched on, the initial arc radius and horizontal offset are calculated from the ball diameter and contact angle:

        arc radius = standard switch factor × ball diameter / 2

        horizontal offset = (arc radius - ball diameter / 2) × sin(contact angle)

        '
    - id: S6D62
      name: Current Std. (standard switch factor)
      rec: '1.11'
      range: 0.9~1.2
      var: DRESSER[113]
      ac: 4
      text: 'Ratio of arc radius to ball radius (conformity factor) used for automatic calculation; select according to the raceway design standard, 1.11 is common

        '
    - id: S6D56
      name: ball Dia (ball diameter)
      range: 0~50
      unit: mm
      var: SHAPE_MODEL[23]
      ac: 4
      text: 'Ball diameter, needed when Auto calculate is on

        '
    - id: S6D57
      name: Touch Ang (ball contact angle)
      rec: 45°
      range: 0~90
      unit: °
      var: SHAPE_MODEL[24]
      ac: 4
      text: 'Contact angle between ball and raceway, needed when Auto calculate is on

        '
    - id: S6D40
      name: left init R / right init R
      rec: from the drawing or calculated automatically
      range: 0~50
      unit: mm
      var: SHAPE_MODEL[113] / SHAPE_MODEL[114]
      ac: 4
      text: 'Standard values of the left and right raceway arc radius

        '
    - id: S6D42
      name: fix left R / fix right R
      rec: according to the measurement report
      range: -10~10
      unit: mm
      var: SHAPE_MODEL[117] / SHAPE_MODEL[118]
      ac: 4
      text: 'Correction of the left and right arc radius from the measurement report after machining, added to the initial value

        '
    - id: S6D44
      name: curt left R / curt right R
      range: read-only
      unit: mm
      readonly: true
      text: 'Initial value + correction; the arc radius actually used for dressing

        '
      var: SHAPE_MODEL[81]、SHAPE_MODEL[82]
    - id: S6D46
      name: left horizon offset / right horizon offset (theoretical)
      rec: from the drawing or calculated automatically
      range: 0~10
      unit: mm
      var: SHAPE_MODEL[115] / SHAPE_MODEL[116]
      ac: 4
      text: 'Standard horizontal offset of the left and right arc centre from the profile centre

        '
    - id: S6D48
      name: fix left hori-offset / fix right hori-offset
      rec: according to the measurement report
      range: -10~10
      unit: mm
      var: SHAPE_MODEL[119] / SHAPE_MODEL[120]
      ac: 4
      text: 'Correction of the horizontal offset from the measurement report, added to the theoretical value

        '
    - id: S6D50
      name: curt left hori-offset / curt right hori-offset
      range: read-only
      unit: mm
      readonly: true
      text: 'Theoretical value + correction; the horizontal offset actually used for dressing

        '
      var: SHAPE_MODEL[83]、SHAPE_MODEL[84]
    - id: S6D60
      name: Chamfer Mode
      range: Bevel / Fillet
      var: SHAPE_MODEL[28]
      ac: 4
      text: 'Transition from both sides of the raceway to the wheel periphery; select according to the drawing

        **Bevel**: defined by the transition line angle and length

        **Fillet**: defined by the fillet radius; the dressing wheel radius must be smaller than the fillet radius

        '
    - id: S6D53
      name: slash Ang / slash length (transition line)
      range: angle 0~90, length 0~20
      var: SHAPE_MODEL[85] / SHAPE_MODEL[88]
      ac: 4
      text: 'Angle of the bevel (to the horizontal, 0° dresses horizontally) and length of the line; the length must be at least one dressing wheel radius

        '
    - id: S6D61
      name: Fillet Radius
      range: 0~20
      unit: mm
      var: SHAPE_MODEL[29]
      ac: 4
      text: 'Transition radius when the chamfer mode is Fillet

        '
    - id: S6D58
      name: Shape Rotate (profile rotation angle)
      rec: fine adjustment according to measurement
      range: -5~5
      unit: °
      var: SHAPE_MODEL[8]
      ac: 4
      text: 'Rotates the whole profile by a small angle without changing the arc radii, to make the left and right contact angles symmetric

        Positive rotates counter-clockwise, negative clockwise; only for small adjustments

        '
    - id: S6D59
      name: Move Right part (right side height fine adjustment)
      range: -0.2~0.2
      unit: mm
      var: SHAPE_MODEL[90]
      ac: 4
      text: 'Fine adjustment of the height of the right side of the profile when the contact angle must be changed without changing the arcs: positive raises the right side, negative lowers it

        '
    - id: S6D63
      name: extend Angle (extension line angle)
      range: 0~90
      unit: °
      var: SHAPE_MODEL[112]
      ac: 4
      text: 'Angle of the contour extension outside the raceway

        '
- h3: Planet gear profile
  marks:
  - ifIsExternal
  body:
  - img:
      src: shape_planet.png
      h: 300
  - note: 'For planetary roller screws and similar profiles; additional profiles must be enabled in the machine configuration (**Open additional tooth profile**). Click the more-menu softkey on the right of the dressing screen and select **planet gear**

      The init / fix / curt columns have the same meaning as for the arc profile

      '
  - params:
    - id: S6D20
      name: left/right R and left/right horizon offset (init / fix / curt)
      range: radius 0~100, fix -10~10
      unit: mm
      var: SHAPE_MODEL[31]~SHAPE_MODEL[42]
      ac: 4
      text: 'Radius and horizontal offset of the arcs on both sides of the planet profile; enter the initial values from the drawing and the fix values from the measurement report

        '
    - id: S6D21
      name: Ang of Arc / slash Ang / slash length
      range: arc angle 45~90
      var: SHAPE_MODEL[43]~SHAPE_MODEL[45]
      ac: 4
      text: 'Angular range of the arc section and the angle and length of the transition lines on both sides

        '
    - id: S6D22
      name: Tip transition
      range: Arc / flat top
      var: SHAPE_MODEL[50]、SHAPE_MODEL[46]、SHAPE_MODEL[47]、SHAPE_MODEL[48]、SHAPE_MODEL[49]
      ac: 4
      text: '**Arc**: the tip is an arc; enter the arc radius

        **flat top**: the tip is flat; enter the pitch diameter, minor diameter and pitch contact angle of the workpiece, and the program calculates the tip position

        '
- h3: Multi-tooth dressing (multi-rib wheel)
  body:
  - note: 'Shown at the lower left of the profile pages after it is enabled in the machine configuration; used to dress several ribs onto the wheel (multi-rib wheel) so that several threads are ground at once for higher efficiency

      '
  - params:
    - id: S6D30
      name: Multi Tooth
      range: No / Yes
      ac: 4
      text: 'With Yes, several identical profiles are dressed side by side across the wheel width according to the number of teeth below

        Shown on the corresponding profile page after **Triangular - tooth profile dressing mode selection**, **Trapezoidal - tooth profile dressing mode selection** or **Double arc tooth profile - extended mode** is enabled in the machine configuration

        '
    - id: S6D31
      name: Tooth Num
      range: ≥ 1
      ac: 4
      text: 'Number of ribs to be dressed onto the wheel; the wheel width must hold number × pitch

        Shown on the corresponding profile page after **Triangular - tooth profile dressing mode selection**, **Trapezoidal - tooth profile dressing mode selection** or **Double arc tooth profile - extended mode** is enabled in the machine configuration

        '
    - id: S6D32
      name: Interval Pitch
      range: 0~5
      ac: 4
      text: 'Number of pitches between two neighbouring ribs; 0 means the ribs follow each other without gap

        Shown on the corresponding profile page after **Triangular - tooth profile dressing mode selection**, **Trapezoidal - tooth profile dressing mode selection** or **Double arc tooth profile - extended mode** is enabled in the machine configuration

        '
    - id: S6D33
      name: Height offset (tooth height compensation)
      range: -1~1
      unit: mm
      ac: 4
      text: 'Tooth height reduced from rib to rib, so that the rib that meets the workpiece first takes more stock; with a positive value the ribs further left are lower

        Shown on the corresponding profile page after **Triangular - tooth profile dressing mode selection**, **Trapezoidal - tooth profile dressing mode selection** or **Double arc tooth profile - extended mode** is enabled in the machine configuration

        '
